<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Vet-oppdrag – administrasjon</title>
<meta name="theme-color" content="#2f5d50">
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1f2a26; --muted:#6b736f; --line:#e2ddd2;
  --brand:#2f5d50; --brand-2:#e7efe9; --warn:#a4541d; --warn-2:#f7e9dd; --ok:#2f6b3a; --ok-2:#e3f0e3;
  --grey-2:#ecebe6; --blue:#2c5a85; --blue-2:#e3ecf5; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 96px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{font-weight:700;color:var(--brand);letter-spacing:.2px}
.beta{font-size:11px;background:var(--warn-2);color:var(--warn);padding:2px 8px;border-radius:99px;font-weight:600}
.role{margin-left:auto;display:flex;background:var(--grey-2);border-radius:99px;padding:3px}
.role button{border:0;background:transparent;padding:5px 12px;border-radius:99px;cursor:pointer;font-size:13px;color:var(--muted)}
.role button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:6}
nav.tabs .in{max-width:760px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;cursor:pointer;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--brand);font-weight:600}
h1{font-size:22px;margin:18px 0 10px}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.right{text-align:right}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600}
.btn:hover{border-color:#cfc8b9}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.warn{color:var(--warn);border-color:#e6cbb4}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand);padding:6px 8px}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:78px;z-index:7;border-radius:99px;padding:13px 18px;box-shadow:0 4px 14px rgba(47,93,80,.35)}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.s-bestilt{background:var(--blue-2);color:var(--blue)}
.s-utsatt{background:var(--warn-2);color:var(--warn)}
.s-fullfort{background:var(--ok-2);color:var(--ok)}
.s-avlyst{background:var(--grey-2);color:var(--muted)}
.s-fakturert{background:var(--brand-2);color:var(--brand)}
.seg{display:flex;background:var(--grey-2);border-radius:10px;padding:3px;margin:4px 0 12px}
.seg button{flex:1;border:0;background:transparent;padding:7px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.item{cursor:pointer}
.item:hover{border-color:#cfc8b9}
.lines{width:100%;border-collapse:collapse}
.lines td,.lines th{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.lines th{font-size:12px;color:var(--muted);text-align:left;font-weight:600}
.lines input[type=number]{width:74px;padding:6px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px}
.x:hover{color:var(--warn)}
.picker{position:relative}
.picker .list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:10px;max-height:240px;overflow:auto;z-index:4;box-shadow:0 6px 18px rgba(0,0,0,.1)}
.picker .opt{padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.picker .opt:hover{background:var(--brand-2)}
.dyr{border:1px dashed #d7d0c1;border-radius:10px;padding:10px;margin-bottom:10px;background:#fffefb}
.lock{background:var(--grey-2);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:13px}
.banner{background:var(--warn-2);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13px;margin:12px 0}
.total{font-weight:700;font-size:16px}
.ts{font-size:12px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(20,25,23,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:620px){.modal-bg{align-items:center}}
.modal{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px;max-height:88vh;overflow:auto}
@media(min-width:620px){.modal{border-radius:16px}}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer}
.choice.on{border-color:var(--brand);background:var(--brand-2)}
.choice input{margin-top:3px}
pre.out{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;max-height:260px;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.login{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{max-width:380px;width:100%;text-align:center}
.login-logo{width:72px;height:72px;border-radius:18px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:34px;font-weight:700}
.login h1{margin:0 0 6px;font-size:26px}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid #d6d0c4;border-radius:99px;padding:12px 22px;font-weight:600;cursor:pointer;font-size:15px;margin-top:22px}
.gbtn:hover{border-color:#bdb5a5}
.syncbar{max-width:760px;margin:0 auto;padding:4px 14px 6px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#b8b2a6;flex:none}
.dot.ok{background:#3c8a4a}.dot.busy{background:#d49a2a}.dot.err{background:#c0472c}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:0;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.chip{border:1px solid #bcd3c8;background:var(--brand-2);color:var(--brand);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600;cursor:pointer}
.chip.x{background:#fff;border-color:var(--line);color:var(--ink);font-weight:500}
@media print{header.top,nav.tabs,.fab,.noprint{display:none!important}}
.kgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.kh{text-align:center;font-size:11px;color:var(--muted);padding:2px 0;font-weight:600;text-transform:uppercase}
.kd{position:relative;border:1px solid transparent;background:#fff;border-radius:8px;aspect-ratio:1/0.9;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;padding:0}
.kd.ut{opacity:.4}
.kd.vakt{background:var(--warn-2)}
.kd.idag span{font-weight:700;color:var(--brand)}
.kd.valgt{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.kd i{font-style:normal;font-size:10px;font-weight:700;background:var(--brand);color:#fff;border-radius:99px;min-width:16px;padding:0 4px;margin-top:2px;line-height:15px}
.kleg{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px}
.kleg.vakt{background:var(--warn-2);border:1px solid #e6cbb4}
.kleg.n{background:var(--brand);color:#fff;font-size:9px;font-weight:700;text-align:center;line-height:12px;border-radius:99px;width:14px}
tr.item{cursor:pointer} tr.item:hover td{background:#faf8f3}
.role button{font-size:12px}
nav.tabs button{font-size:11.5px}
.logo{white-space:nowrap}
.medrad{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:6px;background:#fff}
.medgrid{display:grid;grid-template-columns:90px 1fr;gap:8px;margin-top:4px}
.medgrid input{padding:6px 8px;margin-top:2px;min-width:0}
.medgrid label{display:block}
/* ===== Alternativ A «Arbeidsdagen» ===== */
/* Felt: 16 px hindrer at iPhone zoomer inn når et felt får fokus */
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],input[type=password],input[type=email],input[type=tel],input[type=datetime-local],select,textarea{font-size:16px;min-height:44px}
input[type=password],input[type=email],input[type=tel],input[type=datetime-local]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
textarea{min-height:76px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
input.tom{border-color:var(--warn);background:var(--warn-2)}

/* Trykkflater på minst 44 piksler */
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.sm{min-height:40px;padding:7px 12px;font-size:14px}
.btn.stor{min-height:52px;font-size:16px}
.btn.ikon{min-width:44px;padding:0 10px}
.btn.ghost{padding:8px 10px}
a.btn{text-decoration:none;color:var(--ink)}
a.btn.primary{color:#fff}
.x{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;font-size:22px;padding:0}
.chip{min-height:40px;padding:8px 14px;font-size:14px;display:inline-flex;align-items:center}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.seg button{min-height:40px;font-size:14px}
.linkbtn{font-size:15px;padding:11px 6px;margin:-11px -6px;min-height:0}
.syncbar .linkbtn{font-size:12px;padding:6px 4px;margin:-6px -4px}
label.f{font-size:13px}
.ts{font-size:13px}
.picker .opt{min-height:44px;align-items:center;padding:10px 12px}
.tilbake{margin-top:10px}

/* Bunnmeny med pluss-knapp i midten */
nav.tabs{padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{min-height:56px;font-size:12px}
nav.tabs button.tabny{color:#fff}
.tabny span{width:52px;height:52px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(47,93,80,.35);margin-top:-14px}
header.top{padding-top:env(safe-area-inset-top)}
.wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body.bred .wrap,body.bred .top-in,body.bred .syncbar,body.bred nav.tabs .in{max-width:1100px}
a{color:var(--brand)}
.sub .pris-lenke{font-size:13px;font-weight:600;color:var(--muted);text-decoration:underline dotted;text-underline-offset:3px;padding:10px 4px;margin:-10px -4px}
.toast{bottom:calc(92px + env(safe-area-inset-bottom))}
.modal{padding-bottom:calc(18px + env(safe-area-inset-bottom))}

/* Lister med rader */
.list0{padding:0;overflow:hidden}
.rad{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;font:inherit;color:inherit}
button.rad{cursor:pointer}
button.rad:hover{background:#faf8f3}
.list0>.rad:first-child{border-top:0}
.rad .tid{min-width:48px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--brand);font-size:14px}
.rad .sub{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.pil{color:#b5ae9f;flex:none}
.blk{display:block}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin:0}
.tall{background:var(--warn);color:#fff;border-radius:99px;font-size:12px;font-weight:700;padding:1px 8px}
.varsel{color:var(--warn);font-weight:600}
.sub.varsel{color:var(--warn)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.2px}
button.card{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}

/* I dag */
.gj{border-color:#e6cbb4}
.gjhode{padding:10px 14px 6px}
.neste{border:2px solid var(--brand);box-shadow:0 2px 10px rgba(47,93,80,.12)}
.neste h2{font-size:21px;margin:2px 0 4px}
.s-pabegynt{background:#fdf0d5;color:#8a5a00}

/* Besøket */
body.besok nav.tabs{display:none}
.handling{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px rgba(0,0,0,.05)}
.handling .in{max-width:760px;margin:0 auto;display:flex;gap:8px}
.handling .btn{min-height:52px;font-size:16px}
/* Skjul den faste knappen mens tastaturet er oppe */
@media (hover:none) and (pointer:coarse){body.besok:has(main input:focus, main textarea:focus) .handling{display:none}}
.dyrkort{padding:12px 14px}
.dyrkort .endre{color:var(--brand);font-weight:600;font-size:14px}
.tidl{color:var(--blue)}
.dyr.aapen{border:2px solid var(--brand);background:#fff;padding:12px}
.sg{display:inline-flex;flex-wrap:wrap;background:var(--grey-2);border-radius:10px;padding:3px;gap:2px}
.sg button{border:0;background:transparent;min-height:40px;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer;font-size:14px}
.sg button.on{background:var(--brand);color:#fff}
.valgt{border:1px solid var(--brand);background:var(--brand-2);border-radius:10px;padding:8px 12px;min-height:48px}
.tilleggsrad{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px 0;border-top:1px solid var(--line)}
.linje{align-items:center}
.linje .antall{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.linje .antall input{width:76px;text-align:center;font-weight:700}
.linje .pris{width:96px;min-height:36px;padding:4px 8px;display:inline-block}
.sel-liten{width:auto;max-width:100%;padding:6px 10px}
.medgrid{grid-template-columns:96px 1fr}
.kv{font-size:15px;gap:6px 14px;grid-template-columns:auto minmax(0,1fr)}
.kv>div{min-width:0;overflow-wrap:anywhere}
.kv select{width:100%;max-width:100%}
.grid2>*,.grid3>*,.medgrid>*{min-width:0}
img,table{max-width:100%}

/* Fakturering på stor skjerm */
.fakt{display:block}
@media(min-width:900px){body.bred .fakt{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:10px;align-items:start}body.bred .fakt .card{margin:0}}
@media print{.handling{display:none!important}}

/* Fakturering: sum for perioden */
.sumkort .stortall{font-size:28px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
/* Lønnsberegning */
.lonnhode{padding:12px 14px 8px}
.fordeling{display:flex;height:14px;border-radius:7px;overflow:hidden;margin-top:10px;gap:2px}
.fordeling span{display:block;min-width:3px}
.lonnrad{min-height:50px}
.lonnrad strong{font-variant-numeric:tabular-nums;white-space:nowrap}
.lonnrad.hoved strong{font-size:19px;color:var(--brand)}
.prikk{width:12px;height:12px;border-radius:3px;flex:none}
.kv.lonnkv{grid-template-columns:minmax(0,1fr) auto}
.lonnkv>div:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Innloggingsbildet kan rulles når innholdet er høyere enn skjermen (stor skrift, lav skjerm eller skjermtastatur).
   margin:auto sentrerer kortet når det er plass, uten at toppen klippes når det ikke er plass. */
.login{flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom))}
.login-card{margin:auto 0;flex-shrink:0}
/* Plass under innholdet så høyt som skjermtastaturet (settes fra sync.js), så knappen kan rulles opp over tastaturet */
.login::after{content:'';flex:0 0 auto;height:var(--tastatur,0px)}
/* På telefon og nettbrett står kortet øverst, så det ikke flytter seg når tastaturet kommer og går */
@media (hover:none) and (pointer:coarse){ .login-card{margin:0} }

/* Avtaletekst (innlogging og Mer → Avtale) */
.login.login-bred .login-card{max-width:760px}
.avtaletekst{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;font-size:14px;line-height:1.5;margin:10px 0}
.avtaletekst h2{font-size:18px;margin:16px 0 6px}.avtaletekst h3{font-size:16px;margin:14px 0 6px}.avtaletekst h4,.avtaletekst h5{font-size:15px;margin:12px 0 4px}
.avtaletekst p{margin:6px 0}.avtaletekst ul,.avtaletekst ol{padding-left:20px;margin:6px 0}.avtaletekst ul.oppgaver{list-style:none;padding-left:4px}
.mdtabell{overflow-x:auto;margin:8px 0}.mdtabell table{border-collapse:collapse;width:100%;font-size:13px}
.mdtabell th,.mdtabell td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}.mdtabell th{background:var(--grey-2)}
/* Adminsiden: bred skjerm, tabeller og skjema i to kolonner */
body.admin .wrap,body.admin .top-in{max-width:1240px}
body.admin .wrap{padding-bottom:40px}
body.admin .toast{bottom:24px}
.top-in .afaner{display:flex;gap:2px;flex-wrap:wrap;margin-left:12px}
.afaner button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer;font-size:14px;min-height:40px}
.afaner button.on{background:var(--brand-2);color:var(--brand)}
.afaner button:hover{color:var(--ink)}
.tabellramme{overflow-x:auto;padding:0}
.atabell{width:100%;border-collapse:collapse;font-size:14px}
.atabell th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card);position:sticky;top:0}
.atabell td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.atabell tr:last-child td{border-bottom:0}
.atabell tr.klikk{cursor:pointer}.atabell tr.klikk:hover td{background:var(--brand-2)}
.atabell .hoyre{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.atabell select{min-width:130px;padding:6px 8px}
.atabell input[type=checkbox]{width:20px;height:20px}
.atabell .sumrad td{background:var(--grey-2)}

<script>
// ================= Enkel og trygg visning av Markdown =================
// Brukes for avtaletekster i appen og på adminsiden. All tekst escapes først, så ingen HTML fra teksten slipper gjennom.
// Støtter overskrifter, avsnitt, fet skrift, lenker (bare http/https), punkt- og nummerlister, avkrysningslister, tabeller og skillelinjer.
function mdTilHtml(md){
  const e = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const inl = s => e(s)
    .replace(/\*\*([^*]+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s"]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const celler = l => l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
  const linjer = String(md||'').replace(/\r\n?/g,'\n').split('\n');
  let ut='', avsnitt=[], liste=null;
  const lukkAvsnitt = () => { if(avsnitt.length){ ut+='<p>'+inl(avsnitt.join(' '))+'</p>'; avsnitt=[]; } };
  const lukkListe = () => { if(liste){ ut+=`<${liste.type}${liste.oppgaver?' class="oppgaver"':''}>${liste.punkter.join('')}</${liste.type}>`; liste=null; } };
  const punkt = (type, html, oppgave) => { lukkAvsnitt(); if(!liste || liste.type!==type){ lukkListe(); liste={type, punkter:[], oppgaver:false}; } if(oppgave) liste.oppgaver=true; liste.punkter.push('<li>'+html+'</li>'); };
  for(let i=0;i<linjer.length;i++){
    const l=linjer[i]; let m;
    if(!l.trim()){ lukkAvsnitt(); lukkListe(); continue; }
    if((m=l.match(/^(#{1,6})\s+(.*)$/))){ lukkAvsnitt(); lukkListe(); const n=Math.min(m[1].length+1,5); ut+=`<h${n}>${inl(m[2])}</h${n}>`; continue; }
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){ lukkAvsnitt(); lukkListe(); ut+='<hr>'; continue; }
    if(/^\s*\|/.test(l) && i+1<linjer.length && /^\s*\|?\s*:?-{3,}/.test(linjer[i+1])){
      lukkAvsnitt(); lukkListe();
      const hode=celler(l); i+=2; const rader=[];
      while(i<linjer.length && /^\s*\|/.test(linjer[i])){ rader.push(celler(linjer[i])); i++; }
      i--;
      ut+='<div class="mdtabell"><table><thead><tr>'+hode.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>'+
        rader.map(r=>'<tr>'+hode.map((_,k)=>'<td>'+inl(r[k]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
      continue;
    }
    if((m=l.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/))){ punkt('ul', (m[1]===' '?'☐ ':'☑ ')+inl(m[2]), true); continue; }
    if((m=l.match(/^\s*[-*]\s+(.*)$/))){ punkt('ul', inl(m[1])); continue; }
    if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){ punkt('ol', inl(m[1])); continue; }
    if(liste && /^\s{2,}\S/.test(l)){ const s=liste.punkter.pop(); liste.punkter.push(s.replace(/<\/li>$/,' '+inl(l.trim())+'</li>')); continue; }
    lukkListe(); avsnitt.push(l.trim());
  }
  lukkAvsnitt(); lukkListe();
  return ut;
}

'use strict';
// ================= Vet-oppdrag – administrasjon =================
// Egen side for den som leverer Vet-oppdrag. Alt går gjennom admin-funksjonene i databasen (schema_v4.sql),
// som krever administrator med to-trinns innlogging. Nøkkelen med full tilgang ligger aldri her.
const SB_URL = 'https://tqevdxcoiotqxascdbxj.supabase.co';
const SB_KEY = 'sb_publishable_j1oPE5y9maDECOlNxyPxyg_RNAm9fJ_';
const APP_URL = 'https://plompage.github.io/vet-oppdrag/';
const sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:false, storageKey:'vet-oppdrag-admin'}});

// ---------- Hjelpere ----------
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const js = s => esc(JSON.stringify(String(s??'')));
const kr = n => (Number(n)||0).toLocaleString('nb-NO',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtD = s => { if(!s) return ''; const [y,m,d]=String(s).slice(0,10).split('-'); return `${d}.${m}.${y}`; };
const fmtTs = s => s ? new Date(s).toLocaleString('nb-NO',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '–';
const MND = ['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];
const verdi = id => { const el=document.getElementById(id); return el ? (el.type==='checkbox' ? el.checked : el.value.trim()) : null; };
const slug = s => String(s||'').toLowerCase().replace(/[æ]/g,'ae').replace(/[ø]/g,'o').replace(/[å]/g,'a').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),2600); }
function modal(html){ document.getElementById('modal').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal(){ document.getElementById('modal').innerHTML=''; }
function lastNedBlob(blob, navn){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=navn; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800); }
const feiltekst = e => { const m=String(e&&e.message||e||''); if(/fetch|network/i.test(m)) return 'Ingen kontakt med serveren.'; if(/function .* does not exist|schema cache/i.test(m)) return 'Databasen er ikke oppdatert. Kjør schema_v4.sql i Supabase.'; return m; };
async function rpc(navn, args){ const r=await sb.rpc(navn, args||{}); if(r.error) throw r.error; return r.data; }
async function gjor(fn, ok){ try{ await fn(); if(ok) toast(ok); return true; }catch(e){ toast(feiltekst(e)); return false; } }

// ---------- Tilstand ----------
const A = {me:null, fane:'kunder', valgt:null, praksiser:[], brukere:[], avtaler:{versjoner:[],aksept:[]}, logg:[],
  kf:{status:'alle', sok:''}, bf:{praksis:'', sok:''}, utkast:null, kopi:{valgt:null, periode:'alt', fra:'', til:''}, ab:{mnd:'', mva:false, test:false, rader:[]}};

// ---------- Innlogging ----------
const loginEl = () => document.getElementById('login');
function loginBody(h){ document.getElementById('login-body').innerHTML=h; document.getElementById('login-err').textContent=''; loginEl().style.display='flex'; }
const loginErr = t => { document.getElementById('login-err').textContent=t; };
function visLogin(){
  loginBody(`<form onsubmit="event.preventDefault();loggInn()"><label class="f">E-post</label><input type="text" id="li-e" autocomplete="username" inputmode="email">
    <label class="f">Passord</label><input type="password" id="li-p" autocomplete="current-password">
    <button class="btn primary" style="width:100%;margin-top:16px" id="li-b">Logg inn</button></form>`);
}
async function loggInn(){
  const {error}=await sb.auth.signInWithPassword({email:verdi('li-e'), password:document.getElementById('li-p').value});
  if(error) return loginErr(feiltekst(error)); start();
}
function visMfa(){
  loginBody(`<p class="small">Skriv inn koden fra autentiseringsappen.</p><form onsubmit="event.preventDefault();bekreftMfa()"><label class="f">Sekssifret kode</label>
    <input type="text" id="mk-c" inputmode="numeric" autocomplete="one-time-code" maxlength="6"><button class="btn primary" style="width:100%;margin-top:14px">Fortsett</button></form>`);
  setTimeout(()=>{ const i=document.getElementById('mk-c'); if(i) i.focus(); },50);
}
async function bekreftMfa(){
  const {data:lf}=await sb.auth.mfa.listFactors(); const f=(lf&&lf.totp||[])[0]; if(!f) return start();
  const {error}=await sb.auth.mfa.challengeAndVerify({factorId:f.id, code:verdi('mk-c')});
  if(error) return loginErr(feiltekst(error)); start();
}
function visMelding(t){ loginBody(`<p>${t}</p><button class="btn" onclick="loggUt()">Logg ut</button>`); }
async function loggUt(){ await sb.auth.signOut(); A.me=null; document.getElementById('main').innerHTML=''; document.getElementById('faner').innerHTML=''; visLogin(); }
async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return visLogin();
  A.me=session.user;
  const {data:aal}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if(!aal || aal.nextLevel!=='aal2') return visMelding('To-trinns innlogging er ikke satt opp for denne kontoen. Sett det opp i Vet-oppdrag først, og logg inn her etterpå.');
  if(aal.currentLevel!=='aal2') return visMfa();
  let admin=false;
  try{ admin = await rpc('er_admin'); }catch(e){ return visMelding('Fikk ikke sjekket tilgangen: '+esc(feiltekst(e))); }
  if(admin!==true) return visMelding(`Kontoen ${esc(A.me.email)} har ikke administratortilgang.`);
  loginEl().style.display='none';
  document.getElementById('meg').innerHTML=`${esc(A.me.email)} · <button class="linkbtn" onclick="loggUt()">Logg ut</button>`;
  await lastAlt(); render();
}

// ---------- Data ----------
async function lastAlt(){
  const [p,b,a,l]=await Promise.allSettled([rpc('admin_praksiser'), rpc('admin_brukere'), rpc('admin_avtaler'), rpc('admin_logg_liste',{p_antall:300})]);
  if(p.status==='fulfilled') A.praksiser=p.value||[]; else toast(feiltekst(p.reason));
  if(b.status==='fulfilled') A.brukere=b.value||[];
  if(a.status==='fulfilled') A.avtaler=a.value||{versjoner:[],aksept:[]};
  if(l.status==='fulfilled') A.logg=l.value||[];
}
async function oppdater(){ await lastAlt(); render(); }
const praksis = id => A.praksiser.find(p=>p.id===id);
const sistePublisert = () => A.avtaler.versjoner.filter(v=>v.publisert).sort((a,b)=>String(b.publisert).localeCompare(String(a.publisert)))[0]||null;

// ---------- Visning ----------
const FANER = [['kunder','Kunder'],['brukere','Brukere'],['avtaler','Avtaler'],['kopi','Sikkerhetskopi'],['abonnement','Abonnement'],['logg','Logg']];
function render(){
  document.getElementById('faner').innerHTML = FANER.map(([k,t])=>`<button class="${A.fane===k?'on':''}" onclick="byttFane('${k}')">${t}</button>`).join('');
  renderInnhold();
}
function byttFane(k){ A.fane=k; A.valgt=null; A.utkast=null; render(); window.scrollTo(0,0); }
function renderInnhold(){
  const v = {kunder: A.valgt ? visPraksis : visKunder, brukere: visBrukere, avtaler: A.utkast ? visUtkast : visAvtaler, kopi: visKopi, abonnement: visAbonnement, logg: visLogg}[A.fane];
  document.getElementById('main').innerHTML = v();
  if(A.fane==='abonnement' && !A.ab.lastet) lastAbonnement();
}
const statusPill = p => p.status==='aktiv' ? `<span class="pill s-fullfort">Aktiv</span>` : p.status==='stengt' ? `<span class="pill s-utsatt">Stengt</span>` : `<span class="pill s-avlyst">Opphørt</span>`;
const drift = p => p.live ? `<span class="pill s-fakturert">Ekte drift</span>` : `<span class="pill s-bestilt">Test</span>`;
function avtaleTekst(p){
  const s=sistePublisert(); if(!s) return '<span class="muted">Ingen avtale publisert</span>';
  if(!p.avtale) return '<span class="pill s-utsatt">Ikke godtatt</span>';
  const siste = p.avtale.versjon_id===s.id;
  return `${siste?'':'<span class="pill s-utsatt">Eldre versjon</span> '}v${esc(p.avtale.versjon)} · ${fmtD(p.avtale.tid)}`;
}

// ---------- Kunder ----------
function visKunder(){
  const f=A.kf, sok=f.sok.toLowerCase();
  const ps=A.praksiser.filter(p=>(f.status==='alle'||p.status===f.status) && (!sok || [p.navn,p.orgnr,p.kontakt_navn,p.kontakt_epost,p.sted].join(' ').toLowerCase().includes(sok)));
  const antall = s => A.praksiser.filter(p=>s==='alle'||p.status===s).length;
  return `<div class="row between"><h1>Kunder</h1><button class="btn primary" onclick="nyPraksis()">+ Ny kunde</button></div>
  <div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:10px"><div class="chips" style="margin:0">
    ${[['alle','Alle'],['aktiv','Aktive'],['stengt','Stengt'],['opphort','Opphørt']].map(([k,t])=>`<button class="chip ${f.status===k?'on':'x'}" onclick="A.kf.status='${k}';renderInnhold()">${t} (${antall(k)})</button>`).join('')}</div>
    <input type="search" id="k-sok" placeholder="Søk på navn, org.nr., kontakt eller sted" value="${esc(f.sok)}" oninput="A.kf.sok=this.value;renderTabellKunder()" style="max-width:340px"></div>
  <div id="k-tabell">${tabellKunder(ps)}</div>`;
}
function renderTabellKunder(){ const el=document.getElementById('k-tabell'); if(!el) return; const f=A.kf, sok=f.sok.toLowerCase();
  el.innerHTML=tabellKunder(A.praksiser.filter(p=>(f.status==='alle'||p.status===f.status) && (!sok || [p.navn,p.orgnr,p.kontakt_navn,p.kontakt_epost,p.sted].join(' ').toLowerCase().includes(sok)))); }
function tabellKunder(ps){
  if(!ps.length) return `<div class="card muted">Ingen kunder${A.praksiser.length?' med dette filteret':' ennå. Trykk «Ny kunde» for å legge inn den første'}.</div>`;
  return `<div class="card list0 tabellramme"><table class="atabell"><thead><tr><th>Kunde</th><th>Status</th><th class="hoyre">Brukere</th><th class="hoyre">Kunder</th><th class="hoyre">Oppdrag</th><th>Sist aktiv</th><th>Siste kopi</th><th>Avtale</th><th class="hoyre">Pris/mnd</th></tr></thead><tbody>
  ${ps.map(p=>`<tr class="klikk" onclick="velgPraksis(${js(p.id)})"><td><strong>${esc(p.navn)}</strong><div class="small muted">${esc([p.orgnr?'Org.nr. '+p.orgnr:'',p.sted].filter(Boolean).join(' · '))}</div></td>
    <td>${statusPill(p)} ${drift(p)}</td><td class="hoyre">${p.brukere}</td><td class="hoyre">${p.kunder}</td><td class="hoyre">${p.oppdrag}</td>
    <td class="small">${p.siste_aktivitet?fmtD(p.siste_aktivitet):'–'}</td><td class="small">${p.siste_kopi?fmtD(p.siste_kopi):(p.live?'<span class="pill s-utsatt">Ingen</span>':'–')}</td>
    <td class="small">${avtaleTekst(p)}</td><td class="hoyre">${p.pris_mnd!=null?kr(p.pris_mnd):'–'}</td></tr>`).join('')}</tbody></table></div>`;
}
function velgPraksis(id){ A.valgt=id; renderInnhold(); window.scrollTo(0,0); }
const FELT = [['navn','Navn på praksisen'],['orgnr','Organisasjonsnummer'],['adresse','Adresse'],['postnr','Postnummer'],['sted','Poststed'],
  ['kontakt_navn','Kontaktperson'],['kontakt_epost','E-post til kontaktperson'],['kontakt_tlf','Telefon'],['faktura_epost','E-post for faktura (hvis annen)'],
  ['startdato','Startdato','date'],['pris_mnd','Abonnement per måned, kr eks. mva','number'],['inkl_brukere','Brukere inkludert','number'],['pris_ekstra_bruker','Pris per ekstra bruker, kr eks. mva','number']];
function skjemaPraksis(p){
  return `<div class="skjema">${FELT.map(([k,t,type])=>`<div><label class="f" for="pf-${k}">${t}</label><input type="${type||'text'}" id="pf-${k}" value="${esc(p[k]??'')}"${type==='number'?' step="any" min="0"':''}></div>`).join('')}</div>
    <label class="f" for="pf-notat">Notat (bare for deg)</label><textarea id="pf-notat" rows="3">${esc(p.notat||'')}</textarea>`;
}
const lesSkjema = () => { const d={}; FELT.forEach(([k])=>d[k]=verdi('pf-'+k)); d.notat=verdi('pf-notat'); return d; };
function nyPraksis(){
  modal(`<h2>Ny kunde</h2><p class="small muted">Praksisen starter i testmodus med demodata, slik at kunden kan prøve appen. Trykk «Start ekte drift» når kunden er klar.</p>
    ${skjemaPraksis({inkl_brukere:2, startdato:iso(new Date())})}
    <div class="row" style="justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn" onclick="closeModal()">Avbryt</button><button class="btn primary" onclick="lagreNyPraksis()">Lagre</button></div>`);
}
async function lagreNyPraksis(){
  const d=lesSkjema(); if(!d.navn) return toast('Skriv navnet på praksisen');
  let id=null; if(!await gjor(async()=>{ id=await rpc('admin_lagre_praksis',{d}); }, 'Kunden er lagt inn')) return;
  closeModal(); await lastAlt(); A.fane='kunder'; A.valgt=id; render();
}
async function lagrePraksis(id){
  const d=lesSkjema(); d.id=id; if(!d.navn) return toast('Navnet kan ikke være tomt');
  if(await gjor(()=>rpc('admin_lagre_praksis',{d}), 'Lagret')) oppdater();
}
function visPraksis(){
  const p=praksis(A.valgt); if(!p){ A.valgt=null; return visKunder(); }
  const br=A.brukere.filter(b=>b.praksis_id===p.id), s=sistePublisert();
  const kunEier = br.filter(b=>b.eier && b.aktiv);
  return `<button class="linkbtn" onclick="A.valgt=null;renderInnhold()">← Alle kunder</button>
  <div class="row between" style="margin-top:6px"><h1 style="margin:0">${esc(p.navn)}</h1><div>${statusPill(p)} ${drift(p)}</div></div>
  ${p.status!=='aktiv'?`<div class="banner">${p.status==='stengt'?'Tilgangen er stengt':'Kundeforholdet er avsluttet'}${p.status_grunn?': '+esc(p.status_grunn):''}${p.status_endret?' ('+fmtD(p.status_endret)+')':''}${p.opphort_dato?'. Opphørsdato '+fmtD(p.opphort_dato):''}${p.data_slettet?'. Dataene ble slettet '+fmtD(p.data_slettet):''}.</div>`:''}
  <div class="todelt">
  <div>
    <h3>Opplysninger</h3><div class="card">${skjemaPraksis(p)}<button class="btn primary" style="margin-top:12px" onclick="lagrePraksis(${js(p.id)})">Lagre</button></div>
  </div>
  <div>
    <h3>Bruk</h3><div class="card"><div class="kv">
      <div>Kunder</div><div>${p.kunder}</div><div>Oppdrag</div><div>${p.oppdrag}</div><div>Sist aktiv</div><div>${p.siste_aktivitet?fmtTs(p.siste_aktivitet):'–'}</div>
      <div>Siste full kopi</div><div>${p.siste_kopi?fmtTs(p.siste_kopi):'Ingen'}</div><div>Journalpassord</div><div>${p.har_nokkel?'Laget':'Ikke laget ennå'}</div>
      <div>Opprettet</div><div>${fmtD(p.opprettet)}</div></div>
      <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn sm" onclick="kopierEn(${js(p.id)})">Last ned full sikkerhetskopi</button>
      ${p.data_slettet?'':p.live?`<button class="btn sm warn" onclick="nullstillDialog(${js(p.id)},true)">Blank start …</button>`:`<button class="btn sm primary" onclick="nullstillDialog(${js(p.id)},false)">Start ekte drift …</button>`}</div></div>
    <h3>Avtale</h3><div class="card small">${!s?'Ingen avtale er publisert ennå. Lag den under Avtaler.':p.avtale?`Godtatt versjon ${esc(p.avtale.versjon)} ${fmtTs(p.avtale.tid)} av ${esc(p.avtale.navn||'')} (${esc(p.avtale.epost||'')}).${p.avtale.versjon_id!==s.id?` <strong>Versjon ${esc(s.versjon)} er ikke godtatt ennå.</strong>`:''}`:`<strong>Ikke godtatt.</strong> ${kunEier.length?esc(kunEier.map(b=>b.navn||b.epost).join(', '))+' får avtalen opp ved neste innlogging.':'Ingen bruker er eier. Marker en bruker som eier under Brukere.'}`}</div>

function visBrukere(){
  const f=A.bf, sok=f.sok.toLowerCase();
  const bs=A.brukere.filter(b=>(!f.praksis || (f.praksis==='_ingen' ? !b.praksis_id : b.praksis_id===f.praksis)) && (!sok || [b.navn,b.epost,b.praksis_navn].join(' ').toLowerCase().includes(sok)));

  <div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:10px">
    <select id="b-pr" style="max-width:280px" onchange="A.bf.praksis=this.value;renderInnhold()"><option value="">Alle kunder</option>${A.praksiser.map(p=>`<option value="${esc(p.id)}"${f.praksis===p.id?' selected':''}>${esc(p.navn)}</option>`).join('')}<option value="_ingen"${f.praksis==='_ingen'?' selected':''}>Uten kunde</option></select>
    <input type="search" placeholder="Søk på navn eller e-post" value="${esc(f.sok)}" oninput="A.bf.sok=this.value;document.getElementById('b-tabell').innerHTML=tabellBrukere()" style="max-width:300px"></div>
  <div id="b-tabell">${tabellBrukere(bs)}</div>

}
function tabellBrukere(bs){
  if(!bs){ const f=A.bf, sok=f.sok.toLowerCase(); bs=A.brukere.filter(b=>(!f.praksis || (f.praksis==='_ingen' ? !b.praksis_id : b.praksis_id===f.praksis)) && (!sok || [b.navn,b.epost,b.praksis_navn].join(' ').toLowerCase().includes(sok))); }
  if(!bs.length) return '<div class="card muted">Ingen brukere med dette filteret.</div>';
  return `<div class="card list0 tabellramme"><table class="atabell"><thead><tr><th>Bruker</th><th>Kunde</th><th>Rolle</th><th>Eier</th><th>Aktiv</th><th>To-trinns</th><th>Sist innlogget</th><th></th></tr></thead><tbody>
  ${bs.map(b=>{ const id=js(b.user_id);
    const status = !b.bekreftet ? `<div class="small"><span class="pill s-utsatt">Invitert${b.invitert?' '+fmtD(b.invitert):''}, ikke tatt i bruk</span></div>` : '';
    return `<tr><td><strong>${esc(b.navn||'–')}</strong>${b.admin?' <span class="pill s-fakturert">Administrator</span>':''}<div class="small muted">${esc(b.epost)}</div>${status}</td>
    <td>${b.praksis_id?esc(b.praksis_navn):`<button class="btn sm" onclick="knyttDialog(${id})">Knytt til kunde …</button>`}</td>
    <td>${b.praksis_id?`<select onchange="settMedlem(${id},{p_rolle:this.value})">${Object.entries(ROLLER).map(([k,t])=>`<option value="${k}"${b.rolle===k?' selected':''}>${t}</option>`).join('')}</select>`:''}</td>
    <td>${b.praksis_id?`<input type="checkbox" ${b.eier?'checked':''} onchange="settMedlem(${id},{p_eier:this.checked})" aria-label="Eier">`:''}</td>
    <td>${b.praksis_id?`<input type="checkbox" ${b.aktiv?'checked':''} onchange="settMedlem(${id},{p_aktiv:this.checked})" aria-label="Aktiv">`:''}</td>
    <td>${b.to_trinn?'<span class="pill s-fullfort">På</span>':'<span class="pill s-avlyst">Ikke satt opp</span>'}</td>
    <td class="small">${b.sist_innlogget?fmtTs(b.sist_innlogget):'Aldri'}</td>
    <td class="small" style="white-space:nowrap"><button class="linkbtn" onclick="sendPassordlenke(${js(b.epost)})">Ny passordlenke</button>${!b.admin && (!b.praksis_id || !b.aktiv)?` · <button class="linkbtn" style="color:var(--warn)" onclick="slettBrukerDialog(${id})">Slett</button>`:''}</td></tr>`; }).join('')}</tbody></table></div>`;
}
async function settMedlem(user, endring){
  if(await gjor(()=>rpc('admin_sett_medlem', Object.assign({p_user:user}, endring)), 'Lagret')){ A.brukere=await rpc('admin_brukere'); A.praksiser=await rpc('admin_praksiser'); renderInnhold(); }
  else renderInnhold();
}
async function sendPassordlenke(epost){
  if(await gjor(async()=>{ const {error}=await sb.auth.resetPasswordForEmail(epost,{redirectTo:APP_URL}); if(error) throw error; }, 'Lenke for nytt passord er sendt til '+epost)) return;
}
function rolleValg(){ return `<label class="f" for="iv-r">Rolle</label><select id="iv-r"><option value="veterinaer">Veterinær (journal, oppdrag, kunder)</option><option value="fakturering">Fakturering (oppdrag og fakturagrunnlag, ikke journal)</option></select>
  <label class="check" style="margin-top:10px"><input type="checkbox" id="iv-eier"> Eier: godtar avtalen på vegne av praksisen</label>`; }
function inviterDialog(praksisId){
  if(!A.praksiser.length) return toast('Legg inn en kunde først');
  modal(`<h2>Inviter bruker</h2><p class="small muted">Brukeren får en e-post med lenke. Der lager hun passord, setter opp to-trinns innlogging og kommer inn i appen.</p>
    <label class="f" for="iv-e">E-post</label><input type="text" id="iv-e" inputmode="email">
    <label class="f" for="iv-n">Navn</label><input type="text" id="iv-n">
    <label class="f" for="iv-p">Kunde</label><select id="iv-p">${A.praksiser.filter(p=>p.status!=='opphort').map(p=>`<option value="${esc(p.id)}"${p.id===praksisId?' selected':''}>${esc(p.navn)}</option>`).join('')}</select>
    ${rolleValg()}
    <div class="row" style="justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn" onclick="closeModal()">Avbryt</button><button class="btn primary" id="iv-b" onclick="inviter()">Send invitasjon</button></div>`);
}
async function kallServer(body){
  const {data,error}=await sb.functions.invoke('admin-bruker',{body});
  if(error){
    let m=error.message||String(error);
    try{ if(error.context && typeof error.context.json==='function'){ const j=await error.context.json(); if(j && j.error) m=j.error; } }catch(e){}
    if(/not found|404|Failed to send a request/i.test(m)) m='Serverfunksjonen «admin-bruker» er ikke lagt inn i Supabase ennå. Se oppskriften for adminsiden.';
    if(/not authorized|Email address not authorized/i.test(m)) m='Supabase kan ikke sende e-post til denne adressen. Sett opp egen e-posttjeneste (SMTP) i Supabase, se oppskriften.';
    throw new Error(m);
  }
  if(data && data.error) throw new Error(data.error);
  return data;
}
async function inviter(){
  const body={handling:'inviter', epost:verdi('iv-e'), navn:verdi('iv-n'), praksis_id:verdi('iv-p'), rolle:verdi('iv-r'), eier:verdi('iv-eier')};
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(body.epost)) return toast('Skriv en gyldig e-postadresse');
  const b=document.getElementById('iv-b'); b.disabled=true; b.textContent='Sender …';
  let svar=null;
  if(await gjor(async()=>{ svar=await kallServer(body); })){ closeModal(); toast(svar&&svar.fantes?'Brukeren fantes fra før og er lagt til kunden':'Invitasjonen er sendt til '+body.epost); oppdater(); }
  else { b.disabled=false; b.textContent='Send invitasjon'; }
}

  <h3>Versjoner</h3>${vs.length?`<div class="card list0 tabellramme"><table class="atabell"><thead><tr><th>Versjon</th><th>Tittel</th><th>Status</th><th>Gjelder fra</th><th class="hoyre">Godtatt av</th><th>Fingeravtrykk</th><th></th></tr></thead><tbody>
    ${vs.map(v=>`<tr><td><strong>${esc(v.versjon)}</strong></td><td>${esc(v.tittel)}</td><td>${v.publisert?`<span class="pill s-fullfort">Publisert ${fmtD(v.publisert)}</span>`:'<span class="pill s-avlyst">Utkast</span>'}</td>

}
function publiserDialog(id){
  const v=A.avtaler.versjoner.find(x=>x.id===id), aktive=A.praksiser.filter(p=>p.status==='aktiv').length;
  modal(`<h2>Publisere versjon ${esc(v.versjon)}?</h2><p class="small">Når versjonen er publisert, kan den ikke endres eller slettes. Eieren av hver praksis (${aktive} aktive) får den opp ved neste innlogging.
    ${sistePublisert()?' Har praksisen godtatt en eldre versjon, kan eieren godta nå eller senere. Avtalen sier at endringer skal varsles 60 dager før de gjelder.':' En praksis som ikke har godtatt noen versjon, kommer ikke inn i appen før eieren har godtatt.'}</p>
    <div class="row" style="justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn" onclick="closeModal()">Avbryt</button><button class="btn primary" onclick="publiser(${id})">Publiser</button></div>`);
}
async function publiser(id){ if(await gjor(()=>rpc('admin_publiser_avtale',{p_id:id}), 'Avtalen er publisert')){ closeModal(); oppdater(); } }
async function slettUtkast(id){ if(await gjor(()=>rpc('admin_slett_avtaleutkast',{p_id:id}), 'Utkastet er slettet')) oppdater(); }
function visVersjon(id){
  const v=A.avtaler.versjoner.find(x=>x.id===id);
  modal(`<h2>${esc(v.tittel)}, versjon ${esc(v.versjon)}</h2><p class="small muted">Publisert ${fmtTs(v.publisert)}${v.gjelder_fra?' · gjelder fra '+fmtD(v.gjelder_fra):''} · fingeravtrykk <span class="mono">${esc(v.sha256)}</span></p>
    <div class="avtaletekst">${mdTilHtml(v.tekst)}</div><div class="row" style="justify-content:flex-end;gap:8px"><button class="btn" onclick="lastNedBlob(new Blob([A.avtaler.versjoner.find(x=>x.id===${v.id}).tekst],{type:'text/markdown;charset=utf-8'}),'vet-oppdrag-avtale-${esc(slug(v.versjon))}.md')">Last ned</button><button class="btn primary" onclick="closeModal()">Lukk</button></div>`);
  document.querySelector('#modal .modal').style.maxWidth='820px';
}

// ---------- Sikkerhetskopi ----------
function periodeFor(k){
  const n=new Date(), y=n.getFullYear(), m=n.getMonth();
  if(k==='forrige') return [iso(new Date(y,m-1,1)), iso(new Date(y,m,0))];
  if(k==='denne') return [iso(new Date(y,m,1)), iso(new Date(y,m+1,0))];
  if(k==='iaar') return [iso(new Date(y,0,1)), iso(new Date(y,11,31))];
  if(k==='ifjor') return [iso(new Date(y-1,0,1)), iso(new Date(y-1,11,31))];
  return ['',''];
}
function visKopi(){
  const k=A.kopi, kandidater=A.praksiser.filter(p=>!p.data_slettet);
  if(!k.valgt) k.valgt=new Set(kandidater.filter(p=>p.live || p.status==='aktiv').map(p=>p.id));
  return `<h1>Sikkerhetskopi</h1>
  <p class="small muted">Laster ned én fil per kunde i samme format som kopien fra appen, så den kan åpnes med lesefilen og brukes til gjenoppretting. Velger du flere kunder, samles filene i én zip-fil. Journalene er kryptert i filene og kan bare leses med kundens journalpassord eller gjenopprettingsnøkkel.</p>
  <div class="todelt"><div><h3>Kunder</h3><div class="card">
    <div class="row" style="gap:12px;margin-bottom:6px"><button class="linkbtn" onclick="A.kopi.valgt=new Set(A.praksiser.filter(p=>!p.data_slettet).map(p=>p.id));renderInnhold()">Velg alle</button><button class="linkbtn" onclick="A.kopi.valgt=new Set();renderInnhold()">Velg ingen</button></div>
    ${kandidater.length?kandidater.map(p=>`<label class="check" style="padding:6px 0"><input type="checkbox" ${k.valgt.has(p.id)?'checked':''} onchange="this.checked?A.kopi.valgt.add(${js(p.id)}):A.kopi.valgt.delete(${js(p.id)})"> ${esc(p.navn)} <span class="small muted">${p.oppdrag} oppdrag · siste kopi ${p.siste_kopi?fmtD(p.siste_kopi):'ingen'}</span></label>`).join(''):'<div class="muted">Ingen kunder ennå.</div>'}</div></div>
  <div><h3>Periode</h3><div class="card">
    <label class="check"><input type="radio" name="kp" ${k.periode==='alt'?'checked':''} onchange="A.kopi.periode='alt';renderInnhold()"> Alt (full kopi)</label>
    <label class="check" style="margin-top:6px"><input type="radio" name="kp" ${k.periode==='periode'?'checked':''} onchange="A.kopi.periode='periode';renderInnhold()"> Bare en periode</label>
    ${k.periode==='periode'?`<div class="chips" style="margin-top:8px">${[['forrige','Forrige måned'],['denne','Denne måneden'],['iaar','I år'],['ifjor','I fjor']].map(([p,t])=>`<button class="chip x" onclick="const r=periodeFor('${p}');A.kopi.fra=r[0];A.kopi.til=r[1];renderInnhold()">${t}</button>`).join('')}</div>
      <div class="skjema"><div><label class="f" for="kp-fra">Fra og med</label><input type="date" id="kp-fra" value="${esc(k.fra)}" onchange="A.kopi.fra=this.value"></div><div><label class="f" for="kp-til">Til og med</label><input type="date" id="kp-til" value="${esc(k.til)}" onchange="A.kopi.til=this.value"></div></div>
      <p class="small muted">En periodekopi har oppdrag, journaler og endringer i perioden, og alle kunder, varer, medisiner og maler. Den erstatter ikke den månedlige fulle kopien.</p>`:''}
    <button class="btn primary" style="margin-top:12px" id="kp-b" onclick="lastNedKopier()">Last ned kopier</button><div class="small muted" id="kp-s" style="margin-top:8px"></div></div></div></div>
  <h3>Rutine</h3><div class="card small"><ol style="margin:0;padding-left:18px"><li>Ta full kopi av alle kunder minst én gang i måneden.</li><li>Legg filen to steder, for eksempel på PC-en og på en ekstern disk, sammen med lesefilen.</li>
    <li>Gjenopprettingsnøklene oppbevares av kundene, aldri sammen med kopiene.</li><li>Supabase tar i tillegg en kopi av hele databasen hver natt og beholder den i sju dager.</li></ol></div><div style="height:40px"></div>`;
}
async function eksportFil(p, fra, til){
  const d=await rpc('admin_eksport',{p_praksis:p.id, p_fra:fra||null, p_til:til||null});
  const tabeller=d.tabeller, antall=Object.fromEntries(Object.entries(tabeller).map(([t,r])=>[t,r.length]));
  const fil={app:'vet-oppdrag', format:2, antall, tatt:new Date().toISOString(), praksis:d.praksis, tattAv:A.me.email, utdrag:(fra||til)?{fra:fra||null,til:til||null}:null, tabeller};
  const navn=`vet-oppdrag-${slug(p.navn)}${p.orgnr?'-'+p.orgnr:''}-${iso(new Date())}${(fra||til)?`-periode-${fra||'start'}-${til||'slutt'}`:''}.json`;
  return {navn, innhold:JSON.stringify(fil)};
}
async function lastNedKopier(){
  const k=A.kopi, valgte=A.praksiser.filter(p=>k.valgt.has(p.id));
  if(!valgte.length) return toast('Velg minst én kunde');
  const fra=k.periode==='periode'?k.fra:'', til=k.periode==='periode'?k.til:'';
  if(k.periode==='periode' && (!fra || !til)) return toast('Velg fra- og til-dato');
  if(fra && til && fra>til) return toast('Fra-datoen er etter til-datoen');
  const b=document.getElementById('kp-b'), st=document.getElementById('kp-s'); b.disabled=true;
  try{
    const filer=[];
    for(const [i,p] of valgte.entries()){ st.textContent=`Henter ${p.navn} (${i+1} av ${valgte.length}) …`; filer.push(await eksportFil(p, fra, til)); }
    if(filer.length===1) lastNedBlob(new Blob([filer[0].innhold],{type:'application/json'}), filer[0].navn);
    else { st.textContent='Pakker zip-fil …'; const z=new JSZip(); filer.forEach(f=>z.file(f.navn, f.innhold)); const blob=await z.generateAsync({type:'blob'}); lastNedBlob(blob, `vet-oppdrag-kopier-${iso(new Date())}${fra?`-periode-${fra}-${til}`:''}.zip`); }
    st.textContent=`Ferdig: ${filer.length} ${filer.length===1?'fil':'filer'} lastet ned ${new Date().toLocaleTimeString('nb-NO',{hour:'2-digit',minute:'2-digit'})}.`;
    toast('Sikkerhetskopien er lastet ned'); await lastAlt();
  }catch(e){ console.error(e); st.textContent=''; toast('Kunne ikke lage kopi: '+feiltekst(e)); }
  finally{ b.disabled=false; }
}
async function kopierEn(id){
  const p=praksis(id); toast('Henter data …');
  await gjor(async()=>{ const f=await eksportFil(p); lastNedBlob(new Blob([f.innhold],{type:'application/json'}), f.navn); }, 'Kopien er lastet ned');
  await lastAlt(); renderInnhold();
}

// ---------- Abonnement ----------
function forrigeMnd(){ const n=new Date(); const d=new Date(n.getFullYear(), n.getMonth()-1, 1); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
async function lastAbonnement(){
  if(!A.ab.mnd) A.ab.mnd=forrigeMnd();
  A.ab.lastet=true;
  try{ A.ab.rader=await rpc('admin_abonnement',{p_mnd:A.ab.mnd+'-01'}); }catch(e){ toast(feiltekst(e)); A.ab.rader=[]; }
  renderInnhold();
}
function abonnementLinjer(){
  return A.ab.rader.filter(r=>A.ab.test || r.live).map(r=>{
    const ekstra=Math.max(0,(r.brukere||0)-(r.inkl_brukere||0)), grunn=Number(r.pris_mnd)||0, ek=ekstra*(Number(r.pris_ekstra_bruker)||0), sum=grunn+ek;
    return Object.assign({}, r, {ekstra, belop_ekstra:ek, sum, mva: A.ab.mva ? sum*0.25 : 0, mangler: r.pris_mnd==null});
  });
}
function visAbonnement(){
  if(!A.ab.mnd) A.ab.mnd=forrigeMnd();
  const [y,m]=A.ab.mnd.split('-'), ls=abonnementLinjer(), tot=ls.reduce((s,l)=>s+l.sum,0), totMva=ls.reduce((s,l)=>s+l.mva,0);
  return `<h1>Abonnement</h1><p class="small muted">Fakturagrunnlag for abonnementene en måned. Brukere er antall aktive brukere i dag, uten administrator. Kunder med startdato etter måneden eller opphør før måneden er ikke med.</p>
  <div class="row" style="flex-wrap:wrap;gap:12px;margin-bottom:10px"><div><label class="f" for="ab-m">Måned</label><input type="month" id="ab-m" value="${esc(A.ab.mnd)}" onchange="A.ab.mnd=this.value;lastAbonnement()" style="width:180px"></div>
    <label class="check" style="margin-top:22px"><input type="checkbox" ${A.ab.mva?'checked':''} onchange="A.ab.mva=this.checked;renderInnhold()"> Legg på mva (25 %), bare når foretaket er mva-registrert</label>
    <label class="check" style="margin-top:22px"><input type="checkbox" ${A.ab.test?'checked':''} onchange="A.ab.test=this.checked;renderInnhold()"> Ta med kunder i testperiode</label></div>
  ${ls.length?`<div class="card list0 tabellramme"><table class="atabell"><thead><tr><th>Kunde</th><th>Org.nr.</th><th>Faktura til</th><th class="hoyre">Abonnement</th><th class="hoyre">Brukere</th><th class="hoyre">Ekstra</th><th class="hoyre">Ekstra brukere</th><th class="hoyre">Sum eks. mva</th>${A.ab.mva?'<th class="hoyre">Mva</th><th class="hoyre">Sum inkl. mva</th>':''}</tr></thead><tbody>
    ${ls.map(l=>`<tr><td>${esc(l.navn)} ${l.live?'':'<span class="pill s-bestilt">Test</span>'}${l.status!=='aktiv'?' '+statusPill(l):''}</td><td class="small">${esc(l.orgnr||'–')}</td><td class="small">${esc(l.faktura_epost||'–')}</td>
      <td class="hoyre">${l.mangler?'<span class="pill s-utsatt">Pris mangler</span>':kr(l.pris_mnd)}</td><td class="hoyre">${l.brukere} av ${l.inkl_brukere}</td><td class="hoyre">${l.ekstra}</td><td class="hoyre">${kr(l.belop_ekstra)}</td><td class="hoyre"><strong>${kr(l.sum)}</strong></td>
      ${A.ab.mva?`<td class="hoyre">${kr(l.mva)}</td><td class="hoyre">${kr(l.sum+l.mva)}</td>`:''}</tr>`).join('')}
    <tr class="sumrad"><td colspan="7"><strong>Sum for ${MND[+m-1]} ${y}</strong></td><td class="hoyre"><strong>${kr(tot)}</strong></td>${A.ab.mva?`<td class="hoyre"><strong>${kr(totMva)}</strong></td><td class="hoyre"><strong>${kr(tot+totMva)}</strong></td>`:''}</tr></tbody></table></div>
    <button class="btn" onclick="lastNedAbonnement()">Last ned som Excel-fil</button>`:'<div class="card muted">Ingen kunder å fakturere for denne måneden.</div>'}<div style="height:40px"></div>`;
}
function lastNedAbonnement(){
  const ls=abonnementLinjer();
  const rader=ls.map(l=>Object.assign({'Kunde':l.navn,'Org.nr.':l.orgnr||'','Faktura til':l.faktura_epost||'','Måned':A.ab.mnd,'Abonnement':Number(l.pris_mnd)||0,'Aktive brukere':l.brukere,'Inkludert':l.inkl_brukere,'Ekstra brukere':l.ekstra,'Pris per ekstra':Number(l.pris_ekstra_bruker)||0,'Sum eks. mva':Math.round(l.sum*100)/100},
    A.ab.mva?{'Mva':Math.round(l.mva*100)/100,'Sum inkl. mva':Math.round((l.sum+l.mva)*100)/100}:{}));
  const ws=XLSX.utils.json_to_sheet(rader), wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Abonnement');
  XLSX.writeFile(wb, `vet-oppdrag-abonnement-${A.ab.mnd}.xlsx`);
}

// ---------- Logg ----------
function visLogg(){
  return `<h1>Logg</h1><p class="small muted">Alt som er gjort fra adminsiden, nyeste først. Loggen kan ikke endres.</p>
  ${A.logg.length?`<div class="card list0 tabellramme"><table class="atabell"><thead><tr><th>Tidspunkt</th><th>Administrator</th><th>Kunde</th><th>Handling</th><th>Detaljer</th></tr></thead><tbody>
    ${A.logg.map(l=>`<tr><td class="small" style="white-space:nowrap">${fmtTs(l.tid)}</td><td class="small">${esc(l.admin||'')}</td><td>${esc(l.praksis||'–')}</td><td>${esc(l.handling)}</td>
      <td class="small mono" style="max-width:380px;word-break:break-word">${l.detaljer?esc(Object.entries(l.detaljer).filter(([,v])=>v!==null&&v!=='').map(([k,v])=>k+': '+(typeof v==='object'?JSON.stringify(v):v)).join(' · ')):''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="card muted">Ingen handlinger ennå.</div>'}`;
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
start();
