<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1f2a26; --muted:#6b736f; --line:#e2ddd2;
  --brand:#2f5d50; --brand-2:#e7efe9; --warn:#a4541d; --warn-2:#f7e9dd; --ok:#2f6b3a; --ok-2:#e3f0e3;
  --grey-2:#ecebe6; --blue:#2c5a85; --blue-2:#e3ecf5; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 96px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{font-weight:700;color:var(--brand);letter-spacing:.2px}
.beta{font-size:11px;background:var(--warn-2);color:var(--warn);padding:2px 8px;border-radius:99px;font-weight:600}
.role{margin-left:auto;display:flex;background:var(--grey-2);border-radius:99px;padding:3px}
.role button{border:0;background:transparent;padding:5px 12px;border-radius:99px;cursor:pointer;font-size:13px;color:var(--muted)}
.role button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:6}
nav.tabs .in{max-width:760px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;cursor:pointer;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--brand);font-weight:600}
h1{font-size:22px;margin:18px 0 10px}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.right{text-align:right}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600}
.btn:hover{border-color:#cfc8b9}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.warn{color:var(--warn);border-color:#e6cbb4}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand);padding:6px 8px}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:78px;z-index:7;border-radius:99px;padding:13px 18px;box-shadow:0 4px 14px rgba(47,93,80,.35)}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.s-bestilt{background:var(--blue-2);color:var(--blue)}
.s-utsatt{background:var(--warn-2);color:var(--warn)}
.s-fullfort{background:var(--ok-2);color:var(--ok)}
.s-avlyst{background:var(--grey-2);color:var(--muted)}
.s-fakturert{background:var(--brand-2);color:var(--brand)}
.seg{display:flex;background:var(--grey-2);border-radius:10px;padding:3px;margin:4px 0 12px}
.seg button{flex:1;border:0;background:transparent;padding:7px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.item{cursor:pointer}
.item:hover{border-color:#cfc8b9}
.lines{width:100%;border-collapse:collapse}
.lines td,.lines th{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.lines th{font-size:12px;color:var(--muted);text-align:left;font-weight:600}
.lines input[type=number]{width:74px;padding:6px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px}
.x:hover{color:var(--warn)}
.picker{position:relative}
.picker .list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:10px;max-height:240px;overflow:auto;z-index:4;box-shadow:0 6px 18px rgba(0,0,0,.1)}
.picker .opt{padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.picker .opt:hover{background:var(--brand-2)}
.dyr{border:1px dashed #d7d0c1;border-radius:10px;padding:10px;margin-bottom:10px;background:#fffefb}
.lock{background:var(--grey-2);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:13px}
.banner{background:var(--warn-2);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13px;margin:12px 0}
.total{font-weight:700;font-size:16px}
.ts{font-size:12px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(20,25,23,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:620px){.modal-bg{align-items:center}}
.modal{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px;max-height:88vh;overflow:auto}
@media(min-width:620px){.modal{border-radius:16px}}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer}
.choice.on{border-color:var(--brand);background:var(--brand-2)}
.choice input{margin-top:3px}
pre.out{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;max-height:260px;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.login{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{max-width:380px;width:100%;text-align:center}
.login-logo{width:72px;height:72px;border-radius:18px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:34px;font-weight:700}
.login h1{margin:0 0 6px;font-size:26px}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid #d6d0c4;border-radius:99px;padding:12px 22px;font-weight:600;cursor:pointer;font-size:15px;margin-top:22px}
.gbtn:hover{border-color:#bdb5a5}
.syncbar{max-width:760px;margin:0 auto;padding:4px 14px 6px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#b8b2a6;flex:none}
.dot.ok{background:#3c8a4a}.dot.busy{background:#d49a2a}.dot.err{background:#c0472c}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:0;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.chip{border:1px solid #bcd3c8;background:var(--brand-2);color:var(--brand);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600;cursor:pointer}
.chip.x{background:#fff;border-color:var(--line);color:var(--ink);font-weight:500}
@media print{header.top,nav.tabs,.fab,.noprint{display:none!important}}
</style>
</head>

  maler:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h5"/></svg>',
  eksport:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></svg>'
};
function renderFrame(){
  document.getElementById('role').innerHTML =
    `<button class="${isMia()?'on':''}" onclick="setRole('mia')">Mia</button><button class="${!isMia()?'on':''}" onclick="setRole('erik')">Erik</button>`;
  const tabs=[['oppdrag','Oppdrag'],['sok','Søk'],['kunder','Kunder']].concat(isMia()?[['maler','Maler']]:[]).concat([['eksport','Fakturering']]);
  document.getElementById('tabs').innerHTML = tabs.map(([k,t])=>
    `<button class="${UI.view===k||(k==='oppdrag'&&UI.view==='detalj')||(k==='kunder'&&UI.view==='kunde')||(k==='maler'&&UI.view==='mal')?'on':''}" onclick="go('${k}')">${ICON[k]}${t}</button>`).join('');
}
function setRole(r){ UI.role=r; render(); toast(r==='mia'?'Visning: veterinær':'Visning: fakturering'); }
function go(v){ UI.view=v; UI.current=null; render(); window.scrollTo(0,0); }
function render(){
  renderFrame();
  const m=document.getElementById('main');
  if(!isMia() && (UI.view==='maler'||UI.view==='mal')) UI.view='oppdrag';
  renderSync();
  const fn={oppdrag:vOppdrag,detalj:vDetalj,sok:vSok,kunder:vKunder,kunde:vKunde,eksport:vEksport,maler:vMaler,mal:vMal}[UI.view];
  m.innerHTML = fn();
  const fab = document.getElementById('fab'); if(fab) fab.remove();
  if(isMia() && UI.view==='oppdrag'){
    document.body.insertAdjacentHTML('beforeend','<button id="fab" class="btn primary fab" onclick="nyBestilling()">+ Ny bestilling</button>');
  }
}

// ---------- Oppdragsliste ----------
function oppdragKort(o){
  const k=kunde(o.kundenr);
  return `<div class="card item" onclick="apne('${o.id}')">
    <div class="row between"><strong class="grow">${esc(k.navn)}</strong>${pill(o)}</div>
    <div class="small muted">${fmtDate(o.dato)}${o.tid?' · kl. '+esc(o.tid):''} · ${esc(k.sted||'')}</div>
    ${isMia()?`<div class="small" style="margin-top:4px">${esc(o.henvendelse)}</div>`:''}
    ${!apen(o)&&sum(o)>0?`<div class="small muted" style="margin-top:4px">Sum eks. mva: ${kr(sum(o))} kr</div>`:''}
  </div>`;
}
function vOppdrag(){
  const tab=UI.listTab;
  let html=`<h1>Oppdrag</h1>
  <div class="seg">
    <button class="${tab==='apne'?'on':''}" onclick="UI.listTab='apne';render()">Åpne (${S.oppdrag.filter(apen).length})</button>
    <button class="${tab==='ferdig'?'on':''}" onclick="UI.listTab='ferdig';render()">Ferdig behandlet</button>
  </div>`;
  if(tab==='apne'){
    const open=S.oppdrag.filter(apen).sort((a,b)=>(a.dato+a.tid).localeCompare(b.dato+b.tid));
    const groups=[['Forsinket',o=>o.dato<TODAY],['I dag',o=>o.dato===TODAY],['Kommende',o=>o.dato>TODAY]];
    let any=false;
    for(const [t,f] of groups){ const l=open.filter(f); if(!l.length) continue; any=true;
      html+=`<h3>${t}</h3>`+l.map(oppdragKort).join(''); }
    if(!any) html+=`<div class="empty">Ingen åpne oppdrag. ${isMia()?'Trykk «Ny bestilling» når telefonen ringer.':''}</div>`;
  } else {
    const done=S.oppdrag.filter(o=>!apen(o)).sort((a,b)=>b.dato.localeCompare(a.dato));
    html+= done.length? done.map(oppdragKort).join('') : '<div class="empty">Ingen ferdig behandlede oppdrag ennå.</div>';
  }
  html+=`<div class="noprint" style="margin:24px 0 70px;text-align:center"><button class="btn ghost sm" onclick="bekreftNullstill()">Tilbakestill demodata</button></div>`;
  return html;
}
function apne(id){ UI.current=id; UI.view='detalj'; render(); window.scrollTo(0,0); }

// ---------- Ny bestilling ----------
function nyBestilling(){
  modal(`<h2>Ny bestilling</h2>
    <label class="f">Kunde</label>
    <div class="picker"><input type="search" id="nb-k" placeholder="Søk navn, kundenr eller sted" oninput="kundePick(this.value)" autocomplete="off"><div id="nb-kl"></div></div>
    <input type="hidden" id="nb-kn">
    <div class="grid2"><div><label class="f">Dato</label><input type="date" id="nb-d" value="${TODAY}"></div>
    <div><label class="f">Tid (valgfritt)</label><input type="time" id="nb-t"></div></div>
    <label class="f">Hva gjelder henvendelsen?</label><textarea id="nb-h" placeholder="F.eks. ku med høy feber, ønsker besøk i dag"></textarea>
    <p class="ts">Tidspunktet for henvendelsen lagres automatisk (journalforskriften).</p>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeModal()">Avbryt</button>
    <button class="btn primary" onclick="lagreBestilling()">Opprett oppdrag</button></div>`);
  setTimeout(()=>document.getElementById('nb-k').focus(),50);
}
function kundePick(q){
  q=q.trim().toLowerCase(); const el=document.getElementById('nb-kl');
  document.getElementById('nb-kn').value='';
  if(!q){ el.innerHTML=''; return; }
  const l=S.kunder.filter(k=>(k.navn+' '+k.nr+' '+(k.sted||'')+' '+(k.kontakt||'')).toLowerCase().includes(q)).slice(0,8);
  el.innerHTML = l.length? `<div class="list">${l.map(k=>`<div class="opt" onclick="velgKunde(${k.nr})"><span>${esc(k.navn)}</span><span class="muted small">${k.nr} · ${esc(k.sted||'')}</span></div>`).join('')}</div>`
    : `<div class="list"><div class="opt muted">Ingen treff. Nye kunder opprettes i Duett og lastes inn derfra.</div></div>`;
}
function velgKunde(nr){ const k=kunde(nr); document.getElementById('nb-k').value=k.navn+' ('+nr+')'; document.getElementById('nb-kn').value=nr; document.getElementById('nb-kl').innerHTML=''; }
function lagreBestilling(){
  const nr=+document.getElementById('nb-kn').value;
  if(!nr){ toast('Velg en kunde fra listen'); return; }
  const o={id:uid(),kundenr:nr,dato:document.getElementById('nb-d').value||TODAY,tid:document.getElementById('nb-t').value,
    henvendelse:document.getElementById('nb-h').value.trim()||'(ingen beskrivelse)',henvendelseTs:nowTs(),status:'bestilt',
    linjer:[],medisiner:[],dyr:[],fakturer:false,fakturert:false,journalTs:null,ferdigTs:null,fakturertTs:null};
  S.oppdrag.push(o); save(); closeModal(); UI.listTab='apne'; render(); toast('Oppdrag opprettet');
}

// ---------- Oppdragsdetalj ----------
const cur = () => S.oppdrag.find(o=>o.id===UI.current);
function vDetalj(){
  const o=cur(); if(!o) return '<div class="empty">Fant ikke oppdraget.</div>';
  const k=kunde(o.kundenr);
  const locked = o.fakturert || !isMia() || o.status==='fullfort' || o.status==='avlyst';
  const editable = isMia() && !o.fakturert && !(o.status==='fullfort'||o.status==='avlyst');
  let h=`<div class="noprint" style="margin-top:12px"><button class="btn ghost" onclick="go('oppdrag')">← Oppdrag</button></div>
  <div class="row between wrapf" style="margin:6px 0 10px"><h1 style="margin:0" class="grow">${esc(k.navn)}</h1>${pill(o)}</div>
  <div class="card"><div class="kv">
    <div>Kunde</div><div><a href="#" onclick="visKunde(${k.nr});return false">${k.nr}</a>${k.kontakt?' · '+esc(k.kontakt):''}</div>
    <div>Adresse</div><div>${esc(k.adresse||'')}, ${esc(k.postnr||'')} ${esc(k.sted||'')}</div>
    <div>Telefon</div><div>${esc(k.tlf||'')}</div>
    <div>Dato</div><div>${editable?`<input type="date" value="${o.dato}" onchange="cur().dato=this.value;save()" style="max-width:170px">`:fmtDate(o.dato)}${o.tid?' kl. '+esc(o.tid):''}</div>
    <div>Henvendelse</div><div>${isMia()?esc(o.henvendelse):'<span class="muted">Skjult (journalopplysning)</span>'}<div class="ts">Mottatt ${fmtTs(o.henvendelseTs)}</div></div>
    ${o.utsattFra?`<div>Utsatt fra</div><div>${fmtDate(o.utsattFra)}</div>`:''}
  </div></div>`;

  // Journal
  if(isMia()){
    h+=`<h3>Dyr og journal</h3>`;
    if(!o.dyr.length && !editable) h+=`<div class="lock">Ingen journalførte dyr på dette oppdraget.</div>`;
    o.dyr.forEach((d,i)=>{
      h+= editable ? `<div class="dyr">
        ${malVelger(o,i)}
        <div class="grid2"><div><label class="f">Dyreart</label><select onchange="dyrSet(${i},'art',this.value)">${['Storfe','Sau','Geit','Gris','Hest','Alpakka','Hund','Katt','Annet'].map(a=>`<option ${d.art===a?'selected':''}>${a}</option>`).join('')}</select></div>
        <div><label class="f">Individnr. / øremerke</label><input type="text" value="${esc(d.individ)}" onchange="dyrSet(${i},'individ',this.value)" placeholder="NO 12345 0001"></div></div>
        <label class="f">Diagnose</label><input type="text" value="${esc(d.diagnose)}" onchange="dyrSet(${i},'diagnose',this.value)">
        <label class="f">Behandling</label><textarea onchange="dyrSet(${i},'behandling',this.value)">${esc(d.behandling)}</textarea>
        <label class="f">Egne notater</label><textarea onchange="dyrSet(${i},'notat',this.value)" style="min-height:50px">${esc(d.notat)}</textarea>
        <div class="row between" style="margin-top:6px"><span class="ts">${d.individ?`<a href="#" onclick="dyrHistorikk('${esc(d.individ)}');return false">Se historikk for dette dyret</a>`:''}</span><button class="btn ghost sm warn" onclick="fjernDyr(${i})">Fjern dyr</button></div>
      </div>` : `<div class="dyr"><div class="row between"><strong>${esc(d.art)}${d.individ?' · '+esc(d.individ):''}</strong>${d.individ?`<a class="small" href="#" onclick="dyrHistorikk('${esc(d.individ)}');return false">Historikk</a>`:''}</div>
        <div class="kv" style="margin-top:6px"><div>Diagnose</div><div>${esc(d.diagnose)||'–'}</div><div>Behandling</div><div>${esc(d.behandling)||'–'}</div>${d.notat?`<div>Notater</div><div>${esc(d.notat)}</div>`:''}</div></div>`;
    });
    if(editable) h+=`<button class="btn sm" onclick="nyttDyr()">+ Legg til dyr</button>`;
    h+=`<div class="ts" style="margin-top:6px">Sist journalført: ${fmtTs(o.journalTs)}</div>`;
  } else {
    h+=`<h3>Journal</h3><div class="lock">🔒 Journalopplysninger (dyr, diagnose, behandling og notater) er bare tilgjengelig for veterinæren.</div>`;
  }

  // Tjenester og varer
  h+=`<h3>Tjenester og varer</h3><div class="card">`;
  if(o.linjer.length){
    h+=`<table class="lines"><tr><th>Vare</th><th class="right">Antall</th><th class="right">Pris</th><th class="right">Sum</th>${editable?'<th></th>':''}</tr>`+
    o.linjer.map((l,i)=>`<tr><td>${esc(l.navn)}<div class="ts">${l.varenr}</div></td>
      <td class="right">${editable?`<input type="number" min="0" step="any" value="${l.antall}" onchange="linjeSet(${i},'antall',this.value)">`:l.antall}</td>
      <td class="right">${editable?`<input type="number" min="0" step="any" value="${l.pris}" onchange="linjeSet(${i},'pris',this.value)">`:kr(l.pris)}</td>
      <td class="right">${kr(l.antall*l.pris)}</td>${editable?`<td><button class="x" onclick="fjernLinje(${i})" title="Fjern">×</button></td>`:''}</tr>`).join('')+`</table>`;
  } else h+=`<div class="muted small">Ingen tjenester eller varer registrert.</div>`;
  if(editable) h+=`<div class="picker" style="margin-top:10px"><input type="search" placeholder="+ Legg til tjeneste eller vare (søk)" oninput="varePick(this.value,'vare')" autocomplete="off"><div id="pick-vare"></div></div>`;
  h+=`</div>`;

  // Medisiner
  h+=`<h3>Medisiner</h3><div class="card">`;
  if(!isMia()){ h+=`<div class="small muted">Hvilke medisiner som er brukt vises bare for veterinæren.</div>`; }
  else if(o.medisiner.length){
    h+=`<table class="lines"><tr><th>Medisin</th><th class="right">Antall</th><th class="right">Pris</th><th class="right">Sum</th>${editable?'<th></th>':''}</tr>`+
    o.medisiner.map((m,i)=>`<tr><td>${esc(m.navn)}</td>
      <td class="right">${editable?`<input type="number" min="0" step="any" value="${m.antall}" onchange="medSet(${i},this.value)">`:m.antall}</td>
      <td class="right">${kr(m.pris)}</td><td class="right">${kr(m.antall*m.pris)}</td>${editable?`<td><button class="x" onclick="fjernMed(${i})">×</button></td>`:''}</tr>`).join('')+`</table>`;
  } else if(isMia()) h+=`<div class="muted small">Ingen medisiner registrert.</div>`;
  if(editable) h+=`<div class="picker" style="margin-top:10px"><input type="search" placeholder="+ Legg til medisin (søk)" oninput="varePick(this.value,'med')" autocomplete="off"><div id="pick-med"></div></div>`;
  h+=`<div class="row between" style="margin-top:10px"><span class="small muted">Faktureres som én linje «Medisiner»</span><strong>${kr(medSum(o))} kr</strong></div></div>`;

  // Sum
  h+=`<div class="card"><div class="row between"><span>Sum eks. mva</span><span>${kr(sum(o))} kr</span></div>
    <div class="row between small muted"><span>Mva 25 %</span><span>${kr(sum(o)*MVA)} kr</span></div>
    <div class="row between total" style="margin-top:4px"><span>Sum inkl. mva</span><span>${kr(sum(o)*(1+MVA))} kr</span></div></div>`;

  // Handlinger
  if(isMia() && !o.fakturert){
    if(apen(o)){
      h+=`<div class="row wrapf noprint" style="margin-top:14px;gap:8px">
        <button class="btn primary grow" onclick="ferdigDialog()">Ferdig behandlet …</button>
        <button class="btn" onclick="utsettDialog()">Utsett</button></div>`;
    } else {
      h+=`<div class="card" style="background:var(--brand-2);border-color:transparent">
        <div class="small">Ferdig behandlet ${fmtTs(o.ferdigTs)}. ${fakturerbar(o)?'Oppdraget er klart til fakturering.':'Oppdraget går ikke til fakturering.'}</div>
        <div style="margin-top:8px"><button class="btn sm" onclick="gjenapne()">Gjenåpne for endringer</button></div></div>`;
    }
  }
  if(o.fakturert) h+=`<div class="lock" style="margin-top:12px">Fakturert ${fmtTs(o.fakturertTs)} – låst for endringer.</div>`;
  return h;
}
function touchJournal(){ cur().journalTs=nowTs(); }
function dyrSet(i,f,v){ cur().dyr[i][f]=v; touchJournal(); save(); }
function nyttDyr(){ cur().dyr.push({id:uid(),art:'Storfe',individ:'',diagnose:'',behandling:'',notat:''}); touchJournal(); save(); render(); }
function fjernDyr(i){ cur().dyr.splice(i,1); touchJournal(); save(); render(); }
function linjeSet(i,f,v){ cur().linjer[i][f]=+v||0; save(); render(); }
function fjernLinje(i){ cur().linjer.splice(i,1); save(); render(); }
function medSet(i,v){ cur().medisiner[i].antall=+v||0; save(); render(); }
function fjernMed(i){ cur().medisiner.splice(i,1); save(); render(); }
function varePick(q,type){
  q=q.trim().toLowerCase(); const el=document.getElementById('pick-'+type);
  if(!q){ el.innerHTML=''; return; }
  const src = type==='vare' ? VARER.filter(v=>v.navn!=='Medisiner') : MEDISINER;
  const l=src.filter(x=>x.navn.toLowerCase().includes(q)||String(x.nr||'').includes(q)).slice(0,10);
  el.innerHTML = `<div class="list">${l.length?l.map((x,i)=>`<div class="opt" onclick="leggTil('${type}',${src.indexOf(x)})"><span>${esc(x.navn)}</span><span class="muted small">${x.pris!=null?kr(x.pris)+' kr':''}${x.enhet?' / '+esc(x.enhet):''}</span></div>`).join(''):'<div class="opt muted">Ingen treff</div>'}</div>`;
}
function leggTil(type,i){
  const o=cur();
  if(type==='vare'){ const v=VARER.filter(v=>v.navn!=='Medisiner')[i]; o.linjer.push({varenr:v.nr,navn:v.navn,antall:1,pris:v.pris||0}); }
  else { const m=MEDISINER[i]; const ex=o.medisiner.find(x=>x.navn===m.navn); if(ex) ex.antall++; else o.medisiner.push({navn:m.navn,antall:1,pris:m.pris}); }
  save(); render();
}
function ferdigDialog(){
  const o=cur();
  modal(`<h2>Ferdig behandlet</h2>
    <label class="choice on" id="ch-f" onclick="velgFerdig('fullfort')"><input type="radio" name="fs" checked><div><strong>Fullført</strong><div class="small muted">Oppdraget ble utført og går til fakturering.</div></div></label>
    <label class="choice" id="ch-a" onclick="velgFerdig('avlyst')"><input type="radio" name="fs"><div><strong>Avlyst</strong><div class="small muted">Oppdraget ble ikke utført.</div></div></label>
    <div id="avl-extra" style="display:none;margin:4px 0 8px 4px"><label class="check"><input type="checkbox" id="avl-fak"> Send likevel til fakturering (f.eks. kjøring eller tid brukt)</label>
    <div class="ts" style="margin-top:4px">Det som er registrert under tjenester og varer blir fakturert.</div></div>
    ${o.status!=='avlyst' && !o.linjer.length && !o.medisiner.length?'<div class="banner">Det er ikke registrert noen tjenester eller varer på oppdraget.</div>':''}
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeModal()">Avbryt</button><button class="btn primary" onclick="bekreftFerdig()">Bekreft</button></div>`);
  UI._fs='fullfort';
}
function velgFerdig(s){ UI._fs=s; document.getElementById('ch-f').classList.toggle('on',s==='fullfort'); document.getElementById('ch-a').classList.toggle('on',s==='avlyst');
  document.getElementById('avl-extra').style.display = s==='avlyst'?'block':'none'; }
function bekreftFerdig(){
  const o=cur(); o.status=UI._fs; o.fakturer = o.status==='avlyst' ? document.getElementById('avl-fak').checked : true; o.ferdigTs=nowTs();
  save(); closeModal(); render(); toast(o.status==='fullfort'?'Fullført – klar til fakturering':(o.fakturer?'Avlyst – sendes til fakturering':'Avlyst'));
}
function gjenapne(){ const o=cur(); o.status='bestilt'; o.ferdigTs=null; o.fakturer=false; save(); render(); toast('Oppdraget er åpnet igjen'); }
function utsettDialog(){
  const o=cur();
  modal(`<h2>Utsett oppdrag</h2><label class="f">Ny dato</label><input type="date" id="ut-d" value="${addDays(1)}">
    <label class="f">Tid (valgfritt)</label><input type="time" id="ut-t" value="${o.tid||''}">
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" onclick="closeModal()">Avbryt</button><button class="btn primary" onclick="bekreftUtsett()">Utsett</button></div>`);
}
function bekreftUtsett(){ const o=cur(); o.utsattFra=o.dato; o.dato=document.getElementById('ut-d').value||o.dato; o.tid=document.getElementById('ut-t').value; o.status='utsatt'; save(); closeModal(); render(); toast('Oppdraget er flyttet til '+fmtDate(o.dato)); }

// ---------- Søk ----------
function vSok(){
  const f=UI.sok;
  const res=S.oppdrag.filter(o=>{
    const k=kunde(o.kundenr);
    if(f.q && !(k.navn+' '+k.nr+' '+(k.kontakt||'')+' '+(k.sted||'')).toLowerCase().includes(f.q.toLowerCase())) return false;
    if(f.fra && o.dato<f.fra) return false; if(f.til && o.dato>f.til) return false;
    if(f.status && statusKey(o)!==f.status) return false;
    if(f.vare && !(o.linjer.some(l=>l.navn.toLowerCase().includes(f.vare.toLowerCase())) || (isMia() && o.medisiner.some(m=>m.navn.toLowerCase().includes(f.vare.toLowerCase()))))) return false;
    if(isMia() && f.individ && !o.dyr.some(d=>(d.individ+' '+d.diagnose+' '+d.behandling+' '+d.notat).toLowerCase().includes(f.individ.toLowerCase()))) return false;
    return true;
  }).sort((a,b)=>b.dato.localeCompare(a.dato));
  return `<h1>Søk og historikk</h1>
  <div class="card">
    <label class="f" style="margin-top:0">Kunde</label><input type="search" value="${esc(f.q)}" placeholder="Navn, kundenr, kontaktperson eller sted" oninput="UI.sok.q=this.value;sokRes()">
    <div class="grid2"><div><label class="f">Fra dato</label><input type="date" value="${f.fra}" onchange="UI.sok.fra=this.value;sokRes()"></div>
    <div><label class="f">Til dato</label><input type="date" value="${f.til}" onchange="UI.sok.til=this.value;sokRes()"></div></div>
    ${isMia()?`<label class="f">Øremerke / individnr. / journaltekst</label><input type="search" value="${esc(f.individ)}" placeholder="F.eks. NO 12345 0417 eller mastitt" oninput="UI.sok.individ=this.value;sokRes()">`:''}
    <div class="grid2"><div><label class="f">Status</label><select onchange="UI.sok.status=this.value;sokRes()"><option value="">Alle</option>${Object.entries(STATUS).map(([k,t])=>`<option value="${k}" ${f.status===k?'selected':''}>${t}</option>`).join('')}</select></div>
    <div><label class="f">Vare / tjeneste / medisin</label><input type="search" value="${esc(f.vare)}" placeholder="F.eks. kjøring" oninput="UI.sok.vare=this.value;sokRes()"></div></div>

function eksportData(){
  const {fra,til}=UI.eksport;
  const os=S.oppdrag.filter(o=>fakturerbar(o) && (!fra||o.dato>=fra) && (!til||o.dato<=til));
  const per={};
  os.forEach(o=>{ (per[o.kundenr]=per[o.kundenr]||[]).push(o); });

function eksportLinjer(o){
  const l=o.linjer.map(x=>({varenr:x.varenr,navn:x.navn,antall:x.antall,pris:x.pris}));
  const ms=medSum(o); if(ms>0) l.push({varenr:MED_VARE.nr,navn:'Medisiner',antall:1,pris:Math.round(ms*100)/100});
  return l;
}
function csv(){
  const {per}=eksportData();
  const rows=[['Kundenummer','Kundenavn','Oppdragsdato','Varenummer','Varenavn','Antall','Pris eks mva','Beløp eks mva']];
  Object.keys(per).sort().forEach(nr=>{ const k=kunde(+nr);
    per[nr].sort((a,b)=>a.dato.localeCompare(b.dato)).forEach(o=>eksportLinjer(o).forEach(l=>rows.push([k.nr,k.navn,o.dato,l.varenr,l.navn,String(l.antall).replace('.',','),kr(l.pris).replace(/\s/g,''),kr(l.antall*l.pris).replace(/\s/g,'')]))); });
  return rows.map(r=>r.map(c=>/[;"\n]/.test(String(c))?'"'+String(c).replace(/"/g,'""')+'"':c).join(';')).join('\n');
}

const AUTH = {token:null, exp:0, user:null, client:null};
try{ const t=JSON.parse(sessionStorage.getItem('vet-token')||'null'); if(t && t.exp>Date.now()+60000){ AUTH.token=t.token; AUTH.exp=t.exp; } }catch(e){}
try{ AUTH.user=JSON.parse(localStorage.getItem('vet-user')||'null'); }catch(e){}
const tokenOk = () => AUTH.token && AUTH.exp > Date.now()+30000;
function initClient(){
  if(AUTH.client || !(window.google && google.accounts && google.accounts.oauth2)) return !!AUTH.client;
  AUTH.client = google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID, scope:SCOPE, callback:onToken,
    error_callback:e=>{ document.getElementById('login-err').textContent = e && e.type==='popup_closed' ? 'Innloggingen ble avbrutt.' : 'Innloggingen mislyktes. Prøv igjen.'; SYNC.state='err'; renderSync(); }});
  return true;
}
function loggInn(){
  if(!initClient()){ document.getElementById('login-err').textContent='Laster Google … prøv igjen om et øyeblikk.'; return; }
  AUTH.client.requestAccessToken({prompt: AUTH.user ? '' : 'consent', login_hint: AUTH.user ? AUTH.user.emailAddress : undefined});
}
async function onToken(r){
  if(r.error){ document.getElementById('login-err').textContent='Innloggingen mislyktes: '+r.error; return; }
  AUTH.token=r.access_token; AUTH.exp=Date.now()+(+r.expires_in||3600)*1000;
  try{ sessionStorage.setItem('vet-token',JSON.stringify({token:AUTH.token,exp:AUTH.exp})); }catch(e){}
  try{
    const me=await gapi('https://www.googleapis.com/drive/v3/about?fields=user(displayName,emailAddress)');
    if(AUTH.user && AUTH.user.emailAddress!==me.user.emailAddress){ // annen konto: ikke bland data
      S=seed(); S.maler=seedMaler(); SYNC.base=null; SYNC.fileId=null; try{localStorage.removeItem('vet-file')}catch(e){}
    }
    AUTH.user=me.user; try{ localStorage.setItem('vet-user',JSON.stringify(me.user)); }catch(e){}
  }catch(e){}
  document.getElementById('login').style.display='none';
  render(); await sync(true);
}

  <div class="row" style="justify-content:flex-end;gap:8px"><button class="btn" onclick="closeModal()">Avbryt</button><button class="btn primary" onclick="bekreftLoggUt()">Logg ut</button></div>`);

async function bekreftLoggUt(){
  closeModal();
  if(SYNC.dirty && tokenOk()) { try{ await sync(); }catch(e){} }
  try{ if(AUTH.token && window.google) google.accounts.oauth2.revoke(AUTH.token,()=>{}); }catch(e){}
  AUTH.token=null; AUTH.exp=0; AUTH.user=null;
  ['vet-user','vet-file','vet-base',KEY].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
  try{sessionStorage.removeItem('vet-token')}catch(e){}

// ---------- Synkronisering mot Google Drive ----------
const SYNC = {state:'idle', dirty:false, timer:null, running:false, last:null, fileId:null, folderId:null, base:null};
try{ SYNC.fileId=localStorage.getItem('vet-file'); SYNC.base=JSON.parse(localStorage.getItem('vet-base')||'null'); }catch(e){}
async function gapi(url,opt={}){
  const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({'Authorization':'Bearer '+AUTH.token},opt.headers||{})}));
  if(r.status===401){ AUTH.token=null; AUTH.exp=0; try{sessionStorage.removeItem('vet-token')}catch(e){} throw new Error('auth'); }
  if(!r.ok) throw new Error('http '+r.status);
  const ct=r.headers.get('content-type')||''; return ct.includes('json') ? r.json() : r.text();
}
const q = s => encodeURIComponent(s);
async function finnFil(){
  if(SYNC.fileId){
    try{ const f=await gapi(`https://www.googleapis.com/drive/v3/files/${SYNC.fileId}?fields=id,trashed`); if(!f.trashed) return SYNC.fileId; }catch(e){ if(e.message==='auth') throw e; }
  }
  const fo=await gapi(`https://www.googleapis.com/drive/v3/files?q=${q(`name='${FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`)}&fields=files(id)&spaces=drive`);
  SYNC.folderId = fo.files.length ? fo.files[0].id : (await gapi('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:FOLDER,mimeType:'application/vnd.google-apps.folder'})})).id;
  const fi=await gapi(`https://www.googleapis.com/drive/v3/files?q=${q(`name='${FILE}' and '${SYNC.folderId}' in parents and trashed=false`)}&fields=files(id)&spaces=drive`);
  SYNC.fileId = fi.files.length ? fi.files[0].id : null;
  try{ if(SYNC.fileId) localStorage.setItem('vet-file',SYNC.fileId); }catch(e){}
  return SYNC.fileId;
}
async function opprettFil(data){
  const b='vetb'+Date.now();
  const body=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name:FILE,parents:[SYNC.folderId],mimeType:'application/json'})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${data}\r\n--${b}--`;
  const f=await gapi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body});
  SYNC.fileId=f.id; try{ localStorage.setItem('vet-file',f.id); }catch(e){}
}
// Flett: lokale endringer siden forrige synk vinner, ellers vinner det som ligger på Drive.
function flett(lokal, fjern, base){
  const out={};
  for(const k of ['kunder','oppdrag','maler']){
    const key = k==='kunder' ? 'nr' : 'id';
    const b=new Map(((base&&base[k])||[]).map(x=>[x[key],JSON.stringify(x)]));
    const r=new Map(((fjern&&fjern[k])||[]).map(x=>[x[key],x]));
    const res=new Map();
    for(const x of (lokal[k]||[])){
      const endret = JSON.stringify(x)!==b.get(x[key]);
      res.set(x[key], endret || !r.has(x[key]) ? x : r.get(x[key]));
    }
    for(const [id,x] of r){ if(!res.has(id) && !b.has(id)) res.set(id,x); }
    out[k]=[...res.values()];
  }
  return out;
}
function scheduleSync(){ SYNC.dirty=true; clearTimeout(SYNC.timer); SYNC.timer=setTimeout(()=>sync(),1500); renderSync(); }
async function sync(forsteGang){
  if(!tokenOk()){ SYNC.state='off'; renderSync(); return; }
  if(SYNC.running){ SYNC.again=true; return; }
  SYNC.running=true; SYNC.state='busy'; renderSync();
  try{
    const id=await finnFil();
    let fjern=null;
    if(id){ const txt=await gapi(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`); fjern = typeof txt==='string' ? JSON.parse(txt||'null') : txt; }
    const merged = fjern ? flett(S, fjern, SYNC.base) : {kunder:S.kunder,oppdrag:S.oppdrag,maler:S.maler};
    const data=JSON.stringify(Object.assign({app:'vet-oppdrag',versjon:1,lagret:nowTs()},merged));
    if(id) await gapi(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:data});
    else await opprettFil(data);
    const endretFraDrive = JSON.stringify(merged)!==JSON.stringify({kunder:S.kunder,oppdrag:S.oppdrag,maler:S.maler});
    S.kunder=merged.kunder; S.oppdrag=merged.oppdrag; S.maler=merged.maler;
    SYNC.base=JSON.parse(JSON.stringify(merged)); try{ localStorage.setItem('vet-base',JSON.stringify(SYNC.base)); }catch(e){}
    saveLocal(); SYNC.dirty=false; SYNC.state='ok'; SYNC.last=new Date();
    if(endretFraDrive && !erIRedigering()) render(); else renderSync();
  }catch(e){
    SYNC.state = e.message==='auth' ? 'off' : 'err'; renderSync();
  }finally{
    SYNC.running=false;
    if(SYNC.again){ SYNC.again=false; setTimeout(()=>sync(),300); }
  }
}
const erIRedigering = () => { const a=document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) || !!document.querySelector('#modal .modal'); };
function renderSync(){
  const el=document.getElementById('syncbar'); if(!el) return;
  const u=AUTH.user;
  let dot='', txt='';
  if(!tokenOk()){ dot='err'; txt = SYNC.dirty ? 'Ikke lagret på Drive – endringer ligger på denne enheten' : 'Ikke koblet til Drive'; }
  else if(SYNC.state==='busy'){ dot='busy'; txt='Lagrer …'; }
  else if(SYNC.state==='err'){ dot='err'; txt='Kunne ikke lagre – prøver igjen'; }
  else if(SYNC.dirty){ dot='busy'; txt='Venter med å lagre …'; }
  else { dot='ok'; txt='Lagret på Google Drive'+(SYNC.last?' kl. '+SYNC.last.toLocaleTimeString('nb-NO',{hour:'2-digit',minute:'2-digit'}):''); }
  el.innerHTML=`<div class="syncbar"><span class="dot ${dot}"></span><span class="grow">${txt}</span>
    ${!tokenOk()?`<button class="linkbtn" onclick="loggInn()">Logg inn igjen</button>`:''}
    ${u?`<span class="small" title="${esc(u.emailAddress)}">${esc((u.displayName||u.emailAddress).split(' ')[0])}</span> · <button class="linkbtn" onclick="loggUt()">Logg ut</button>`:''}</div>`;
}
// Hent endringer fra andre enheter jevnlig, og varsle før token utløper.
setInterval(()=>{ if(document.visibilityState==='visible' && tokenOk() && !SYNC.running && !erIRedigering()) sync(); renderSync(); }, 60000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && tokenOk()) sync(); });
window.addEventListener('beforeunload',e=>{ if(SYNC.dirty){ e.preventDefault(); e.returnValue=''; } });

// ---------- Oppstart ----------
render();
if(!AUTH.user){ document.getElementById('login').style.display='flex'; }
else if(tokenOk()){ sync(true); }
const waitG=setInterval(()=>{ if(initClient()) clearInterval(waitG); },200);

</script>
