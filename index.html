<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1f2a26; --muted:#6b736f; --line:#e2ddd2;
  --brand:#2f5d50; --brand-2:#e7efe9; --warn:#a4541d; --warn-2:#f7e9dd; --ok:#2f6b3a; --ok-2:#e3f0e3;
  --grey-2:#ecebe6; --blue:#2c5a85; --blue-2:#e3ecf5; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 96px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{font-weight:700;color:var(--brand);letter-spacing:.2px}
.beta{font-size:11px;background:var(--warn-2);color:var(--warn);padding:2px 8px;border-radius:99px;font-weight:600}
.role{margin-left:auto;display:flex;background:var(--grey-2);border-radius:99px;padding:3px}
.role button{border:0;background:transparent;padding:5px 12px;border-radius:99px;cursor:pointer;font-size:13px;color:var(--muted)}
.role button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:6}
nav.tabs .in{max-width:760px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;cursor:pointer;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--brand);font-weight:600}
h1{font-size:22px;margin:18px 0 10px}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.right{text-align:right}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600}
.btn:hover{border-color:#cfc8b9}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.warn{color:var(--warn);border-color:#e6cbb4}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand);padding:6px 8px}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:78px;z-index:7;border-radius:99px;padding:13px 18px;box-shadow:0 4px 14px rgba(47,93,80,.35)}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.s-bestilt{background:var(--blue-2);color:var(--blue)}
.s-utsatt{background:var(--warn-2);color:var(--warn)}
.s-fullfort{background:var(--ok-2);color:var(--ok)}
.s-avlyst{background:var(--grey-2);color:var(--muted)}
.s-fakturert{background:var(--brand-2);color:var(--brand)}
.seg{display:flex;background:var(--grey-2);border-radius:10px;padding:3px;margin:4px 0 12px}
.seg button{flex:1;border:0;background:transparent;padding:7px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.item{cursor:pointer}
.item:hover{border-color:#cfc8b9}
.lines{width:100%;border-collapse:collapse}
.lines td,.lines th{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.lines th{font-size:12px;color:var(--muted);text-align:left;font-weight:600}
.lines input[type=number]{width:74px;padding:6px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px}
.x:hover{color:var(--warn)}
.picker{position:relative}
.picker .list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:10px;max-height:240px;overflow:auto;z-index:4;box-shadow:0 6px 18px rgba(0,0,0,.1)}
.picker .opt{padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.picker .opt:hover{background:var(--brand-2)}
.dyr{border:1px dashed #d7d0c1;border-radius:10px;padding:10px;margin-bottom:10px;background:#fffefb}
.lock{background:var(--grey-2);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:13px}
.banner{background:var(--warn-2);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13px;margin:12px 0}
.total{font-weight:700;font-size:16px}
.ts{font-size:12px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(20,25,23,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:620px){.modal-bg{align-items:center}}
.modal{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px;max-height:88vh;overflow:auto}
@media(min-width:620px){.modal{border-radius:16px}}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer}
.choice.on{border-color:var(--brand);background:var(--brand-2)}
.choice input{margin-top:3px}
pre.out{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;max-height:260px;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.login{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{max-width:380px;width:100%;text-align:center}
.login-logo{width:72px;height:72px;border-radius:18px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:34px;font-weight:700}
.login h1{margin:0 0 6px;font-size:26px}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid #d6d0c4;border-radius:99px;padding:12px 22px;font-weight:600;cursor:pointer;font-size:15px;margin-top:22px}
.gbtn:hover{border-color:#bdb5a5}
.syncbar{max-width:760px;margin:0 auto;padding:4px 14px 6px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#b8b2a6;flex:none}
.dot.ok{background:#3c8a4a}.dot.busy{background:#d49a2a}.dot.err{background:#c0472c}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:0;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.chip{border:1px solid #bcd3c8;background:var(--brand-2);color:var(--brand);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600;cursor:pointer}
.chip.x{background:#fff;border-color:var(--line);color:var(--ink);font-weight:500}
@media print{header.top,nav.tabs,.fab,.noprint{display:none!important}}
.kgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.kh{text-align:center;font-size:11px;color:var(--muted);padding:2px 0;font-weight:600;text-transform:uppercase}
.kd{position:relative;border:1px solid transparent;background:#fff;border-radius:8px;aspect-ratio:1/0.9;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;padding:0}
.kd.ut{opacity:.4}
.kd.vakt{background:var(--warn-2)}
.kd.idag span{font-weight:700;color:var(--brand)}
.kd.valgt{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.kd i{font-style:normal;font-size:10px;font-weight:700;background:var(--brand);color:#fff;border-radius:99px;min-width:16px;padding:0 4px;margin-top:2px;line-height:15px}
.kleg{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px}
.kleg.vakt{background:var(--warn-2);border:1px solid #e6cbb4}
.kleg.n{background:var(--brand);color:#fff;font-size:9px;font-weight:700;text-align:center;line-height:12px;border-radius:99px;width:14px}
tr.item{cursor:pointer} tr.item:hover td{background:#faf8f3}
.role button{font-size:12px}
nav.tabs button{font-size:11.5px}
.logo{white-space:nowrap}
.medrad{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:6px;background:#fff}
.medgrid{display:grid;grid-template-columns:90px 1fr;gap:8px;margin-top:4px}
.medgrid input{padding:6px 8px;margin-top:2px;min-width:0}
.medgrid label{display:block}
</style>
</head>

// Journalnøkkel: tilfeldig AES-GCM 256. Lagres på serveren låst (wrapped) med
// (1) en nøkkel avledet av journalpassordet (PBKDF2-SHA256, 600 000 runder) og
// (2) en nøkkel avledet av gjenopprettingsnøkkelen (PBKDF2-SHA256, 100 000 runder).
// Journaltekst krypteres med AES-GCM og tilfeldig IV: "v1:<iv base64>:<chiffertekst base64>".
const KRYPTO = {

    return JSON.parse(new TextDecoder().decode(pt));
  }
};

};
function apne(id){ UI.current=id; UI.view='detalj'; render(); window.scrollTo(0,0); }

// ================= Ny bestilling =================
function nyBestilling(kundenr, dato){
  modal(`<h2>Ny bestilling</h2>
    <label class="f">Kunde</label>
    <div class="picker"><input type="search" id="nb-k" placeholder="Søk navn, kundenr eller sted" oninput="kundePick(this.value)" autocomplete="off"><div id="nb-kl"></div></div>

function kundePick(q){

  const l=S.kunder.filter(k=>(k.navn+' '+k.nr+' '+(k.sted||'')+' '+(k.kontakt||'')).toLowerCase().includes(q)).slice(0,8);
  el.innerHTML = `<div class="list">${l.length?l.map(k=>`<div class="opt" onclick="velgKunde(${k.nr})"><span>${esc(k.navn)}</span><span class="muted small">${k.nr} · ${esc(k.sted||'')}</span></div>`).join(''):'<div class="opt muted">Ingen treff. Nye kunder opprettes i Duett og lastes inn derfra.</div>'}</div>`;
}
function velgKunde(nr){ const k=kunde(nr); document.getElementById('nb-k').value=k.navn+' ('+nr+')'; document.getElementById('nb-kn').value=nr; document.getElementById('nb-kl').innerHTML=''; }
function lagreBestilling(){
  const nr=+document.getElementById('nb-kn').value; if(!nr){ toast('Velg en kunde fra listen'); return; }
  const o={id:uid(),nr:null,kundenr:nr,dato:document.getElementById('nb-d').value||TODAY,tid:document.getElementById('nb-t').value,
    henvendelse:document.getElementById('nb-h').value.trim()||'(ingen beskrivelse)',henvendelseTs:nowTs(),status:'bestilt',
    linjer:[],dyr:[],flokk:[],fakturer:false,fakturert:false,vakt:null,dhpTs:null,journalTs:null,ferdigTs:null,fakturertTs:null,opprinnelig:null};
  S.oppdrag.push(o); save(); closeModal(); UI.listTab='apne';
  if(UI.view!=='kunde' && UI.view!=='kalender') UI.view='oppdrag';
  render(); toast('Oppdrag opprettet');
}

// ================= Oppdragsdetalj =================
const cur = () => S.oppdrag.find(o=>o.id===UI.current);
VIEWS.detalj = () => {
  const o=cur(); if(!o) return '<div class="empty">Fant ikke oppdraget.</div>';
  const k=kunde(o.kundenr);
  const editable = isMia() && kanSkrive() && !o.fakturert && apen(o);
  let h=`<div class="noprint" style="margin-top:12px"><button class="btn ghost" onclick="go('oppdrag')">← Oppdrag</button></div>
  <div class="row between wrapf" style="margin:6px 0 2px"><h1 style="margin:0" class="grow">${esc(k.navn)}</h1>${pill(o)}</div>
  <div class="small muted" style="margin-bottom:10px">${esc(oNr(o))}</div>
  <div class="card"><div class="kv">
    <div>Kunde</div><div><a href="#" onclick="visKunde(${k.nr});return false">${k.nr}</a>${k.kontakt?' · '+esc(k.kontakt):''}</div>
    <div>Adresse</div><div>${esc(k.adresse||'')}, ${esc(k.postnr||'')} ${esc(k.sted||'')}</div>
    <div>Telefon</div><div>${esc(k.tlf||'')}</div>
    <div>Dato</div><div>${editable?`<input type="date" value="${o.dato}" onchange="cur().dato=this.value;save();render()" style="max-width:170px">`:fmtDate(o.dato)}${o.tid?' kl. '+esc(o.tid):''}</div>
    <div>På vakt</div><div>${vaktFelt(o, isMia()&&kanSkrive()&&!o.fakturert)}</div>
    <div>Henvendelse</div><div>${isMia()?esc(o.henvendelse):'<span class="muted">Skjult (journalopplysning)</span>'}<div class="ts">Mottatt ${fmtTs(o.henvendelseTs)}</div></div>
    ${o.opprinnelig?`<div>Opprinnelig</div><div>${fmtDate(o.opprinnelig.slice(0,10))}${o.opprinnelig.length>10?' kl. '+esc(o.opprinnelig.slice(11)):''} <span class="ts">· ${flyttRetning(o).toLowerCase()||'flyttet'}</span></div>`:''}
    ${!o.opprinnelig&&o.utsattFra?`<div>Utsatt fra</div><div>${fmtDate(o.utsattFra)}</div>`:''}
  </div></div>`;
  // Dyr, journal og medisiner
  if(isMia()){
    h+=`<h3>Dyr, journal og medisiner</h3>`;
    if(!o.dyr.length && !editable) h+=`<div class="lock">Ingen journalførte dyr på dette oppdraget.</div>`;
    o.dyr.forEach((d,i)=>{ h+= editable ? dyrRediger(o,d,i) : dyrVis(d); });
    if(editable) h+=`<button class="btn sm" onclick="nyttDyr()">+ Legg til dyr</button>`;
    h+=`<div class="ts" style="margin-top:6px">Sist journalført: ${fmtTs(o.journalTs)}</div>`;
  } else {
    h+=`<h3>Journal</h3><div class="lock">🔒 Journalopplysninger (dyr, diagnose, behandling, notater og medisiner) er bare tilgjengelig for veterinæren.</div>`;
  }
  // Tjenester og varer
  h+=`<h3>Tjenester og varer</h3><div class="card">`;
  if(o.linjer.length){
    h+=`<table class="lines"><tr><th>Vare</th><th class="right">Antall</th><th class="right">Pris</th><th class="right">Sum</th>${editable?'<th></th>':''}</tr>`+
    o.linjer.map((l,i)=>`<tr><td>${esc(l.navn)}<div class="ts">${l.varenr}</div></td>
      <td class="right">${editable?`<input type="number" min="0" step="any" value="${l.antall}" onchange="linjeSet(${i},'antall',this.value)">`:l.antall}</td>
      <td class="right">${editable?`<input type="number" min="0" step="any" value="${l.pris}" onchange="linjeSet(${i},'pris',this.value)">`:kr(l.pris)}</td>
      <td class="right">${kr(l.antall*l.pris)}</td>${editable?`<td><button class="x" onclick="fjernLinje(${i})" title="Fjern">×</button></td>`:''}</tr>`).join('')+`</table>`;
  } else h+=`<div class="muted small">Ingen tjenester eller varer registrert.</div>`;
  if(editable) h+=`<div class="picker" style="margin-top:10px"><input type="search" placeholder="+ Legg til tjeneste eller vare (søk)" oninput="varePick(this.value)" autocomplete="off"><div id="pick-vare"></div></div>`;
  h+=`</div>`;
  // Medisiner til flokk / uten dyr
  if(isMia()){
    const fl=o.flokk||[];
    h+=`<h3>Medisiner til flokk eller uten registrert dyr</h3><div class="card">`;
    if(editable){
      h+= fl.map((m,j)=>`<div class="medrad"><div class="row between"><strong class="small">${esc(m.navn)}</strong><span class="row" style="gap:6px"><span class="ts">${kr(m.pris)} kr</span><button class="x" onclick="fjernFlokk(${j})" title="Fjern">×</button></span></div>
        <div class="grid2" style="gap:8px;margin-top:4px"><label class="ts" style="display:block">Dyreart<select onchange="flokkSet(${j},'art',this.value)" style="padding:6px 8px;margin-top:2px"><option value="">Velg</option>${ARTER.map(a=>`<option ${m.art===a?'selected':''}>${a}</option>`).join('')}</select></label>
        <label class="ts" style="display:block">Antall dyr<input type="number" min="0" step="1" value="${m.antallDyr??''}" onchange="flokkSet(${j},'antallDyr',this.value)" style="padding:6px 8px;margin-top:2px"></label></div>
        <div class="medgrid"><label class="ts">Mengde<input type="number" min="0" step="any" value="${m.antall}" onchange="flokkSet(${j},'antall',this.value)"></label>
        <label class="ts">Gitt<input type="datetime-local" value="${localInput(m.tid||nowTs())}" onchange="flokkSet(${j},'tid',this.value)"></label></div></div>`).join('');
      h+=`<div class="picker" style="margin-top:6px"><input type="search" placeholder="+ Legg til medisin (søk)" oninput="medPick(this.value,'f')" autocomplete="off"><div id="pick-med-f"></div></div>`;
    } else {
      h+= fl.length ? fl.map(m=>`<div class="small" style="padding:3px 0">${esc(m.navn)} × ${m.antall}${m.art||m.antallDyr?` <span class="muted">· ${esc(m.art||'')}${m.antallDyr?' · '+m.antallDyr+' dyr':''}</span>`:''} <span class="ts">${fmtTs(m.tid)}</span></div>`).join('') : '<div class="small muted">Ingen.</div>';
    }
    h+=`</div>`;
  }
  h+=`<div class="card"><div class="row between"><span>Medisiner <span class="small muted">· faktureres som én linje</span></span><strong>${kr(medSum(o))} kr</strong></div></div>`;
  h+=`<div class="card"><div class="row between"><span>Sum eks. mva</span><span>${kr(sum(o))} kr</span></div>
    <div class="row between small muted"><span>Mva 25 %</span><span>${kr(sum(o)*MVA)} kr</span></div>
    <div class="row between total" style="margin-top:4px"><span>Sum inkl. mva</span><span>${kr(sum(o)*(1+MVA))} kr</span></div></div>`;
  if(isMia() && kanSkrive() && !o.fakturert){
    if(apen(o)) h+=`<div class="row wrapf noprint" style="margin-top:14px;gap:8px"><button class="btn primary grow" onclick="ferdigDialog()">Ferdig behandlet …</button><button class="btn" onclick="tidspunktDialog()">Endre tidspunkt</button></div>`;
    else h+=`<div class="card" style="background:var(--brand-2);border-color:transparent"><div class="small">Ferdig behandlet ${fmtTs(o.ferdigTs)}. ${fakturerbar(o)?'Oppdraget er klart til fakturering.':'Oppdraget går ikke til fakturering.'}${harMed(o)?(o.dhpTs?' Rapportert til Dyrehelseportalen '+fmtTs(o.dhpTs)+'.':' <strong>Ikke rapportert til Dyrehelseportalen.</strong>'):''}</div>
      <div style="margin-top:8px"><button class="btn sm" onclick="gjenapne()">Gjenåpne for endringer</button></div></div>`;
  }
  if(o.fakturert) h+=`<div class="lock" style="margin-top:12px">Fakturert ${fmtTs(o.fakturertTs)} – låst for endringer.</div>`;
  return h+'<div style="height:70px"></div>';
};
function vaktFelt(o, kanEndre){
  const auto=autoVakt(o), manuell=(o.vakt===true||o.vakt===false);
  const tekst = paVakt(o) ? 'Ja' : 'Nei';
  if(!kanEndre) return `${tekst}<span class="ts"> · ${manuell?'satt manuelt':'fra kalenderen'}</span>`;
  return `<select style="width:auto;padding:5px 8px" onchange="settVakt(this.value)">
    <option value="auto" ${!manuell?'selected':''}>Fra kalenderen (${auto?'Ja':'Nei'})</option>
    <option value="ja" ${o.vakt===true?'selected':''}>Ja</option><option value="nei" ${o.vakt===false?'selected':''}>Nei</option></select>`;
}
function settVakt(v){ cur().vakt = v==='ja' ? true : v==='nei' ? false : null; save(); render(); }
function dyrVis(d){
  return `<div class="dyr"><div class="row between"><strong>${esc(d.art)}${d.individ?' · '+esc(d.individ):''}</strong>${d.individ?`<a class="small" href="#" onclick="dyrHistorikk('${esc(d.individ)}');return false">Historikk</a>`:''}</div>
    <div class="kv" style="margin-top:6px"><div>Diagnose</div><div>${esc(d.diagnose)||'–'}</div><div>Behandling</div><div style="white-space:pre-wrap">${esc(d.behandling)||'–'}</div>${d.notat?`<div>Notater</div><div>${esc(d.notat)}</div>`:''}
    <div>Medisiner</div><div>${(d.medisiner||[]).map(m=>`${esc(m.navn)} × ${m.antall} <span class="ts">${fmtTs(m.tid)}</span>`).join('<br>')||'–'}</div></div></div>`;
}
function dyrRediger(o,d,i){
  const med=d.medisiner||[];
  return `<div class="dyr">
    ${malVelger(o,i)}
    <div class="grid2"><div><label class="f">Dyreart</label><select onchange="dyrSet(${i},'art',this.value)">${ARTER.map(a=>`<option ${d.art===a?'selected':''}>${a}</option>`).join('')}</select></div>
    <div><label class="f">Individnr. / øremerke</label><input type="text" value="${esc(d.individ)}" onchange="dyrSet(${i},'individ',this.value)" placeholder="NO 12345 0001"></div></div>
    <label class="f">Diagnose</label><input type="text" value="${esc(d.diagnose)}" onchange="dyrSet(${i},'diagnose',this.value)">
    <label class="f">Behandling</label><textarea onchange="dyrSet(${i},'behandling',this.value)">${esc(d.behandling)}</textarea>
    <label class="f">Egne notater</label><textarea onchange="dyrSet(${i},'notat',this.value)" style="min-height:50px">${esc(d.notat)}</textarea>
    <label class="f">Medisiner gitt til dette dyret</label>
    ${med.map((m,j)=>`<div class="medrad"><div class="row between"><strong class="small">${esc(m.navn)}</strong><span class="row" style="gap:6px"><span class="ts">${kr(m.pris)} kr</span><button class="x" onclick="fjernMed(${i},${j})" title="Fjern">×</button></span></div>
      <div class="medgrid"><label class="ts">Mengde<input type="number" min="0" step="any" value="${m.antall}" onchange="medSet(${i},${j},'antall',this.value)"></label>
      <label class="ts">Gitt<input type="datetime-local" value="${localInput(m.tid||nowTs())}" onchange="medSet(${i},${j},'tid',this.value)"></label></div></div>`).join('')}
    <div class="picker" style="margin-top:6px"><input type="search" placeholder="+ Legg til medisin (søk)" oninput="medPick(this.value,${i})" autocomplete="off"><div id="pick-med-${i}"></div></div>
    <div class="row between" style="margin-top:8px"><span class="ts">${d.individ?`<a href="#" onclick="dyrHistorikk('${esc(d.individ)}');return false">Se historikk for dette dyret</a>`:''}</span><button class="btn ghost sm warn" onclick="fjernDyr(${i})">Fjern dyr</button></div>
  </div>`;
}
function touchJournal(){ cur().journalTs=nowTs(); }
function dyrSet(i,f,v){ cur().dyr[i][f]=v; touchJournal(); save(); }
function nyttDyr(){ cur().dyr.push({id:uid(),art:'Storfe',individ:'',diagnose:'',behandling:'',notat:'',medisiner:[]}); touchJournal(); save(); render(); }
function fjernDyr(i){ modal(`<h2>Fjerne dyret?</h2><p class="small muted">Journal og medisiner for dette dyret på oppdraget fjernes.</p><div class="row" style="justify-content:flex-end;gap:8px"><button class="btn" onclick="closeModal()">Avbryt</button><button class="btn primary" onclick="cur().dyr.splice(${i},1);touchJournal();save();closeModal();render()">Fjern</button></div>`); }
function linjeSet(i,f,v){ cur().linjer[i][f]=+v||0; save(); render(); }
function fjernLinje(i){ cur().linjer.splice(i,1); save(); render(); }
function medSet(i,j,f,v){ const m=cur().dyr[i].medisiner[j]; if(f==='tid') m.tid = v ? new Date(v).toISOString() : nowTs(); else m.antall=+v||0; touchJournal(); save(); if(f!=='tid') render(); }
function fjernMed(i,j){ cur().dyr[i].medisiner.splice(j,1); touchJournal(); save(); render(); }
function varePick(q){
  q=q.trim().toLowerCase(); const el=document.getElementById('pick-vare'); if(!q){ el.innerHTML=''; return; }
  const l=aktiveVarer().filter(x=>x.navn.toLowerCase().includes(q)||String(x.nr).includes(q)).slice(0,10);
  el.innerHTML=`<div class="list">${l.length?l.map(x=>`<div class="opt" onclick="leggTilVare(${x.nr})"><span>${esc(x.navn)}</span><span class="muted small">${x.pris!=null?kr(x.pris)+' kr':''}${x.enhet?' / '+esc(x.enhet):''}</span></div>`).join(''):'<div class="opt muted">Ingen treff</div>'}</div>`;
}
function leggTilVare(nr){ const v=S.varer.find(x=>x.nr===nr); cur().linjer.push({varenr:v.nr,navn:v.navn,antall:1,pris:v.pris||0}); save(); render(); }
function medPick(q,i){
  q=q.trim().toLowerCase(); const el=document.getElementById('pick-med-'+i); if(!q){ el.innerHTML=''; return; }
  const l=aktiveMedisiner().filter(x=>x.navn.toLowerCase().includes(q)).slice(0,10);
  el.innerHTML=`<div class="list">${l.length?l.map(x=>`<div class="opt" onclick="leggTilMed('${i}','${x.id}')"><span>${esc(x.navn)}</span><span class="muted small">${kr(x.pris)} kr</span></div>`).join(''):'<div class="opt muted">Ingen treff. Legg til medisinen under Meny → Medisinliste.</div>'}</div>`;
}
function flokkSet(j,f,v){ const m=cur().flokk[j]; if(f==='tid') m.tid=v?new Date(v).toISOString():nowTs(); else if(f==='art') m.art=v; else if(f==='antallDyr') m.antallDyr = v===''?null:Math.max(0,Math.round(+v)); else m.antall=+v||0; touchJournal(); save(); if(f==='antall') render(); }
function fjernFlokk(j){ cur().flokk.splice(j,1); touchJournal(); save(); render(); }
function leggTilMed(i,id){ const x=S.medisiner.find(m=>m.id===id);
  if(i==='f'){ const o=cur(); o.flokk=o.flokk||[]; const forrige=o.flokk.at(-1); o.flokk.push({id:uid(),navn:x.navn,antall:1,pris:x.pris,tid:nowTs(),art:forrige?forrige.art:'',antallDyr:forrige?forrige.antallDyr:null}); touchJournal(); save(); render(); return; }
  const d=cur().dyr[+i]; d.medisiner=d.medisiner||[]; d.medisiner.push({id:uid(),navn:x.navn,antall:1,pris:x.pris,tid:nowTs()}); touchJournal(); save(); render(); }
function ferdigDialog(){
  const o=cur();
  modal(`<h2>Ferdig behandlet</h2>
    <label class="choice on" id="ch-f" onclick="velgFerdig('fullfort')"><input type="radio" name="fs" checked><div><strong>Fullført</strong><div class="small muted">Oppdraget ble utført og går til fakturering.</div></div></label>
    <label class="choice" id="ch-a" onclick="velgFerdig('avlyst')"><input type="radio" name="fs"><div><strong>Avlyst</strong><div class="small muted">Oppdraget ble ikke utført.</div></div></label>
    <div id="avl-extra" style="display:none;margin:4px 0 8px 4px"><label class="check"><input type="checkbox" id="avl-fak"> Send likevel til fakturering (f.eks. kjøring eller tid brukt)</label>
    <div class="ts" style="margin-top:4px">Det som er registrert under tjenester og varer blir fakturert.</div></div>
    ${!o.linjer.length && !alleMedLinjer(o).length?'<div class="banner">Det er ikke registrert noen tjenester eller varer på oppdraget.</div>':''}
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeModal()">Avbryt</button><button class="btn primary" onclick="bekreftFerdig()">Bekreft</button></div>`);
  UI._fs='fullfort';
}
function velgFerdig(s){ UI._fs=s; document.getElementById('ch-f').classList.toggle('on',s==='fullfort'); document.getElementById('ch-a').classList.toggle('on',s==='avlyst'); document.getElementById('avl-extra').style.display = s==='avlyst'?'block':'none'; }
function bekreftFerdig(){ const o=cur(); o.status=UI._fs; o.fakturer = o.status==='avlyst' ? document.getElementById('avl-fak').checked : true; o.ferdigTs=nowTs(); save(); closeModal(); render(); toast(o.status==='fullfort'?'Fullført – klar til fakturering':(o.fakturer?'Avlyst – sendes til fakturering':'Avlyst')); }
function gjenapne(){ const o=cur(); o.status='bestilt'; o.ferdigTs=null; o.fakturer=false; save(); render(); toast('Oppdraget er åpnet igjen'); }
function tidspunktDialog(){
  const o=cur();
  modal(`<h2>Endre tidspunkt</h2><p class="small muted">Flytt oppdraget til et senere eller tidligere tidspunkt.${o.opprinnelig?' Opprinnelig tidspunkt: '+esc(o.opprinnelig)+'.':''}</p>
    <div class="grid2"><div><label class="f">Dato</label><input type="date" id="ut-d" value="${o.dato}"></div>
    <div><label class="f">Tid (valgfritt)</label><input type="time" id="ut-t" value="${o.tid||''}"></div></div>
    <div class="row" style="justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn" onclick="closeModal()">Avbryt</button><button class="btn primary" onclick="bekreftTidspunkt()">Lagre</button></div>`);
}
function bekreftTidspunkt(){
  const o=cur(), d=document.getElementById('ut-d').value||o.dato, tt=document.getElementById('ut-t').value;
  if(d===o.dato && tt===(o.tid||'')){ closeModal(); return; }
  if(!o.opprinnelig) o.opprinnelig = o.dato+(o.tid?' '+o.tid:'');
  o.dato=d; o.tid=tt; o.status='flyttet';
  if(o.opprinnelig===o.dato+(o.tid?' '+o.tid:'')){ o.opprinnelig=null; o.status='bestilt'; }
  save(); closeModal(); render(); toast((flyttRetning(o)||'Flyttet')+' til '+fmtDate(o.dato)+(o.tid?' kl. '+o.tid:''));
}

// ================= Journalmaler =================
const aktiveMaler = () => S.maler.filter(m=>!m.deleted).sort((a,b)=>a.navn.localeCompare(b.navn,'nb'));
const malById = id => S.maler.find(m=>m.id===id);
const foreslatteMaler = o => { const nr=new Set(o.linjer.map(l=>l.varenr)); return aktiveMaler().filter(m=>m.tjenester.some(t=>nr.has(t))); };
function malVelger(o,i){
  const fs=foreslatteMaler(o), alle=aktiveMaler();
  return `<div class="row wrapf" style="gap:6px;align-items:center;margin-bottom:2px">
    ${fs.length?`<span class="small muted">Foreslått mal:</span>${fs.map(m=>`<button class="chip" onclick="brukMal(${i},'${m.id}')">${esc(m.navn)}</button>`).join('')}`:''}
    <select style="width:auto;max-width:100%;padding:5px 8px;font-size:13px" onchange="if(this.value)brukMal(${i},this.value)">
      <option value="">${fs.length?'Annen mal …':'Bruk journalmal …'}</option>${alle.map(m=>`<option value="${m.id}">${esc(m.navn)}</option>`).join('')}</select></div>`;
}
function brukMal(i,id){
  const o=cur(), d=o.dyr[i], m=malById(id); if(!m) return;
  const join=(a,b)=> !b ? a : (a && a.trim() ? a.trim()+'\n'+b : b);
  d.diagnose = d.diagnose && d.diagnose.trim() ? d.diagnose : m.diagnose;
  d.behandling = join(d.behandling, m.behandling); d.notat = join(d.notat, m.notat);
  d.medisiner=d.medisiner||[]; let n=0;
  m.medisiner.forEach(x=>{ const med=S.medisiner.find(y=>y.navn===x.navn && y.aktiv!==false); if(!med) return;
    if(!d.medisiner.find(y=>y.navn===x.navn)){ d.medisiner.push({id:uid(),navn:med.navn,antall:x.antall||1,pris:med.pris,tid:nowTs()}); n++; } });
  touchJournal(); save(); render(); toast(`Mal «${m.navn}» brukt`+(n?` · ${n} medisin${n>1?'er':''} lagt til`:''));
}
VIEWS.maler = () => `<div style="margin-top:12px"><button class="btn ghost" onclick="go('meny')">← Meny</button></div><h1 style="margin-top:4px">Journalmaler</h1>
  <p class="small muted" style="margin-top:-4px">En mal fyller ut diagnose og behandling på et dyr og foreslår medisiner. Koble malen til tjenester, så foreslås den når tjenesten legges på oppdraget.</p>
  <button class="btn primary" onclick="nyMal()" style="margin-bottom:12px">+ Ny mal</button>
  ${aktiveMaler().map(m=>`<div class="card item" onclick="redigerMal('${m.id}')"><div class="row between"><strong>${esc(m.navn)}</strong><span class="small muted">${m.tjenester.length} tjenester · ${m.medisiner.length} medisiner</span></div>
    <div class="small muted" style="margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.diagnose)}</div></div>`).join('')||'<div class="empty">Ingen maler ennå.</div>'}`;
function nyMal(){ const m={id:uid(),navn:'Ny mal',tjenester:[],diagnose:'',behandling:'',notat:'',medisiner:[],deleted:false}; S.maler.push(m); save(); redigerMal(m.id); }
function redigerMal(id){ UI.mal=id; UI.view='mal'; render(); window.scrollTo(0,0); }
const curMal = () => malById(UI.mal);
function malSet(f,v){ curMal()[f]=v; save(); }
VIEWS.mal = () => {
  const m=curMal(); if(!m||m.deleted) return '<div class="empty">Fant ikke malen.</div>';
  const vare = nr => S.varer.find(v=>v.nr===nr);
  return `<div style="margin-top:12px"><button class="btn ghost" onclick="go('maler')">← Maler</button></div>
  <div class="card">
    <label class="f" style="margin-top:0">Navn på malen</label><input type="text" value="${esc(m.navn)}" onchange="malSet('navn',this.value)">
    <label class="f">Diagnose</label><input type="text" value="${esc(m.diagnose)}" onchange="malSet('diagnose',this.value)">
    <label class="f">Behandling (journaltekst)</label><textarea style="min-height:130px" onchange="malSet('behandling',this.value)">${esc(m.behandling)}</textarea>
    <label class="f">Egne notater (valgfritt)</label><textarea style="min-height:50px" onchange="malSet('notat',this.value)">${esc(m.notat)}</textarea>
    <div class="ts" style="margin-top:6px">Tips: Bruk __ der du skal fylle inn noe på stedet.</div></div>
  <h3>Koblet til tjenester</h3><div class="card">
    <div class="chips">${m.tjenester.map(nr=>{const v=vare(nr);return `<span class="chip x">${esc(v?v.navn:nr)} <button class="x" style="font-size:15px;padding:0 0 0 4px" onclick="malFjernTj(${nr})">×</button></span>`}).join('')||'<span class="small muted">Ingen tjenester koblet til.</span>'}</div>
    <div class="picker"><input type="search" placeholder="+ Koble til tjeneste (søk)" oninput="malPick(this.value,'tj')" autocomplete="off"><div id="mpick-tj"></div></div></div>
  <h3>Foreslåtte medisiner</h3><div class="card">
    ${m.medisiner.length?`<table class="lines"><tr><th>Medisin</th><th class="right">Antall</th><th></th></tr>${m.medisiner.map((x,i)=>`<tr><td>${esc(x.navn)}</td><td class="right"><input type="number" min="0" step="any" value="${x.antall}" onchange="curMal().medisiner[${i}].antall=+this.value||1;save()"></td><td><button class="x" onclick="curMal().medisiner.splice(${i},1);save();render()">×</button></td></tr>`).join('')}</table>`:'<div class="small muted">Ingen foreslåtte medisiner.</div>'}
    <div class="picker" style="margin-top:10px"><input type="search" placeholder="+ Legg til medisin (søk)" oninput="malPick(this.value,'med')" autocomplete="off"><div id="mpick-med"></div></div></div>
  <div class="row between" style="margin-top:14px"><button class="btn warn" onclick="slettMal()">Slett mal</button><button class="btn primary" onclick="go('maler');toast('Malen er lagret')">Ferdig</button></div>`;
};
function malPick(q,type){
  q=q.trim().toLowerCase(); const el=document.getElementById('mpick-'+type); if(!q){el.innerHTML='';return;}
  const src = type==='tj' ? aktiveVarer() : aktiveMedisiner();
  const l=src.filter(x=>x.navn.toLowerCase().includes(q)).slice(0,10);
  el.innerHTML=`<div class="list">${l.length?l.map(x=>`<div class="opt" onclick="malLeggTil('${type}','${type==='tj'?x.nr:x.id}')"><span>${esc(x.navn)}</span><span class="small muted">${x.nr||''}</span></div>`).join(''):'<div class="opt muted">Ingen treff</div>'}</div>`;
}
function malLeggTil(type,key){
  const m=curMal();
  if(type==='tj'){ const nr=+key; if(!m.tjenester.includes(nr)) m.tjenester.push(nr); }
  else { const x=S.medisiner.find(y=>y.id===key); if(!m.medisiner.find(y=>y.navn===x.navn)) m.medisiner.push({navn:x.navn,antall:1}); }
  save(); render();
}
function malFjernTj(nr){ const m=curMal(); m.tjenester=m.tjenester.filter(x=>x!==nr); save(); render(); }
function slettMal(){ modal(`<h2>Slette malen «${esc(curMal().navn)}»?</h2><p class="small muted">Journaler som allerede er skrevet med malen, endres ikke.</p>
  <div class="row" style="justify-content:flex-end;gap:8px"><button class="btn" onclick="closeModal()">Avbryt</button><button class="btn primary" onclick="curMal().deleted=true;save();closeModal();go('maler');toast('Malen er slettet')">Slett</button></div>`); }

// ================= Kalender =================
VIEWS.kalender = () => {
  const [y,m]=UI.kal.ym.split('-').map(Number);
  const first=new Date(y,m-1,1), start=new Date(first); start.setDate(1-((first.getDay()+6)%7));
  const perDag={}; S.oppdrag.forEach(o=>{ (perDag[o.dato]=perDag[o.dato]||[]).push(o); });
  const vaktDag = ds => { const a=new Date(ds+'T00:00').getTime(), b=a+864e5; return aktiveVakter().some(v=>new Date(v.fra).getTime()<b && new Date(v.til).getTime()>a); };
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i); const ds=iso(d), inM=d.getMonth()===m-1, n=(perDag[ds]||[]).length;
    if(i===35 && !inM) break;
    cells+=`<button class="kd${inM?'':' ut'}${ds===TODAY?' idag':''}${ds===UI.kal.dag?' valgt':''}${vaktDag(ds)?' vakt':''}" onclick="UI.kal.dag='${ds}';render()">
      <span>${d.getDate()}</span>${n?`<i>${n}</i>`:''}</button>`;
  }
  const dag=UI.kal.dag, os=(perDag[dag]||[]).sort((a,b)=>(a.tid||'').localeCompare(b.tid||''));
  const a=new Date(dag+'T00:00').getTime(), b=a+864e5;
  const vs=aktiveVakter().filter(v=>new Date(v.fra).getTime()<b && new Date(v.til).getTime()>a).sort((p,q)=>p.fra.localeCompare(q.fra));
  return `<h1>Kalender</h1>
  <div class="card" style="padding:10px">
    <div class="row between" style="margin-bottom:8px"><button class="btn ghost" onclick="kalMnd(-1)">‹</button><strong>${MND[m-1][0].toUpperCase()+MND[m-1].slice(1)} ${y}</strong><button class="btn ghost" onclick="kalMnd(1)">›</button></div>
    <div class="kgrid">${['ma','ti','on','to','fr','lø','sø'].map(x=>`<div class="kh">${x}</div>`).join('')}${cells}</div>
    <div class="row wrapf small muted" style="gap:14px;margin-top:8px"><span><span class="kleg vakt"></span> Vakt</span><span><span class="kleg n">2</span> Antall oppdrag</span>
      <button class="linkbtn" style="margin-left:auto" onclick="UI.kal.ym=TODAY.slice(0,7);UI.kal.dag=TODAY;render()">I dag</button></div>
  </div>
  <div class="row between" style="margin:16px 0 6px"><h2 style="margin:0">${fmtDate(dag)}</h2></div>
  <h3>Vakt</h3>
  ${vs.length?vs.map(v=>`<div class="card"><div class="row between"><span>${fmtDateKort(iso(new Date(v.fra)))} kl. ${fmtKl(v.fra)} – ${fmtDateKort(iso(new Date(v.til)))} kl. ${fmtKl(v.til)}</span>
    ${isMia()&&kanSkrive()?`<button class="btn ghost sm warn" onclick="slettVaktDialog('${v.id}')">Slett</button>`:''}</div>${v.serie?'<div class="ts">Del av en gjentakende vakt</div>':''}</div>`).join(''):'<div class="small muted" style="margin:0 2px 8px">Ingen vakt registrert denne dagen.</div>'}
  ${isMia()&&kanSkrive()?`<button class="btn sm" onclick="nyVaktDialog('${dag}')">+ Ny vakt</button>`:''}
  <h3>Oppdrag</h3>
  ${os.map(oppdragKort).join('')||'<div class="small muted" style="margin:0 2px 8px">Ingen oppdrag denne dagen.</div>'}
  ${isMia()&&kanSkrive()?`<button class="btn sm" onclick="nyBestilling(null,'${dag}')">+ Ny bestilling denne dagen</button>`:''}
  <div style="height:80px"></div>`;
};
function kalMnd(n){ const [y,m]=UI.kal.ym.split('-').map(Number); const d=new Date(y,m-1+n,1); UI.kal.ym=d.getFullYear()+'-'+pad(d.getMonth()+1); render(); }
function nyVaktDialog(dag){
  modal(`<h2>Ny vakt</h2>
    <div class="grid2"><div><label class="f">Fra dato</label><input type="date" id="nv-fd" value="${dag}"></div><div><label class="f">Fra kl.</label><input type="time" id="nv-ft" value="16:00"></div>
    <div><label class="f">Til dato</label><input type="date" id="nv-td" value="${addDays(1,dag)}"></div><div><label class="f">Til kl.</label><input type="time" id="nv-tt" value="08:00"></div></div>
    <div class="grid2"><div><label class="f">Gjenta</label><select id="nv-g"><option value="0">Nei</option><option value="1">Hver uke</option><option value="2">Hver 2. uke</option><option value="3">Hver 3. uke</option><option value="4">Hver 4. uke</option></select></div>
    <div><label class="f">Antall ganger</label><input type="number" id="nv-n" min="1" max="52" value="6"></div></div>
    <div class="ts" style="margin-top:6px">Oppdrag som ligger innenfor en vakt, merkes automatisk «på vakt».</div>
    <div class="row" style="justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn" onclick="closeModal()">Avbryt</button><button class="btn primary" onclick="lagreVakt()">Lagre vakt</button></div>`);
}
function lagreVakt(){
  const g=+document.getElementById('nv-g').value, n=g ? Math.min(52,Math.max(1,+document.getElementById('nv-n').value||1)) : 1;
  const fra=new Date(document.getElementById('nv-fd').value+'T'+(document.getElementById('nv-ft').value||'00:00'));
  const til=new Date(document.getElementById('nv-td').value+'T'+(document.getElementById('nv-tt').value||'00:00'));
  if(!(til>fra)){ toast('Slutten må være etter starten'); return; }
  const serie = n>1 ? uid() : null;
  for(let k=0;k<n;k++){ const f=new Date(fra), t=new Date(til); f.setDate(f.getDate()+k*7*g); t.setDate(t.getDate()+k*7*g);
    S.vakter.push({id:uid(),fra:f.toISOString(),til:t.toISOString(),serie,deleted:false}); }
  save(); closeModal(); render(); toast(n>1?`${n} vakter lagt inn`:'Vakt lagt inn');
}
function slettVaktDialog(id){
  const v=S.vakter.find(x=>x.id===id);
  modal(`<h2>Slette vakt?</h2><p class="small muted">Oppdrag som er satt «fra kalenderen», regnes på nytt.</p>
  <div class="row wrapf" style="justify-content:flex-end;gap:8px"><button class="btn" onclick="closeModal()">Avbryt</button>
  ${v.serie?`<button class="btn warn" onclick="slettVakt('${id}',true)">Slett denne og senere i serien</button>`:''}
  <button class="btn primary" onclick="slettVakt('${id}',false)">Slett denne</button></div>`);
}
function slettVakt(id,serie){ const v=S.vakter.find(x=>x.id===id);
  S.vakter.forEach(x=>{ if(x.id===id || (serie && v.serie && x.serie===v.serie && x.fra>=v.fra)) x.deleted=true; });
  save(); closeModal(); render(); toast('Vakt slettet'); }

// ================= Søk =================
VIEWS.sok = () => {
  const f=UI.sok, fq=s=>s.toLowerCase();
  const res=S.oppdrag.filter(o=>{
    const k=kunde(o.kundenr);
    if(f.q && !fq(k.navn+' '+k.nr+' '+(k.kontakt||'')+' '+(k.sted||'')+' '+(o.nr||'')).includes(fq(f.q))) return false;
    if(f.fra && o.dato<f.fra) return false; if(f.til && o.dato>f.til) return false;
    if(f.status && statusKey(o)!==f.status) return false;
    if(f.vare && !(o.linjer.some(l=>fq(l.navn).includes(fq(f.vare))) || (isMia() && alleMedLinjer(o).some(m=>fq(m.navn).includes(fq(f.vare)))))) return false;
    if(isMia() && f.dhp && !(harMed(o) && !apen(o) && !o.dhpTs)) return false;
    if(isMia() && f.individ && !o.dyr.some(d=>fq(d.individ+' '+d.diagnose+' '+d.behandling+' '+d.notat).includes(fq(f.individ)))) return false;
    return true;
  }).sort((a,b)=>b.dato.localeCompare(a.dato));
  return `<h1>Søk og historikk</h1>
  <div class="card">
    <label class="f" style="margin-top:0">Kunde eller oppdragsnummer</label><input type="search" value="${esc(f.q)}" placeholder="Navn, kundenr, sted eller 2026-014" oninput="UI.sok.q=this.value;sokRes()">
    <div class="grid2"><div><label class="f">Fra dato</label><input type="date" value="${f.fra}" onchange="UI.sok.fra=this.value;render()"></div>
    <div><label class="f">Til dato</label><input type="date" value="${f.til}" onchange="UI.sok.til=this.value;render()"></div></div>
    ${isMia()?`<label class="f">Øremerke / individnr. / journaltekst</label><input type="search" value="${esc(f.individ)}" placeholder="F.eks. NO 12345 0417 eller mastitt" oninput="UI.sok.individ=this.value;sokRes()">`:''}
    <div class="grid2"><div><label class="f">Status</label><select onchange="UI.sok.status=this.value;render()"><option value="">Alle</option>${Object.entries(STATUS).map(([k,t])=>`<option value="${k}" ${f.status===k?'selected':''}>${t}</option>`).join('')}</select></div>
    <div><label class="f">Vare, tjeneste${isMia()?' eller medisin':''}</label><input type="search" value="${esc(f.vare)}" placeholder="F.eks. kjøring" oninput="UI.sok.vare=this.value;sokRes()"></div></div>
    ${isMia()?`<label class="check" style="margin-top:10px"><input type="checkbox" ${f.dhp?'checked':''} onchange="UI.sok.dhp=this.checked;render()"> Bare oppdrag som ikke er rapportert til Dyrehelseportalen</label>`:''}
    <div style="margin-top:10px"><button class="btn ghost sm" onclick="UI.sok={q:'',fra:'',til:'',individ:'',status:'',vare:'',dhp:false};render()">Nullstill filtre</button></div>
  </div>
  <div class="small muted" style="margin:8px 2px">${res.length} treff</div>${res.map(oppdragKort).join('')||'<div class="empty">Ingen oppdrag passer filtrene.</div>'}<div style="height:70px"></div>`;
};
function dyrHistorikk(ind){ UI.sok={q:'',fra:'',til:'',individ:ind,status:'',vare:''}; go('sok'); }

  const q=(UI.kq||'').toLowerCase();
  const l=S.kunder.filter(k=>!q||(k.navn+' '+k.nr+' '+(k.sted||'')+' '+(k.kontakt||'')+' '+(k.produsentnr||'')).toLowerCase().includes(q));
  return `<h1>Kunder</h1>
  ${isMia()&&kanSkrive()?`<div class="row wrapf" style="gap:8px;margin-bottom:10px"><label class="btn sm" style="cursor:pointer">Importer kunder fra fil<input type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="importerKunder(this.files[0]);this.value=''"></label><span class="ts">${S.kunder.length} kunder</span></div>`:''}
  <input type="search" placeholder="Søk kunde" value="${esc(UI.kq||'')}" oninput="UI.kq=this.value;sokRes()" style="margin-bottom:10px">
  ${l.map(k=>{ const n=S.oppdrag.filter(o=>o.kundenr===k.nr).length;
    return `<div class="card item" onclick="visKunde(${k.nr})"><div class="row between"><strong>${esc(k.navn)}</strong><span class="small muted">${n} oppdrag</span></div>
    <div class="small muted">${k.nr} · ${esc(k.adresse||'')}, ${esc(k.sted||'')}</div></div>`; }).join('')}
  <div class="ts" style="margin:10px 2px 80px">Kunderegisteret lastes inn fra samme kundefil som brukes i Duett.</div>`;
};
function visKunde(nr){ UI.kunde=nr; UI.view='kunde'; render(); window.scrollTo(0,0); }
VIEWS.kunde = () => {
  const k=kunde(UI.kunde); const os=S.oppdrag.filter(o=>o.kundenr===k.nr).sort((a,b)=>b.dato.localeCompare(a.dato));
  const dyr={}; os.forEach(o=>o.dyr.forEach(d=>{ if(d.individ){ const x=(dyr[d.individ]=dyr[d.individ]||{art:d.art,n:0,siste:o.dato}); x.n++; if(o.dato>x.siste) x.siste=o.dato; } }));
  const ed = isMia() && kanSkrive();
  return `<div style="margin-top:12px" class="noprint"><button class="btn ghost" onclick="go('kunder')">← Kunder</button></div>
  <h1 style="margin-top:4px">${esc(k.navn)}</h1>
  <div class="card"><div class="kv"><div>Kundenr.</div><div>${k.nr}</div>${k.kontakt?`<div>Kontakt</div><div>${esc(k.kontakt)}</div>`:''}
    <div>Adresse</div><div>${esc(k.adresse||'')}, ${esc(k.postnr||'')} ${esc(k.sted||'')}</div><div>Telefon</div><div>${esc(k.tlf||'')}</div>
    <div>Produsentnr.</div><div>${ed?`<input type="text" value="${esc(k.produsentnr||'')}" placeholder="Brukes i rapport til Dyrehelseportalen" onchange="kunde(${k.nr}).produsentnr=this.value.trim();save();toast('Produsentnummer lagret')" style="max-width:240px;padding:6px 8px">`:esc(k.produsentnr||'–')}</div></div>
    <div class="row wrapf" style="margin-top:12px;gap:8px">${ed?`<button class="btn primary sm" onclick="nyBestilling(${k.nr})">+ Ny bestilling</button>`:''}${isMia()?`<button class="btn sm" onclick="journalUtdrag(${k.nr})">Journalutdrag</button>`:''}</div></div>
  ${isMia()&&Object.keys(dyr).length?`<h3>Dyr med journal</h3><div class="card">${Object.entries(dyr).map(([ind,d])=>`<div class="row between" style="padding:4px 0"><a href="#" onclick="dyrHistorikk('${esc(ind)}');return false">${esc(d.art)} · ${esc(ind)}</a><span class="small muted">${d.n} oppdrag · sist ${fmtDate(d.siste)}</span></div>`).join('')}</div>`:''}
  <h3>Oppdragshistorikk</h3>${os.map(oppdragKort).join('')||'<div class="empty">Ingen oppdrag registrert.</div>'}<div style="height:70px"></div>`;
};
function journalUtdrag(nr){
  const k=kunde(nr); const os=S.oppdrag.filter(o=>o.kundenr===nr && (o.dyr.length||(o.flokk||[]).length)).sort((a,b)=>a.dato.localeCompare(b.dato));
  let t=`JOURNALUTDRAG\nVeterinær: ${ME.praksis||''}\nDyreeier: ${k.navn} (${k.nr})${k.produsentnr?', produsentnr. '+k.produsentnr:''}, ${k.adresse||''}, ${k.postnr||''} ${k.sted||''}\nUtskrevet: ${new Date().toLocaleString('nb-NO')}\n`;
  os.forEach(o=>{ t+=`\n— ${oNr(o)}, ${fmtNo(o.dato)} —\nHenvendelse: ${fmtTs(o.henvendelseTs)} – ${o.henvendelse}\nJournalført: ${fmtTs(o.journalTs)}\n`;
    o.dyr.forEach(d=>{ t+=`  ${d.art} ${d.individ}\n  Diagnose: ${d.diagnose}\n  Behandling: ${d.behandling}\n`;
      (d.medisiner||[]).forEach(m=>{ t+=`  Legemiddel: ${m.navn}, mengde ${m.antall}, gitt ${fmtTs(m.tid)}\n`; }); });
    (o.flokk||[]).forEach(m=>{ t+=`  Flokk${m.art?' ('+m.art+(m.antallDyr?', '+m.antallDyr+' dyr':'')+')':''}: ${m.navn}, mengde ${m.antall}, gitt ${fmtTs(m.tid)}\n`; }); });
  if(!os.length) t+='\nIngen journalførte opplysninger.';
  UI._ju=t;
  modal(`<h2>Journalutdrag – ${esc(k.navn)}</h2><p class="small muted">Til innsyn for dyreeier eller Mattilsynet. Egne notater er ikke tatt med.</p>
    <pre class="out">${esc(t)}</pre><div class="row" style="justify-content:flex-end;gap:8px;margin-top:10px"><button class="btn" onclick="closeModal()">Lukk</button><button class="btn primary" onclick="kopierTekst(UI._ju)">Kopier</button></div>`);
}

  const item=(v,t,sub)=>`<div class="card item" onclick="go('${v}')"><div class="row between"><strong>${t}</strong><span class="muted">›</span></div><div class="small muted">${sub}</div></div>`;
  return `<h1>Meny</h1>
  ${item('eksport','Fakturering','Lag ordrefil til Duett for en periode')}
  ${isMia()?item('dhp','Rapport til Dyrehelseportalen','Legemidler per dyr, klar til å kopieres'):''}
  ${isMia()?item('maler','Journalmaler','Ferdige tekster for vanlige tjenester'):''}

function fakturaData(){
  const {fra,til}=UI.periode;
  const os=S.oppdrag.filter(o=>fakturerbar(o) && (!fra||o.dato>=fra) && (!til||o.dato<=til)).sort((a,b)=>(a.dato+a.tid).localeCompare(b.dato+b.tid));
  const per={}; os.forEach(o=>{ (per[o.kundenr]=per[o.kundenr]||[]).push(o); });
  return {os, per};
}
function fakturaLinjer(o){
  const l=o.linjer.map(x=>({varenr:x.varenr,navn:x.navn,antall:+x.antall||0,pris:+x.pris||0}));
  const ms=Math.round(medSum(o)*100)/100; if(ms>0) l.push({varenr:medVare().nr,navn:'Medisiner',antall:1,pris:ms,belop:true});
  return l;
}
const oppdragTekst = o => `${oNr(o)} – ${fmtNo(o.dato)}${o.status==='avlyst'?' – Avlyst':''}`;
VIEWS.eksport = () => {
  const {os,per}=fakturaData(), p=UI.periode;
  const total=os.reduce((s,o)=>s+fakturaLinjer(o).reduce((a,l)=>a+l.antall*l.pris,0),0);

  <div class="ts" style="margin-top:8px">Med: fullførte oppdrag og avlyste oppdrag som er merket for fakturering, som ikke er fakturert før. Hver kunde får én faktura for perioden, og hvert oppdrag vises med nummer, dato og delsum.</div></div>`;
  if(!os.length) return h+`<div class="empty">Ingen oppdrag å fakturere i perioden.</div>`;
  h+=`<h3>${Object.keys(per).length} fakturaer · ${os.length} oppdrag · ${kr(total)} kr eks. mva</h3>`;
  Object.keys(per).sort((a,b)=>a-b).forEach(nr=>{ const k=kunde(+nr), l=per[nr];
    const s=l.reduce((a,o)=>a+fakturaLinjer(o).reduce((x,y)=>x+y.antall*y.pris,0),0);
    h+=`<div class="card"><div class="row between"><strong>${esc(k.navn)} <span class="small muted">${k.nr}</span></strong><span>${kr(s)} kr</span></div>

      fl.map(x=>`<tr><td>${esc(x.navn)}</td><td class="right small muted">${x.belop?'':x.antall+' × '+kr(x.pris)}</td><td class="right">${kr(x.antall*x.pris)}</td></tr>`).join('')+
      `<tr><td class="small muted">Sum ${esc(oNr(o).toLowerCase())}</td><td></td><td class="right small"><strong>${kr(os_)}</strong></td></tr>`; }).join('')}</table></div>`; });
  if(utenNr) h+=`<div class="banner">${utenNr} oppdrag har ikke fått oppdragsnummer ennå, fordi de ikke er lagret på serveren. Vent til det står «Lagret» øverst.</div>`;
  h+=`<div class="banner" style="background:var(--blue-2);color:var(--blue)">Sjekk at «Priser registrert som» står på netto under Firmaoppsett faktura i Duett. Kunde- og varenumrene må finnes i Duett.</div>

  return h;

function settMnd(n){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+n); const f=iso(d); const e=new Date(d.getFullYear(),d.getMonth()+1,0); UI.periode={fra:f,til:n===0?TODAY:iso(e)}; render(); }
function lastNedOrdrefil(){
  if(!window.XLSX){ toast('Excel-biblioteket er ikke lastet. Sjekk nettet.'); return; }
  const {per}=fakturaData(), p=UI.periode;
  const H=['Ordrenummer','Kundenummer*','Ordretype','Leveringsdato','Notat','Betalingsform','Linjetype','Varenummer*','Varenavn','Salgspris','Antall'];
  const rows=[['[Ordre]'], H];
  const notat=`Oppdrag i perioden ${fmtNo(p.fra)}–${fmtNo(p.til)}`;
  Object.keys(per).sort((a,b)=>a-b).forEach(nr=>{
    const l=per[nr]; let forste=true;
    const hode = () => { if(!forste) return ['','','','','','']; forste=false; return ['',+nr,'Vanlig',fmtNo(l.at(-1).dato),notat,'Giro']; };
    l.forEach(o=>{
      rows.push([...hode(),'Tekst','',oppdragTekst(o),'','']);
      fakturaLinjer(o).forEach(x=> rows.push([...hode(),'',x.varenr,'',x.pris,x.belop?'':x.antall]));
      rows.push([...hode(),'Bruddsum','','Sum '+oNr(o).toLowerCase(),'','']);

  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Ordre');
  lastNedBlob(new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), `Duett_ordre_${p.fra}_${p.til}.xlsx`);

function merkFakturert(){ const {os}=fakturaData();

  <div class="row" style="justify-content:flex-end;gap:8px"><button class="btn" onclick="closeModal()">Avbryt</button><button class="btn primary" onclick="bekreftFakturert()">Merk som fakturert</button></div>`); }
function bekreftFakturert(){ const {os}=fakturaData(); const t=nowTs(); os.forEach(o=>{o.fakturert=true;o.fakturertTs=t;}); save(); closeModal(); render(); toast(os.length+' oppdrag merket som fakturert'); }

// ================= Rapport til Dyrehelseportalen =================
function dhpRader(){
  const f=UI.dhp; const rader=[], oppd=new Set();
  S.oppdrag.filter(o=>!apen(o) && o.dato>=f.fra && o.dato<=f.til && (f.vis || !o.dhpTs)).sort((a,b)=>(a.dato+a.tid).localeCompare(b.dato+b.tid)).forEach(o=>{
    const k=kunde(o.kundenr);
    o.dyr.forEach(d=>(d.medisiner||[]).forEach(m=>{ oppd.add(o.id);
      rader.push({tid:m.tid, dato:iso(new Date(m.tid||oppdragTid(o))), kl:fmtKl(m.tid), kundenr:k.nr, kunde:k.navn, prod:k.produsentnr||'', art:d.art, individ:d.individ||'', legemiddel:m.navn, mengde:m.antall, vakt:paVakt(o)?'Ja':'Nei', nr:o.nr||'', rapportert:!!o.dhpTs, oid:o.id}); }));
    (o.flokk||[]).forEach(m=>{ oppd.add(o.id);
      rader.push({tid:m.tid, dato:iso(new Date(m.tid||oppdragTid(o))), kl:fmtKl(m.tid), kundenr:k.nr, kunde:k.navn, prod:k.produsentnr||'', art:m.art||'', individ:m.antallDyr?m.antallDyr+' dyr (flokk)':'Flokk', legemiddel:m.navn, mengde:m.antall, vakt:paVakt(o)?'Ja':'Nei', nr:o.nr||'', rapportert:!!o.dhpTs, oid:o.id}); });
  });
  return {rader, oppd:[...oppd]};
}
const DHP_KOL = [['dato','Dato',r=>fmtNo(r.dato)],['kl','Kl.',r=>r.kl],['prod','Produsentnr.',r=>r.prod],['kunde','Dyreeier',r=>r.kunde],['art','Dyreart',r=>r.art],['individ','Individnr.',r=>r.individ],['legemiddel','Legemiddel',r=>r.legemiddel],['mengde','Mengde',r=>String(r.mengde).replace('.',',')],['vakt','På vakt',r=>r.vakt],['nr','Oppdrag',r=>r.nr]];

  const f=UI.dhp, {rader,oppd}=dhpRader();
  const mangler=rader.filter(r=>!r.prod).length, uIndivid=rader.filter(r=>!r.individ).length, uArt=rader.filter(r=>!r.art).length;
  let h=`<div style="margin-top:12px"><button class="btn ghost" onclick="go('meny')">← Meny</button></div><h1 style="margin-top:4px">Rapport til Dyrehelseportalen</h1>
  <p class="small muted" style="margin-top:-4px">Én rad per legemiddel per dyr. Kolonnen «På vakt» viser om oppdraget var på vakt, for rapportering av kjøring.</p>

  if(!rader.length) return h+`<div class="empty">Ingen legemidler å rapportere i perioden.</div>`;
  if(mangler) h+=`<div class="banner">${mangler} rader mangler produsentnummer. Legg det inn på kundekortet.</div>`;
  if(uIndivid) h+=`<div class="banner">${uIndivid} rader mangler individnummer på dyret.</div>`;

  h+=`<div class="card" style="overflow-x:auto;padding:6px 10px"><table class="lines small" style="min-width:640px"><tr>${DHP_KOL.map(c=>`<th>${c[1]}</th>`).join('')}</tr>
    ${rader.map(r=>`<tr style="${r.rapportert?'opacity:.55':''}" class="item" onclick="apne('${r.oid}')">${DHP_KOL.map(c=>`<td>${esc(c[2](r))}</td>`).join('')}</tr>`).join('')}</table></div>

  <div class="ts" style="margin-top:8px">«Kopier rapport» kopierer radene med tabulator mellom kolonnene. De kan limes inn i Dyrehelseportalen eller i Excel. Rekkefølgen på kolonnene tilpasses når vi vet hvordan skjemaet i portalen ser ut.</div><div style="height:70px"></div>`;
  return h;
};
function kopierDhp(){ const {rader}=dhpRader(); kopierTekst([DHP_KOL.map(c=>c[1]).join('\t'),...rader.map(r=>DHP_KOL.map(c=>c[2](r)).join('\t'))].join('\n')); }
function merkDhp(){ const {oppd}=dhpRader(); const t=nowTs(); oppd.forEach(id=>{ const o=S.oppdrag.find(x=>x.id===id); if(o && !o.dhpTs) o.dhpTs=t; }); save(); render(); toast(oppd.length+' oppdrag merket som rapportert'); }

// ================= Journalpassord: oppsett, opplåsing og bytte =================
let JN = null;            // opplåst journalnøkkel (CryptoKey)
let NOKLER = null;        // raden fra tabellen nokler (de låste kopiene av nøkkelen)
const nokkelId = () => 'jn-'+ME.user.id+'-'+ME.medlem.praksis_id;
const wrapFraRad = (r,p) => ({salt:r[p+'_salt'], iter:r[p+'_iter'], iv:r[p+'_iv'], ct:r[p+'_ct']});
const radFraWrap = (w,p) => ({[p+'_salt']:w.salt, [p+'_iter']:w.iter, [p+'_iv']:w.iv, [p+'_ct']:w.ct});

async function journalnokkel(){
  // Returnerer true når nøkkelen er klar, ellers vises riktig skjerm
  const lagret = await NOKKELLAGER.hent(nokkelId()); JN=null;
  let rad=null, nett=true;
  try{ const r=await sb.from('nokler').select('*').eq('praksis_id',ME.medlem.praksis_id).maybeSingle(); if(r.error) throw r.error; rad=r.data; }
  catch(e){ nett=false; }
  if(nett){ NOKLER=rad; try{ localStorage.setItem('vet5-nokler-'+ME.medlem.praksis_id, JSON.stringify(rad)); }catch(e){} }
  else { try{ NOKLER=JSON.parse(localStorage.getItem('vet5-nokler-'+ME.medlem.praksis_id)||'null'); }catch(e){} }
  // Bruk lagret nøkkel bare hvis den hører til gjeldende journalnøkkel (ny nøkkel etter oppstart eller gjenoppretting gir ny «opprettet»)
  if(lagret && lagret.k && NOKLER && lagret.id===NOKLER.opprettet){ JN=lagret.k; return true; }

  visLasOpp(); return false;
}

// ---------- Import av kunder fra Duett-fil (eller fil med samme kolonner) ----------
async function importerKunder(fil){
  if(!fil) return; if(!window.XLSX){ toast('Excel-biblioteket er ikke lastet. Sjekk nettet.'); return; }
  let rader; try{ const wb=XLSX.read(await fil.arrayBuffer()); rader=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''}); }catch(e){ toast('Filen kunne ikke leses'); return; }
  const hi=rader.findIndex(r=>r.some(c=>/^kundenummer\*?$/i.test(String(c).trim()))); if(hi<0){ toast('Fant ikke kolonnen «Kundenummer» i filen'); return; }
  const H=rader[hi].map(c=>String(c).trim().replace(/\*$/,'').toLowerCase());
  const col = (...navn) => { for(const n of navn){ const i=H.indexOf(n.toLowerCase()); if(i>=0) return i; } return -1; };
  const c={nr:col('Kundenummer'), navn:col('Kundenavn','Navn'), a1:col('Adresse 1','Adresse'), a2:col('Adresse 2'), pn:col('Postnummer'), ps:col('Poststed','Sted'), t1:col('Telefon 1','Telefon'), mob:col('Mobil'), kontakt:col('Kontaktperson','Kontakt')};
  const g=(r,i)=> i<0 ? '' : String(r[i]??'').trim();
  const liste=[];
  for(const r of rader.slice(hi+1)){
    const nr=parseInt(g(r,c.nr),10), navn=g(r,c.navn); if(!nr || !navn) continue;
    let pn=g(r,c.pn); if(/^\d{1,4}$/.test(pn)) pn=pn.padStart(4,'0');
    liste.push({nr, navn, adresse:[g(r,c.a1),g(r,c.a2)].filter(Boolean).join(', '), postnr:pn, sted:g(r,c.ps), tlf:g(r,c.t1)||g(r,c.mob), kontakt:g(r,c.kontakt)});
  }
  if(!liste.length){ toast('Fant ingen kunder i filen'); return; }
  const nye=liste.filter(k=>!S.kunder.some(x=>x.nr===k.nr)).length;
  UI._imp=liste;
  modal(`<h2>Importere kunder?</h2><p>Fant <strong>${liste.length}</strong> kunder i filen: ${nye} nye og ${liste.length-nye} som oppdateres.</p>
    <p class="small muted">Kunder som finnes fra før, får oppdatert navn, adresse og telefon. Produsentnummer og oppdrag beholdes.${c.ps<0?' Filen har ikke poststed, så det feltet blir stående tomt.':''}</p>
    <div class="row" style="justify-content:flex-end;gap:8px;margin-top:12px"><button class="btn" onclick="closeModal()">Avbryt</button><button class="btn primary" onclick="bekreftImport()">Importer</button></div>`);
}
function bekreftImport(){
  for(const k of UI._imp){ const x=S.kunder.find(y=>y.nr===k.nr);
    if(x) Object.assign(x,{navn:k.navn,adresse:k.adresse,postnr:k.postnr,sted:k.sted||x.sted||'',tlf:k.tlf,kontakt:k.kontakt||x.kontakt||''});
    else S.kunder.push(Object.assign({produsentnr:''},k)); }
  S.kunder.sort((a,b)=>a.nr-b.nr); const n=UI._imp.length; UI._imp=null; save(); closeModal(); render(); toast(n+' kunder importert');
}

    <label class="f">Passord</label><input type="password" id="li-p" autocomplete="current-password">
    <button class="btn primary" style="width:100%;margin-top:16px" id="li-b">Logg inn</button></form>
    <div style="text-align:center;margin-top:12px"><button class="linkbtn" onclick="visGlemt()">Glemt passord?</button></div>`);
}
async function loggInnPassord(){
  const b=document.getElementById('li-b'); b.disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:document.getElementById('li-e').value.trim(), password:document.getElementById('li-p').value});
  b.disabled=false; if(error) return loginErr(oversett(error.message)); fortsett();
}
function visGlemt(){
  loginBody(`<p class="small">Skriv inn e-postadressen din, så får du en lenke for å lage nytt passord.</p>
    <label class="f">E-post</label><input type="text" id="gl-e" inputmode="email">
    <button class="btn primary" style="width:100%;margin-top:16px" onclick="sendGlemt()">Send lenke</button>
    <div style="text-align:center;margin-top:12px"><button class="linkbtn" onclick="visLogin()">Tilbake</button></div>`);
}
async function sendGlemt(){
  const {error}=await sb.auth.resetPasswordForEmail(document.getElementById('gl-e').value.trim(),{redirectTo:location.origin+location.pathname});
  if(error) return loginErr(oversett(error.message));
  loginBody(`<p>Sjekk e-posten din og trykk på lenken for å lage nytt passord.</p><div style="text-align:center;margin-top:12px"><button class="linkbtn" onclick="visLogin()">Tilbake til innlogging</button></div>`);
}
function visNyttPassord(){
  loginBody(`<p class="small">${hashType==='invite'?'Velkommen! Lag et passord for kontoen din.':'Lag et nytt passord.'} Bruk minst 10 tegn.</p>
    <form onsubmit="event.preventDefault();lagrePassord()"><label class="f">Nytt passord</label><input type="password" id="np-1" autocomplete="new-password">
    <label class="f">Gjenta passordet</label><input type="password" id="np-2" autocomplete="new-password">
    <button class="btn primary" style="width:100%;margin-top:16px">Lagre passord</button></form>`);
}
async function lagrePassord(){
  const a=document.getElementById('np-1').value, b=document.getElementById('np-2').value;
  if(a.length<10) return loginErr('Passordet må være på minst 10 tegn.'); if(a!==b) return loginErr('Passordene er ikke like.');
  const {error}=await sb.auth.updateUser({password:a}); if(error) return loginErr(oversett(error.message));
  ME.trengerPassord=false; history.replaceState(null,'',location.pathname); toast('Passordet er lagret'); fortsett();
}
let MFA_ENROLL=null;
async function visMfaOppsett(){
  const {data:lf}=await sb.auth.mfa.listFactors();
  for(const f of ((lf&&lf.all)||[]).filter(f=>f.status!=='verified')){ try{ await sb.auth.mfa.unenroll({factorId:f.id}); }catch(e){} }
  const {data,error}=await sb.auth.mfa.enroll({factorType:'totp', friendlyName:'Autentiseringsapp '+new Date().toISOString().slice(0,16)});
  if(error) return loginBody(`<p>Kunne ikke starte oppsett av to-trinns innlogging.</p><p class="small muted">${esc(oversett(error.message))}</p><button class="btn" onclick="loggUtNa()">Logg ut</button>`);
  MFA_ENROLL=data;
  loginBody(`<p><strong>Sett opp to-trinns innlogging</strong></p>
    <ol class="small" style="padding-left:18px;margin:6px 0 10px"><li>Åpne autentiseringsappen på telefonen, for eksempel Microsoft Authenticator eller Google Authenticator.</li>
    <li>Trykk + og skann QR-koden. På telefonen kan du heller kopiere koden under og legge den inn manuelt.</li><li>Skriv inn den sekssifrede koden appen viser.</li></ol>
    <div style="text-align:center;background:#fff;border-radius:10px;padding:10px"><img src="${data.totp.qr_code}" alt="QR-kode" style="width:190px;height:190px"></div>
    <div class="small muted" style="margin-top:8px;word-break:break-all;text-align:center">Kode for manuell innlegging:<br><strong style="user-select:all">${esc(data.totp.secret)}</strong></div>
    <form onsubmit="event.preventDefault();bekreftMfaOppsett()"><label class="f">Sekssifret kode</label><input type="text" id="mf-c" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
    <button class="btn primary" style="width:100%;margin-top:14px">Bekreft</button></form>`);
}
async function bekreftMfaOppsett(){
  const {error}=await sb.auth.mfa.challengeAndVerify({factorId:MFA_ENROLL.id, code:document.getElementById('mf-c').value.trim()});
  if(error) return loginErr(oversett(error.message)); toast('To-trinns innlogging er slått på'); fortsett();
}
function visMfaKode(){
  loginBody(`<p class="small">Skriv inn koden fra autentiseringsappen.</p>
    <form onsubmit="event.preventDefault();bekreftMfaKode()"><label class="f">Sekssifret kode</label><input type="text" id="mk-c" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
    <button class="btn primary" style="width:100%;margin-top:14px">Fortsett</button></form>
    <div style="text-align:center;margin-top:12px"><button class="linkbtn" onclick="loggUtNa()">Logg inn med en annen konto</button></div>`);
  setTimeout(()=>{ const i=document.getElementById('mk-c'); if(i) i.focus(); },50);
}
async function bekreftMfaKode(){
  const {data:lf}=await sb.auth.mfa.listFactors(); const f=(lf&&lf.totp||[])[0]; if(!f) return fortsett();
  const {error}=await sb.auth.mfa.challengeAndVerify({factorId:f.id, code:document.getElementById('mk-c').value.trim()});
  if(error) return loginErr(oversett(error.message)); fortsett();
}
async function fortsett(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ ME.user=null; return visLogin(); }
  ME.user=session.user;
  const {data:aal}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  const harFaktor = aal && aal.nextLevel==='aal2';
  if(harFaktor && aal.currentLevel!=='aal2') return visMfaKode();
  if(ME.trengerPassord) return visNyttPassord();
  if(!harFaktor) return visMfaOppsett();
  let m=null;
  try{
    const {data,error}=await sb.from('medlemmer').select('*').eq('user_id',ME.user.id).maybeSingle(); if(error) throw error; m=data;
    if(m){ const {data:p}=await sb.from('praksiser').select('navn,live').eq('id',m.praksis_id).maybeSingle(); m.praksisNavn=p?p.navn:''; m.live=!!(p&&p.live); }
    // Overgang fra test til ekte drift: kast testdata som ligger lagret på denne enheten, så de ikke lastes opp igjen
    if(m && m.live){ try{ const f=JSON.parse(localStorage.getItem('vet5-medlem-'+ME.user.id)||'null'); if(!f || !f.live) localStorage.removeItem('vet5-cache-'+ME.user.id); }catch(e){} }
    if(m) try{ localStorage.setItem('vet5-medlem-'+ME.user.id, JSON.stringify(m)); }catch(e){}
  }catch(e){ try{ m=JSON.parse(localStorage.getItem('vet5-medlem-'+ME.user.id)||'null'); }catch(x){} }
  if(!m) return loginBody(`<p><strong>Kontoen din har ikke tilgang ennå.</strong></p><p class="small muted">Du er logget inn som ${esc(ME.user.email)}, men kontoen er ikke koblet til en praksis. Be administrator kjøre roller.sql med denne e-postadressen.</p><button class="btn" onclick="loggUtNa()">Logg ut</button>`);
  ME.medlem=m; ME.praksis=m.praksisNavn||''; UI.role = m.rolle==='veterinaer' ? 'mia' : 'erik';
  if(m.rolle==='veterinaer' && !(await journalnokkel())) return;
  loginEl().style.display='none'; cacheLoad(); render(); sync();
}
function loggUt(){
  modal(`<h2>Logge ut?</h2><p class="small muted">${SYNC.dirty?'<strong>Noen endringer er ikke lagret på serveren ennå.</strong> ':''}Lokal kopi på denne enheten slettes. Dataene ligger trygt på serveren.</p>
  <div class="row" style="justify-content:flex-end;gap:8px"><button class="btn" onclick="closeModal()">Avbryt</button><button class="btn primary" onclick="closeModal();loggUtNa()">Logg ut</button></div>`);
}
async function loggUtNa(){
  if(SYNC.dirty){ try{ await sync(); }catch(e){} }
  if(ME.user){ try{ localStorage.removeItem('vet5-cache-'+ME.user.id); localStorage.removeItem('vet5-medlem-'+ME.user.id); }catch(e){} if(ME.medlem) await NOKKELLAGER.slett(nokkelId()); }
  JN=null; NOKLER=null;
  await sb.auth.signOut();
  S={kunder:[],oppdrag:[],maler:[],varer:[],medisiner:[],vakter:[]}; SYNC.base={}; ME.user=null; ME.medlem=null;
  document.getElementById('main').innerHTML=''; document.getElementById('syncbar').innerHTML=''; const fab=document.getElementById('fab'); if(fab) fab.remove(); visLogin();
}

// ================= Lokal kopi =================
const SYNC = {state:'idle', dirty:false, timer:null, running:false, again:false, last:null, base:{}, feil:''};
const TOM = () => ({kunder:[],oppdrag:[],maler:[],varer:[],medisiner:[],vakter:[]});
let SISTE_KOPI = null;
function cacheSave(){ if(!ME.user) return; try{ localStorage.setItem('vet5-cache-'+ME.user.id, JSON.stringify({S, base:SYNC.base})); }catch(e){} }
function cacheLoad(){
  try{ const c=JSON.parse(localStorage.getItem('vet5-cache-'+ME.user.id)||'null'); if(c && c.S){ S=Object.assign(TOM(), c.S); SYNC.base=c.base||{}; } }catch(e){}
  SYNC.dirty = Object.keys(endredeNokler()).length>0;
}

// ================= Synkronisering =================
const P = () => ME.medlem.praksis_id;
// k=kunder, o=oppdrag(+journal), m=maler, v=varer, l=legemidler, w=vakter
const SAML = [['k','kunder',x=>x.nr],['o','oppdrag',x=>x.id],['m','maler',x=>x.id],['v','varer',x=>x.nr],['l','medisiner',x=>x.id],['w','vakter',x=>x.id]];
const nokler = () => { const m={}; for(const [p,a,key] of SAML) (S[a]||[]).forEach(x=>m[p+':'+key(x)]=x); return m; };
function endredeNokler(){ const m=nokler(), out={}; for(const k in m){ if(JSON.stringify(m[k])!==SYNC.base[k]) out[k]=m[k]; } return out; }
const tilKunde = k => ({praksis_id:P(), nr:k.nr, navn:k.navn, kontakt:k.kontakt||null, adresse:k.adresse||null, postnr:k.postnr||null, sted:k.sted||null, tlf:k.tlf||null, produsentnr:k.produsentnr||null});
const tilOppdrag = o => ({id:o.id, praksis_id:P(), kundenr:o.kundenr, dato:o.dato, tid:o.tid||null, status:o.status, fakturer:!!o.fakturer, fakturert:!!o.fakturert,
  fakturert_ts:o.fakturertTs||null, ferdig_ts:o.ferdigTs||null, henvendelse_ts:o.henvendelseTs||null, utsatt_fra:o.utsattFra||null, linjer:o.linjer||[],
  med_sum:Math.round(alleMedLinjer(o).reduce((s,m)=>s+(+m.antall||0)*(+m.pris||0),0)*100)/100, vakt:(o.vakt===true||o.vakt===false)?o.vakt:null, dhp_ts:o.dhpTs||null, opprinnelig:o.opprinnelig||null});
const tilJournal = async o => ({oppdrag_id:o.id, praksis_id:P(), henvendelse:null, dyr:[], medisiner:[], journal_ts:o.journalTs||null,
  kryptert: await KRYPTO.krypter(JN, {henvendelse:o.henvendelse||'', dyr:o.dyr||[], flokk:o.flokk||[]})});
async function journalKlartekst(j){ if(!j) return null; if(j.kryptert){ const d=await KRYPTO.dekrypter(JN, j.kryptert); return Object.assign({journal_ts:j.journal_ts}, d); } return {journal_ts:j.journal_ts, henvendelse:j.henvendelse, dyr:j.dyr, medisiner:j.medisiner}; }
const tilMal = m => ({id:m.id, praksis_id:P(), deleted:!!m.deleted, data:{navn:m.navn, tjenester:m.tjenester, diagnose:m.diagnose, behandling:m.behandling, notat:m.notat, medisiner:m.medisiner}});
const tilVare = v => ({praksis_id:P(), nr:v.nr, navn:v.navn, pris:v.pris, enhet:v.enhet||null, konto:v.konto||3020, type:v.type||'Normal', aktiv:v.aktiv!==false});
const tilLegemiddel = m => ({id:m.id, praksis_id:P(), navn:m.navn, pris:+m.pris||0, enhet:m.enhet||null, aktiv:m.aktiv!==false});
const tilVakt = w => ({id:w.id, praksis_id:P(), fra:w.fra, til:w.til, serie:w.serie||null, deleted:!!w.deleted});
const fraKunde = r => ({nr:r.nr, navn:r.navn, kontakt:r.kontakt||'', adresse:r.adresse||'', postnr:r.postnr||'', sted:r.sted||'', tlf:r.tlf||'', produsentnr:r.produsentnr||''});
function fraOppdrag(r,j){
  let dyr = j ? (j.dyr||[]) : [];
  dyr = dyr.map(d=>Object.assign({medisiner:[]},d));
  const gamle = j && Array.isArray(j.medisiner) ? j.medisiner : [];   // eldre format: medisiner på oppdraget
  if(gamle.length && !dyr.some(d=>d.medisiner.length)){
    const ms=gamle.map(m=>({id:uid(),navn:m.navn,antall:m.antall,pris:m.pris,tid:m.tid||j.journal_ts||r.henvendelse_ts||nowTs()}));
    if(dyr.length) dyr[0].medisiner=ms; else dyr=[{id:uid(),art:'Storfe',individ:'',diagnose:'',behandling:'',notat:'',medisiner:ms}];
  }
  return {id:r.id, nr:r.nr||null, kundenr:r.kundenr, dato:r.dato, tid:r.tid||'', status:r.status, fakturer:r.fakturer, fakturert:r.fakturert,
    fakturertTs:r.fakturert_ts, ferdigTs:r.ferdig_ts, henvendelseTs:r.henvendelse_ts, utsattFra:r.utsatt_fra||undefined, linjer:r.linjer||[], medSum:+r.med_sum||0,
    vakt:(r.vakt===true||r.vakt===false)?r.vakt:null, dhpTs:r.dhp_ts||null, opprinnelig:r.opprinnelig||null,
    henvendelse: j?(j.henvendelse||''):'', dyr, flokk: j?(j.flokk||[]):[], journalTs: j?j.journal_ts:null};
}
const fraMal = r => Object.assign({id:r.id, deleted:r.deleted}, r.data);
const fraVare = r => ({nr:r.nr, navn:r.navn, pris:r.pris==null?null:+r.pris, enhet:r.enhet||'', konto:r.konto, type:r.type||'Normal', aktiv:r.aktiv!==false});
const fraLegemiddel = r => ({id:r.id, navn:r.navn, pris:+r.pris||0, enhet:r.enhet||'', aktiv:r.aktiv!==false});
const fraVakt = r => ({id:r.id, fra:new Date(r.fra).toISOString(), til:new Date(r.til).toISOString(), serie:r.serie||null, deleted:!!r.deleted});

function scheduleSync(){ SYNC.dirty=true; clearTimeout(SYNC.timer); SYNC.timer=setTimeout(()=>sync(),1200); renderSync(); }
async function sync(){
  if(!ME.medlem) return;
  if(SYNC.running){ SYNC.again=true; return; }
  SYNC.running=true; SYNC.state='busy'; renderSync();
  const vet = ME.medlem.rolle==='veterinaer';
  const chk = r => { if(r.error) throw r.error; return r; };
  try{
    // 1. Send lokale endringer
    const ch=endredeNokler(), sendt={}, b={k:[],o:[],j:[],m:[],v:[],l:[],w:[],f:[]};
    for(const k in ch){ const x=ch[k], p=k[0];
      if(vet){ if(p==='k') b.k.push(tilKunde(x)); else if(p==='o'){ b.o.push(tilOppdrag(x)); b.j.push(await tilJournal(x)); } else if(p==='m') b.m.push(tilMal(x));
        else if(p==='v') b.v.push(tilVare(x)); else if(p==='l') b.l.push(tilLegemiddel(x)); else if(p==='w') b.w.push(tilVakt(x)); }
      else if(p==='o') b.f.push(x);
      sendt[k]=JSON.stringify(x);
    }
    if(b.k.length) chk(await sb.from('kunder').upsert(b.k));
    if(b.v.length) chk(await sb.from('varer').upsert(b.v));
    if(b.l.length) chk(await sb.from('legemidler').upsert(b.l));
    if(b.o.length) chk(await sb.from('oppdrag').upsert(b.o));
    if(b.j.length) chk(await sb.from('journal').upsert(b.j));
    if(b.m.length) chk(await sb.from('maler').upsert(b.m));
    if(b.w.length) chk(await sb.from('vakter').upsert(b.w));
    for(const o of b.f) chk(await sb.from('oppdrag').update({fakturert:!!o.fakturert, fakturert_ts:o.fakturertTs||null}).eq('id',o.id));
    for(const k in sendt) SYNC.base[k]=sendt[k];
    // 2. Hent alt
    const hent = async t => chk(await sb.from(t).select('*')).data;
    const [rk,ro,rv,rw] = [await hent('kunder'), await hent('oppdrag'), await hent('varer'), await hent('vakter')];
    const [rj,rm,rl] = vet ? [await hent('journal'), await hent('maler'), await hent('legemidler')] : [[],[],[]];
    // 3. Første gang: legg inn demodata og standardlister for veterinæren
    if(vet){
      let ny=false;
      if(!ME.medlem.live && !rk.length && !ro.length && !S.kunder.length){ const d=seedKunderOppdrag(); S.kunder=d.kunder; S.oppdrag=d.oppdrag; S.vakter=S.vakter.length?S.vakter:seedVakter(); ny=true; }
      if(!rv.length && !S.varer.length){ S.varer=seedVarer(); ny=true; }
      if(!rl.length && !S.medisiner.length){ S.medisiner=seedMedisiner(); ny=true; }
      if(!rm.length && !S.maler.length){ S.maler=seedMaler(); ny=true; }
      if(ny){ SYNC.running=false; cacheSave(); return sync(); }
    }
    const rjk=await Promise.all(rj.map(async j=>{ try{ return [j.oppdrag_id, await journalKlartekst(j)]; }catch(e){ console.error('Kunne ikke dekryptere', j.oppdrag_id, e); return [j.oppdrag_id, {journal_ts:j.journal_ts, henvendelse:'⚠ Journalen kunne ikke dekrypteres', dyr:[], flokk:[]}]; } }));
    const jmap=new Map(rjk);
    try{ const rk2=await sb.from('kopier').select('tatt').order('tatt',{ascending:false}).limit(1); if(!rk2.error && rk2.data && rk2.data[0]) SISTE_KOPI=rk2.data[0].tatt; }catch(e){}
    const remote={};
    rk.forEach(r=>remote['k:'+r.nr]=fraKunde(r));
    ro.forEach(r=>remote['o:'+r.id]=fraOppdrag(r, vet?jmap.get(r.id):null));
    rm.forEach(r=>remote['m:'+r.id]=fraMal(r));
    rv.forEach(r=>remote['v:'+r.nr]=fraVare(r));
    rl.forEach(r=>remote['l:'+r.id]=fraLegemiddel(r));
    rw.forEach(r=>remote['w:'+r.id]=fraVakt(r));
    // 4. Flett: lokale endringer som ikke er sendt, beholdes
    const lokal=nokler(), ut={};
    for(const k in lokal){ const endret = JSON.stringify(lokal[k])!==SYNC.base[k]; ut[k] = (endret || !remote[k]) ? lokal[k] : remote[k]; }
    for(const k in remote){ if(!(k in ut)) ut[k]=remote[k]; SYNC.base[k]=JSON.stringify(remote[k]); }
    const forJSON=JSON.stringify(S), ny=TOM(), map={k:'kunder',o:'oppdrag',m:'maler',v:'varer',l:'medisiner',w:'vakter'};
    for(const k in ut) ny[map[k[0]]].push(ut[k]);
    ny.kunder.sort((a,b)=>a.nr-b.nr); ny.varer.sort((a,b)=>a.nr-b.nr);
    S=ny; cacheSave(); SYNC.dirty=Object.keys(endredeNokler()).length>0; SYNC.state='ok'; SYNC.feil=''; SYNC.last=new Date();
    if(JSON.stringify(S)!==forJSON && !erIRedigering()) render(); else renderSync();
  }catch(e){ console.error(e); SYNC.state='err'; SYNC.feil=oversett(e.message||e); renderSync(); }
  finally{ SYNC.running=false; if(SYNC.again){ SYNC.again=false; setTimeout(()=>sync(),300); } }
}
const erIRedigering = () => { const a=document.activeElement; return (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) || !!document.querySelector('#modal .modal'); };
function renderSync(){
  const el=document.getElementById('syncbar'); if(!el) return; if(!ME.user||!ME.medlem){ el.innerHTML=''; return; }
  let dot='', txt='';
  if(SYNC.state==='busy'){ dot='busy'; txt='Lagrer …'; }
  else if(SYNC.state==='err'){ dot='err'; txt = navigator.onLine===false ? 'Uten nett – endringer lagres på enheten' : 'Kunne ikke lagre: '+esc(SYNC.feil); }
  else if(SYNC.dirty){ dot='busy'; txt='Venter med å lagre …'; }
  else if(SYNC.last){ dot='ok'; txt='Lagret kl. '+SYNC.last.toLocaleTimeString('nb-NO',{hour:'2-digit',minute:'2-digit'}); }
  else txt='Kobler til …';
  el.innerHTML=`<div class="syncbar"><span class="dot ${dot}"></span><span class="grow">${txt}</span>${SYNC.state==='err'?`<button class="linkbtn" onclick="sync()">Prøv igjen</button> · `:''}
    <span class="small" title="${esc(ME.user.email)}">${esc(ME.medlem.navn||ME.user.email)}</span> · <button class="linkbtn" onclick="loggUt()">Logg ut</button></div>`;
}
setInterval(()=>{ if(ME.medlem && document.visibilityState==='visible' && !SYNC.running && !erIRedigering()) sync(); }, 30000);
document.addEventListener('visibilitychange',()=>{ if(ME.medlem && document.visibilityState==='visible') sync(); });
window.addEventListener('online',()=>{ if(ME.medlem) sync(); });
window.addEventListener('beforeunload',e=>{ if(SYNC.dirty){ e.preventDefault(); e.returnValue=''; } });
sb.auth.onAuthStateChange(ev=>{ if(ev==='PASSWORD_RECOVERY'){ ME.trengerPassord=true; setTimeout(fortsett,0); } if(ev==='SIGNED_OUT' && ME.medlem){ ME.medlem=null; visLogin(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
fortsett();

</script>
</body>
