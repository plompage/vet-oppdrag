<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vet-oppdrag</title>
<meta name="theme-color" content="#2f5d50">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vet-oppdrag">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1f2a26; --muted:#6b736f; --line:#e2ddd2;
  --brand:#2f5d50; --brand-2:#e7efe9; --warn:#a4541d; --warn-2:#f7e9dd; --ok:#2f6b3a; --ok-2:#e3f0e3;
  --grey-2:#ecebe6; --blue:#2c5a85; --blue-2:#e3ecf5; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 96px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{font-weight:700;color:var(--brand);letter-spacing:.2px}
.beta{font-size:11px;background:var(--warn-2);color:var(--warn);padding:2px 8px;border-radius:99px;font-weight:600}
.role{margin-left:auto;display:flex;background:var(--grey-2);border-radius:99px;padding:3px}
.role button{border:0;background:transparent;padding:5px 12px;border-radius:99px;cursor:pointer;font-size:13px;color:var(--muted)}
.role button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:6}
nav.tabs .in{max-width:760px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;cursor:pointer;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--brand);font-weight:600}
h1{font-size:22px;margin:18px 0 10px}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.right{text-align:right}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600}
.btn:hover{border-color:#cfc8b9}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.warn{color:var(--warn);border-color:#e6cbb4}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand);padding:6px 8px}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:78px;z-index:7;border-radius:99px;padding:13px 18px;box-shadow:0 4px 14px rgba(47,93,80,.35)}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.s-bestilt{background:var(--blue-2);color:var(--blue)}
.s-utsatt{background:var(--warn-2);color:var(--warn)}
.s-fullfort{background:var(--ok-2);color:var(--ok)}
.s-avlyst{background:var(--grey-2);color:var(--muted)}
.s-fakturert{background:var(--brand-2);color:var(--brand)}
.seg{display:flex;background:var(--grey-2);border-radius:10px;padding:3px;margin:4px 0 12px}
.seg button{flex:1;border:0;background:transparent;padding:7px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.item{cursor:pointer}
.item:hover{border-color:#cfc8b9}
.lines{width:100%;border-collapse:collapse}
.lines td,.lines th{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.lines th{font-size:12px;color:var(--muted);text-align:left;font-weight:600}
.lines input[type=number]{width:74px;padding:6px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px}
.x:hover{color:var(--warn)}
.picker{position:relative}
.picker .list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:10px;max-height:240px;overflow:auto;z-index:4;box-shadow:0 6px 18px rgba(0,0,0,.1)}
.picker .opt{padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.picker .opt:hover{background:var(--brand-2)}
.dyr{border:1px dashed #d7d0c1;border-radius:10px;padding:10px;margin-bottom:10px;background:#fffefb}
.lock{background:var(--grey-2);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:13px}
.banner{background:var(--warn-2);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13px;margin:12px 0}
.total{font-weight:700;font-size:16px}
.ts{font-size:12px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(20,25,23,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:620px){.modal-bg{align-items:center}}
.modal{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px;max-height:88vh;overflow:auto}
@media(min-width:620px){.modal{border-radius:16px}}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer}
.choice.on{border-color:var(--brand);background:var(--brand-2)}
.choice input{margin-top:3px}
pre.out{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;max-height:260px;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.login{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{max-width:380px;width:100%;text-align:center}
.login-logo{width:72px;height:72px;border-radius:18px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:34px;font-weight:700}
.login h1{margin:0 0 6px;font-size:26px}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid #d6d0c4;border-radius:99px;padding:12px 22px;font-weight:600;cursor:pointer;font-size:15px;margin-top:22px}
.gbtn:hover{border-color:#bdb5a5}
.syncbar{max-width:760px;margin:0 auto;padding:4px 14px 6px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#b8b2a6;flex:none}
.dot.ok{background:#3c8a4a}.dot.busy{background:#d49a2a}.dot.err{background:#c0472c}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:0;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.chip{border:1px solid #bcd3c8;background:var(--brand-2);color:var(--brand);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600;cursor:pointer}
.chip.x{background:#fff;border-color:var(--line);color:var(--ink);font-weight:500}
@media print{header.top,nav.tabs,.fab,.noprint{display:none!important}}
.kgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.kh{text-align:center;font-size:11px;color:var(--muted);padding:2px 0;font-weight:600;text-transform:uppercase}
.kd{position:relative;border:1px solid transparent;background:#fff;border-radius:8px;aspect-ratio:1/0.9;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;padding:0}
.kd.ut{opacity:.4}
.kd.vakt{background:var(--warn-2)}
.kd.idag span{font-weight:700;color:var(--brand)}
.kd.valgt{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.kd i{font-style:normal;font-size:10px;font-weight:700;background:var(--brand);color:#fff;border-radius:99px;min-width:16px;padding:0 4px;margin-top:2px;line-height:15px}
.kleg{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px}
.kleg.vakt{background:var(--warn-2);border:1px solid #e6cbb4}
.kleg.n{background:var(--brand);color:#fff;font-size:9px;font-weight:700;text-align:center;line-height:12px;border-radius:99px;width:14px}
tr.item{cursor:pointer} tr.item:hover td{background:#faf8f3}
.role button{font-size:12px}
nav.tabs button{font-size:11.5px}
.logo{white-space:nowrap}
.medrad{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:6px;background:#fff}
.medgrid{display:grid;grid-template-columns:90px 1fr;gap:8px;margin-top:4px}
.medgrid input{padding:6px 8px;margin-top:2px;min-width:0}
.medgrid label{display:block}
/* ===== Alternativ A «Arbeidsdagen» ===== */
/* Felt: 16 px hindrer at iPhone zoomer inn når et felt får fokus */
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],input[type=password],input[type=email],input[type=tel],input[type=datetime-local],select,textarea{font-size:16px;min-height:44px}
input[type=password],input[type=email],input[type=tel],input[type=datetime-local]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
textarea{min-height:76px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
input.tom{border-color:var(--warn);background:var(--warn-2)}

/* Trykkflater på minst 44 piksler */
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.sm{min-height:40px;padding:7px 12px;font-size:14px}
.btn.stor{min-height:52px;font-size:16px}
.btn.ikon{min-width:44px;padding:0 10px}
.btn.ghost{padding:8px 10px}
a.btn{text-decoration:none;color:var(--ink)}
a.btn.primary{color:#fff}
.x{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;font-size:22px;padding:0}
.chip{min-height:40px;padding:8px 14px;font-size:14px;display:inline-flex;align-items:center}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.seg button{min-height:40px;font-size:14px}
.linkbtn{font-size:15px;padding:11px 6px;margin:-11px -6px;min-height:0}
.syncbar .linkbtn{font-size:12px;padding:6px 4px;margin:-6px -4px}
label.f{font-size:13px}
.ts{font-size:13px}
.picker .opt{min-height:44px;align-items:center;padding:10px 12px}
.tilbake{margin-top:10px}

/* Bunnmeny med pluss-knapp i midten */
nav.tabs{padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{min-height:56px;font-size:12px}
nav.tabs button.tabny{color:#fff}
.tabny span{width:52px;height:52px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(47,93,80,.35);margin-top:-14px}
header.top{padding-top:env(safe-area-inset-top)}
.wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body.bred .wrap,body.bred .top-in,body.bred .syncbar,body.bred nav.tabs .in{max-width:1100px}
a{color:var(--brand)}
.sub .pris-lenke{font-size:13px;font-weight:600;color:var(--muted);text-decoration:underline dotted;text-underline-offset:3px;padding:10px 4px;margin:-10px -4px}
.toast{bottom:calc(92px + env(safe-area-inset-bottom))}
.modal{padding-bottom:calc(18px + env(safe-area-inset-bottom))}

/* Lister med rader */
.list0{padding:0;overflow:hidden}
.rad{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;font:inherit;color:inherit}
button.rad{cursor:pointer}
button.rad:hover{background:#faf8f3}
.list0>.rad:first-child{border-top:0}
.rad .tid{min-width:48px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--brand);font-size:14px}
.rad .sub{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.pil{color:#b5ae9f;flex:none}
.blk{display:block}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin:0}
.tall{background:var(--warn);color:#fff;border-radius:99px;font-size:12px;font-weight:700;padding:1px 8px}
.varsel{color:var(--warn);font-weight:600}
.sub.varsel{color:var(--warn)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.2px}
button.card{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}

/* I dag */
.gj{border-color:#e6cbb4}
.gjhode{padding:10px 14px 6px}
.neste{border:2px solid var(--brand);box-shadow:0 2px 10px rgba(47,93,80,.12)}
.neste h2{font-size:21px;margin:2px 0 4px}
.s-pabegynt{background:#fdf0d5;color:#8a5a00}

/* Besøket */
body.besok nav.tabs{display:none}
.handling{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px rgba(0,0,0,.05)}
.handling .in{max-width:760px;margin:0 auto;display:flex;gap:8px}
.handling .btn{min-height:52px;font-size:16px}
/* Skjul den faste knappen mens tastaturet er oppe */
@media (hover:none) and (pointer:coarse){body.besok:has(main input:focus, main textarea:focus) .handling{display:none}}
.dyrkort{padding:12px 14px}
.dyrkort .endre{color:var(--brand);font-weight:600;font-size:14px}
.tidl{color:var(--blue)}
.dyr.aapen{border:2px solid var(--brand);background:#fff;padding:12px}
.sg{display:inline-flex;flex-wrap:wrap;background:var(--grey-2);border-radius:10px;padding:3px;gap:2px}
.sg button{border:0;background:transparent;min-height:40px;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer;font-size:14px}
.sg button.on{background:var(--brand);color:#fff}
.valgt{border:1px solid var(--brand);background:var(--brand-2);border-radius:10px;padding:8px 12px;min-height:48px}
.tilleggsrad{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px 0;border-top:1px solid var(--line)}
.linje{align-items:center}
.linje .antall{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.linje .antall input{width:76px;text-align:center;font-weight:700}
.linje .pris{width:96px;min-height:36px;padding:4px 8px;display:inline-block}
.sel-liten{width:auto;max-width:100%;padding:6px 10px}
.medgrid{grid-template-columns:96px 1fr}
.kv{font-size:15px;gap:6px 14px;grid-template-columns:auto minmax(0,1fr)}
.kv>div{min-width:0;overflow-wrap:anywhere}
.kv select{width:100%;max-width:100%}
.grid2>*,.grid3>*,.medgrid>*{min-width:0}
img,table{max-width:100%}

/* Fakturering på stor skjerm */
.fakt{display:block}
@media(min-width:900px){body.bred .fakt{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:10px;align-items:start}body.bred .fakt .card{margin:0}}
@media print{.handling{display:none!important}}

/* Fakturering: sum for perioden */
.sumkort .stortall{font-size:28px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
/* Lønnsberegning */
.lonnhode{padding:12px 14px 8px}
.fordeling{display:flex;height:14px;border-radius:7px;overflow:hidden;margin-top:10px;gap:2px}
.fordeling span{display:block;min-width:3px}
.lonnrad{min-height:50px}
.lonnrad strong{font-variant-numeric:tabular-nums;white-space:nowrap}
.lonnrad.hoved strong{font-size:19px;color:var(--brand)}
.prikk{width:12px;height:12px;border-radius:3px;flex:none}
.kv.lonnkv{grid-template-columns:minmax(0,1fr) auto}
.lonnkv>div:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <span class="logo">Vet-oppdrag</span><span class="beta" id="beta">Test</span>
  <div class="role" id="role"></div>
</div></header>
<div id="syncbar"></div>
<main class="wrap" id="main"></main>
<div class="login" id="login" style="display:none"><div class="login-card">
  <div class="login-logo">V</div>
  <h1>Vet-oppdrag</h1>
  <div class="muted" style="margin-bottom:18px">Oppdrag, journal og fakturagrunnlag</div>
  <div id="login-body" style="text-align:left"></div>
  <div id="login-err" class="small" style="color:var(--warn);margin-top:12px"></div>
  <div class="small muted" style="margin-top:24px;text-align:left">Journaler krypteres på enheten før de lagres. Ingen andre enn veterinæren kan lese dem.</div>
</div></div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div id="modal"></div>

// ================= Kryptering av journal =================
// Journalnøkkel: tilfeldig AES-GCM 256. Lagres på serveren låst (wrapped) med
// (1) en nøkkel avledet av journalpassordet (PBKDF2-SHA256, 600 000 runder) og
// (2) en nøkkel avledet av gjenopprettingsnøkkelen (PBKDF2-SHA256, 100 000 runder).
// Journaltekst krypteres med AES-GCM og tilfeldig IV: "v1:<iv base64>:<chiffertekst base64>".
const KRYPTO = {
  ITER_PASS: 600000, ITER_GJEN: 100000,
  b64: buf => { const b=new Uint8Array(buf); let s=''; for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); },
  unb64: s => Uint8Array.from(atob(s), c=>c.charCodeAt(0)),
  rnd: n => crypto.getRandomValues(new Uint8Array(n)),
  async kek(hemmelig, saltB64, iter){
    const base=await crypto.subtle.importKey('raw', new TextEncoder().encode(hemmelig.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt:KRYPTO.unb64(saltB64), iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['wrapKey','unwrapKey']);
  },
  async wrap(jn, hemmelig, iter){
    const salt=KRYPTO.b64(KRYPTO.rnd(16)), iv=KRYPTO.rnd(12);
    const ct=await crypto.subtle.wrapKey('raw', jn, await KRYPTO.kek(hemmelig, salt, iter), {name:'AES-GCM', iv});
    return {salt, iter, iv:KRYPTO.b64(iv), ct:KRYPTO.b64(ct)};
  },
  async unwrap(w, hemmelig, uttrekkbar){
    return crypto.subtle.unwrapKey('raw', KRYPTO.unb64(w.ct), await KRYPTO.kek(hemmelig, w.salt, w.iter), {name:'AES-GCM', iv:KRYPTO.unb64(w.iv)}, {name:'AES-GCM'}, !!uttrekkbar, ['encrypt','decrypt']);
  },
  nyNokkel: () => crypto.subtle.generateKey({name:'AES-GCM', length:256}, true, ['encrypt','decrypt']),
  // Gjenopprettingsnøkkel: 20 tilfeldige byte som 32 tegn base32 (uten 0/O/1/I), i grupper på fire
  nyGjenoppretting(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const b=KRYPTO.rnd(32); let s=''; for(let i=0;i<32;i++) s+=A[b[i]%32]; return s.match(/.{4}/g).join('-'); },
  normGjen: s => String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').match(/.{1,4}/g)?.join('-') || '',
  async krypter(jn, obj){
    const iv=KRYPTO.rnd(12);
    const ct=await crypto.subtle.encrypt({name:'AES-GCM', iv}, jn, new TextEncoder().encode(JSON.stringify(obj)));
    return 'v1:'+KRYPTO.b64(iv)+':'+KRYPTO.b64(ct);
  },
  async dekrypter(jn, s){
    const [v,iv,ct]=String(s).split(':'); if(v!=='v1') throw new Error('Ukjent krypteringsformat');
    const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:KRYPTO.unb64(iv)}, jn, KRYPTO.unb64(ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
};

function rangert(liste, q, tekst){

const STANDARD_FAV = ['Grunnhonorar','Kjøring','Kjøring vakt','Utstyr','Timespris klinisk arbeid'];
function mestBrukteVarer(n, unntatt){

// «Drektighetsundersøkelse første 5 stk» + «Drektighetsundersøkelse stk»: den første varen én gang, deretter én per dyr
const vareNokkel = s => String(s||'').toLowerCase().replace(/påfølgende/g,' ').replace(/[,.]/g,' ').replace(/\s+/g,' ').trim();
function stykkRegel(m){
  if(!m) return null;
  const vs=(m.tjenester||[]).map(nr=>S.varer.find(v=>v.nr===nr)).filter(Boolean);
  for(const f of vs){
    const t=f.navn.match(/^(.*?)\s*første\s+(\d+)(\s*stk\.?)?\s*$/i); if(!t) continue;
    const base=vareNokkel(t[1]), s=vs.find(v=>v!==f && vareNokkel(v.navn)===base+' stk');
    if(s) return {forste:f, n:+t[2], stk:s};
  }
  return null;
}
const antallMedMal = (o,id) => (o.dyr||[]).filter(d=>d.mal===id).reduce((s,d)=>s+(d.gruppe?(+d.antall||0):1),0);
function oppdaterStykkTjenester(o, m){
  const r=stykkRegel(m); if(!r) return;
  const n=antallMedMal(o,m.id);
  const sett=(v,a)=>{ const i=o.linjer.findIndex(l=>l.varenr===v.nr); if(a<=0){ if(i>=0) o.linjer.splice(i,1); return; } if(i>=0) o.linjer[i].antall=a; else o.linjer.push({varenr:v.nr,navn:v.navn,antall:a,pris:v.pris||0}); };
  sett(r.forste, n>0?1:0); sett(r.stk, Math.max(0,n-r.n));
}
function sjekk(o){
  const ut=[], dyr=o.dyr||[], fl=n=>n===1?'registrering':'registreringer';
  const utenId=dyr.filter(manglerId).length; if(utenId) ut.push({t:`${utenId} dyr mangler øremerke`, fane:'behandling'});
  const utenDiag=dyr.filter(d=>!(d.diagnose||'').trim()).length; if(utenDiag) ut.push({t:`${utenDiag} ${fl(utenDiag)} mangler diagnose`, fane:'behandling'});
  const grUten=dyr.filter(d=>d.gruppe && !(+d.antall>0)).length; if(grUten) ut.push({t:`${grUten===1?'En gruppe':grUten+' grupper'} mangler antall dyr`, fane:'behandling'});
  const tomme=dyr.filter(d=>/__/.test((d.diagnose||'')+(d.behandling||''))).length; if(tomme) ut.push({t:`Tomme felt (__) fra malen i ${tomme} ${fl(tomme)}`, fane:'behandling'});
  const linjer=o.linjer||[];
  if(!linjer.length) ut.push({t:'Ingen tjenester eller varer er lagt inn', fane:'avslutt'});
  linjer.filter(l=>!(+l.antall>0)).forEach(l=>ut.push({t:`${l.navn}: antall mangler`, fane:'avslutt'}));
  linjer.filter(l=>+l.antall>0 && !(+l.pris>0)).forEach(l=>ut.push({t:`${l.navn} har ingen pris`, fane:'avslutt'}));
  if(kjFeil(o)) ut.push({t: paVakt(o) ? 'Besøket er på vakt, men har vanlig kjøring' : 'Besøket er ikke på vakt, men har kjøring vakt', fane:'avslutt'});
  return ut;
}

function gjoremal(){

    ${kj.length?`<div class="row wrapf" style="gap:6px;margin-top:8px"><span class="ts" style="width:100%">Behandlet her før:</span>${kj.map(x=>`<button class="chip" onclick="velgKjent(${i},${js(x.individ)},${js(x.art)})">${esc(kortId(x.individ))} · ${esc(kortTekst(x.diagnose,18).toLowerCase())} ${esc(fmtKort(x.dato))}</button>`).join('')}</div>`:''}
    ${opts?`<label class="f">Resultat</label><div class="sg">${opts.map(v=>`<button class="${d.resultat===v?'on':''}" onclick="settResultat(${i},${js(v)})">${esc(v)}</button>`).join('')}</div>`:''}
    <label class="f" for="dia-${d.id}">Diagnose</label><input type="text" id="dia-${d.id}" value="${esc(d.diagnose)}" oninput="dyrSetLive(${i},'diagnose',this.value)">

    <label class="f">${d.gruppe?'Medisiner til gruppen, mengde totalt':'Medisiner gitt til dette dyret'}</label>
    ${med.map((m,j)=>`<div class="medrad"><div class="row between"><strong class="small grow">${esc(m.navn)}</strong><span class="ts">${kr(m.pris)} kr</span><button class="x" onclick="fjernMed(${i},${j})" aria-label="Fjern ${esc(m.navn)}">×</button></div>
      <div class="medgrid"><label class="ts">Mengde<input type="number" min="0" step="any" inputmode="decimal" value="${m.antall}" oninput="medSetLive(${i},${j},this.value)"></label>
      <label class="ts">Gitt<input type="datetime-local" value="${localInput(m.tid||nowTs())}" onchange="medSet(${i},${j},'tid',this.value)"></label></div></div>`).join('')}
    <div class="picker" style="margin-top:6px"><input type="search" placeholder="+ Legg til medisin (søk)" oninput="medPick(this.value,${i})" autocomplete="off" aria-label="Legg til medisin"><div id="pick-med-${i}"></div></div>
    <div class="row between" style="margin-top:10px">${!d.gruppe&&!erTomId(d.individ)?`<button class="linkbtn" onclick="dyrHistorikk(${js(d.individ)})">Historikk for dyret</button>`:'<span></span>'}<button class="btn ghost sm warn" onclick="fjernDyr(${i})">Fjern</button></div>
  </div>`;
}
function touchJournal(){ cur().journalTs=nowTs(); }
function dyrSet(i,f,v){ const d=cur().dyr[i]; if(!d) return; d[f]=v; touchJournal(); save(); }
function dyrSetLive(i,f,v,el){ const d=cur().dyr[i]; if(!d) return; if(f==='individ'){ const n=normId(v); if(n!==v){ v=n; if(el) el.value=n; } } d[f]=v; touchJournal(); lagreSnart(); }
function settResultat(i,v){ const d=cur().dyr[i]; d.resultat = d.resultat===v ? null : v; touchJournal(); save(); render(); }
function dyrAntall(i,v){ const o=cur(), d=o.dyr[i]; if(!d) return; d.antall = v==='' ? null : Math.max(0,Math.round(+v)); if(d.mal) oppdaterStykkTjenester(o, malById(d.mal)); touchJournal(); lagreSnart(); }
function velgKjent(i,individ,art){ const d=cur().dyr[i]; d.individ=individ; d.art=art||d.art; touchJournal(); save(); render(); }
function nyttDyr(){
  lagreNa();
  const o=cur(), art=sistArt(o), p=ID_ARTER.includes(art)?gardPrefiks(o.kundenr):'';

}
function fjernDyr(i){ modal(`<h2>Fjerne registreringen?</h2><p class="small muted">Journal og medisiner for ${cur().dyr[i].gruppe?'gruppen':'dyret'} på dette oppdraget fjernes.</p><div class="row" style="justify-content:flex-end;gap:8px"><button class="btn" onclick="closeModal()">Avbryt</button><button class="btn primary" onclick="bekreftFjernDyr(${i})">Fjern</button></div>`); }
function bekreftFjernDyr(i){ const o=cur(), d=o.dyr.splice(i,1)[0]; if(d && d.mal){ const m=malById(d.mal); if(m) oppdaterStykkTjenester(o,m); } UI.dyrApen=null; touchJournal(); save(); closeModal(); render(); }
function medSetLive(i,j,v){ const m=cur().dyr[i].medisiner[j]; m.antall=+String(v).replace(',','.')||0; touchJournal(); lagreSnart(); }
function medSet(i,j,f,v){ const m=cur().dyr[i].medisiner[j]; if(f==='tid') m.tid = v ? new Date(v).toISOString() : nowTs(); else m.antall=+v||0; touchJournal(); save(); }

}
function leggTilMed(i,id){
  const x=S.medisiner.find(m=>m.id===id); if(!x) return;

  const d=cur().dyr[+i]; d.medisiner=d.medisiner||[];

function dyrHistorikk(ind){
  lagreNa();

// Avslutt
function faneAvslutt(o,k,ed){
  if(!ed){
    let s='';
    if(o.fakturert) s+=`<div class="lock" style="margin-bottom:12px">Fakturert ${fmtTs(o.fakturertTs)}. Oppdraget er låst for endringer.</div>`;
    else if(!apen(o)) s+=`<div class="card" style="background:var(--brand-2);border-color:transparent"><div class="small">${o.status==='avlyst'?'Avlyst':'Fullført'} ${fmtTs(o.ferdigTs)}. ${fakturerbar(o)?'Klar til fakturering.':'Går ikke til fakturering.'}${harMed(o)?(o.dhpTs?' Rapportert til Dyrehelseportalen '+fmtTs(o.dhpTs)+'.':' <strong>Ikke rapportert til Dyrehelseportalen.</strong>'):''}</div>${kanSkrive()?`<button class="btn sm" style="margin-top:8px" onclick="gjenapne()">Åpne igjen for endringer</button>`:''}</div>`;
    return s+tjenesterLes(o)+sumKort(o);
  }
  let h=`<h3>Tjenester og varer</h3><div class="card list0">`;
  if(!o.linjer.length) h+=`<div style="padding:12px 14px"><div class="small muted">Ingen tjenester er lagt inn.</div><button class="btn sm" style="margin-top:8px" onclick="leggStandard()">Legg til grunnhonorar og ${paVakt(o)?'kjøring vakt':'kjøring'}</button></div>`;
  h+=o.linjer.map((l,i)=>{ const v=S.varer.find(x=>x.nr===l.varenr), enh=((v&&v.enhet)||'').toLowerCase();
    const fri = !v || v.pris==null || !(+v.pris>0) || v.type==='Beløp' || +l.pris!==+v.pris || UI.prisApen===i;
    const pris = fri ? `à <input class="pris" type="number" min="0" step="any" inputmode="decimal" value="${l.pris}" oninput="linjePrisLive(${i},this.value)" aria-label="Pris for ${esc(l.navn)}"> kr${enh?' per '+esc(enh):''}`
      : `<button class="linkbtn pris-lenke" onclick="UI.prisApen=${i};render()" aria-label="Endre prisen for ${esc(l.navn)}">à ${kr(l.pris)} kr${enh?' per '+esc(enh):''}</button>`;
    return `<div class="rad linje"><span class="grow"><strong class="blk">${esc(l.navn)}</strong><span class="sub">${pris} · sum <span id="ls-${i}">${kr(l.antall*l.pris)} kr</span></span></span>
      <label class="antall"><input type="number" min="0" step="any" inputmode="decimal" value="${l.antall}" class="${+l.antall>0?'':'tom'}" oninput="linjeSetLive(${i},this.value)" aria-label="Antall ${esc(l.navn)}"><span class="ts">${esc(enh||'stk')}</span></label>
      <button class="x" onclick="fjernLinje(${i})" aria-label="Fjern ${esc(l.navn)}">×</button></div>`; }).join('');
  if(kjFeil(o)) h+=`<div class="rad" style="background:#fdf6ef">${IK.varsel}<span class="grow small">${paVakt(o)?'Besøket er på vakt, men har vanlig kjøring.':'Besøket er ikke på vakt, men har kjøring vakt.'}</span><button class="btn sm" onclick="byttKjoring()">Bytt</button></div>`;
  const fav=mestBrukteVarer(4, new Set(o.linjer.map(l=>l.varenr)));
  h+=`<div class="tilleggsrad">${fav.map(v=>`<button class="chip" onclick="leggTilVare(${v.nr})">+ ${esc(v.navn)}</button>`).join('')}</div>
    <div class="picker" style="padding:8px 14px 12px"><input type="search" placeholder="Søk etter annen vare eller tjeneste" oninput="varePick(this.value)" autocomplete="off" aria-label="Søk etter vare eller tjeneste"><div id="pick-vare"></div></div></div>`;
  h+=sumKort(o);
  const s=sjekk(o);
  h+=`<h3>Sjekk før du avslutter</h3><div class="card list0">${s.length ? s.map(x=>`<button class="rad" onclick="byttFane('${x.fane}')">${IK.varsel}<span class="grow">${esc(x.t)}</span>${IK.pil}</button>`).join('') : `<div class="rad">${IK.ok}<span class="grow">Alt ser komplett ut</span></div>`}</div>`;
  h+=`<div class="row" style="gap:8px;margin-top:12px"><button class="btn grow" onclick="avlysDialog()">Avlys</button><button class="btn grow" onclick="tidspunktDialog()">Flytt</button><button class="btn grow" onclick="nyKontrollDialog()">Ny kontroll</button></div>`;
  return h;
}
function tjenesterLes(o){
  return `<h3>Tjenester og varer</h3><div class="card">${o.linjer.length?`<table class="lines"><tr><th>Vare</th><th class="right">Antall</th><th class="right">Sum</th></tr>${o.linjer.map(l=>`<tr><td>${esc(l.navn)}</td><td class="right">${fmtTall(l.antall)}</td><td class="right">${kr(l.antall*l.pris)}</td></tr>`).join('')}</table>`:'<div class="small muted">Ingen tjenester eller varer.</div>'}</div>`;
}
function sumKort(o){

  return `<div class="card"><div class="row between"><span>Medisiner${n?` · ${n} ${n===1?'linje':'linjer'}`:''} <span class="small muted">· én linje på fakturaen</span></span><span>${kr(medSum(o))} kr</span></div>
    <div class="row between total" style="margin-top:6px;padding-top:6px;border-top:1px solid var(--line)"><span>Sum eks. mva</span><span id="sum-eks">${kr(sum(o))} kr</span></div>
    <div class="row between small muted"><span>Inkl. mva</span><span id="sum-inkl">${kr(sum(o)*(1+MVA))} kr</span></div></div>`;
}
function linjeSetLive(i,v){ const l=cur().linjer[i]; if(!l) return; l.antall=+String(v).replace(',','.')||0; lagreSnart(); oppdaterSum(); }
function linjePrisLive(i,v){ const l=cur().linjer[i]; if(!l) return; l.pris=+String(v).replace(',','.')||0; lagreSnart(); oppdaterSum(); }
function oppdaterSum(){
  const o=cur(); if(!o) return;

}
function fjernLinje(i){ cur().linjer.splice(i,1); UI.prisApen=null; save(); render(); }
function leggStandard(){ standardTjenester(cur()); save(); render(); }
function varePick(q){

function leggTilVare(nr){ const v=S.varer.find(x=>x.nr===nr), o=cur(); if(!v) return; const l=o.linjer.find(x=>x.varenr===nr); if(l && !v.enhet) l.antall=(+l.antall||0)+1; else if(!l) o.linjer.push(nyLinje(v,o)); save(); render(); }

function bekreftAvlys(){ const o=cur(); o.status='avlyst'; o.fakturer=document.getElementById('avl-fak').checked; o.ferdigTs=nowTs(); save(); closeModal(); toast(o.fakturer?'Avlyst – sendes til fakturering':'Avlyst'); tilbake(); }
function gjenapne(){ const o=cur(); o.status='bestilt'; o.ferdigTs=null; o.fakturer=false; save(); render(); toast('Oppdraget er åpnet igjen'); }
function besokMeny(){
  modal(`<h2>${esc(kunde(cur().kundenr).navn)}</h2><div style="display:flex;flex-direction:column;gap:8px">

function tidspunktDialog(){
  const o=cur();

// Forslag ut fra tjenester på oppdraget og ord i henvendelsen («Drektighetsundersøkelse, 6 kyr» → malen Drektighetsundersøkelse)
const IKKE_MALORD = new Set(['storfe','kalv','kalver','sau','sauer','geit','geiter','gris','hest','hund','katt','alpakka']);
const foreslatteMaler = o => {
  const nr=new Set((o.linjer||[]).map(l=>l.varenr)), h=String(o.henvendelse||'').toLowerCase();
  const ord = m => String(m.navn||'').toLowerCase().split(/[^a-zæøå]+/).filter(w=>w.length>=5 && !IKKE_MALORD.has(w));
  return aktiveMaler().filter(m => (m.tjenester||[]).some(t=>nr.has(t)) || ord(m).some(w=>h.includes(w.slice(0,5))));
};
function malVelger(o,i){
  const d=o.dyr[i], fs=foreslatteMaler(o).filter(m=>m.id!==d.mal).slice(0,3), alle=aktiveMaler(), brukt=d.mal?malById(d.mal):null;
  return `<div class="row wrapf" style="gap:6px;align-items:center;margin:8px 0 2px">

    ${fs.length?`<span class="small muted">${brukt?'Annen:':'Foreslått mal:'}</span>${fs.map(m=>`<button class="chip" onclick="brukMal(${i},'${m.id}')">${esc(m.navn)}</button>`).join('')}`:''}

      <option value="">${fs.length||brukt?'Annen mal …':'Bruk journalmal …'}</option>${alle.map(m=>`<option value="${m.id}">${esc(m.navn)}</option>`).join('')}</select></div>`;
}
function brukMal(i,id){
  const o=cur(), d=o.dyr[i], m=malById(id); if(!m) return;
  const join=(a,b)=> !b ? a : (a && a.trim() ? (a.includes(b.trim()) ? a : a.trim()+'\n'+b) : b);
  d.diagnose = d.diagnose && d.diagnose.trim() ? d.diagnose : m.diagnose;
  d.behandling = join(d.behandling, m.behandling); d.notat = join(d.notat, m.notat);
  d.medisiner=d.medisiner||[]; let n=0;
  (m.medisiner||[]).forEach(x=>{ const med=S.medisiner.find(y=>y.navn===x.navn && y.aktiv!==false); if(!med) return;
    if(!d.medisiner.find(y=>y.navn===x.navn)){ d.medisiner.push({id:uid(),navn:med.navn,antall:x.antall||1,pris:med.pris,tid:nowTs()}); n++; } });
  // Husk malen på dyret: gir resultatknapper og riktig antall av tjenester som «første 5 stk» + «stk»

}

      <button class="linkbtn" style="margin-left:auto" onclick="UI.kal.ym=TODAY.slice(0,7);UI.kal.dag=TODAY;render()">I dag</button></div>

function nyVaktDialog(dag){

function lagreVakt(){
  const g=+document.getElementById('nv-g').value, n=g ? Math.min(52,Math.max(1,+document.getElementById('nv-n').value||1)) : 1;

  if(!(til>fra)){ toast('Slutten må være etter starten'); return; }
  const serie = n>1 ? uid() : null;
  for(let k=0;k<n;k++){ const f=new Date(fra), t=new Date(til); f.setDate(f.getDate()+k*7*g); t.setDate(t.getDate()+k*7*g);
    S.vakter.push({id:uid(),fra:f.toISOString(),til:t.toISOString(),serie,deleted:false}); }

}

function slettVakt(id,serie){ const v=S.vakter.find(x=>x.id===id);

function dyrTreff(q){
  if(!isMia()) return [];
  const n=x=>String(x||'').replace(/\s+/g,'').toLowerCase(), nq=n(q), m={};
  S.oppdrag.forEach(o=>(o.dyr||[]).forEach(d=>{ if(d.gruppe || erTomId(d.individ) || !n(d.individ).includes(nq)) return; const x=m[d.individ]; if(!x || o.dato>x.dato) m[d.individ]={individ:d.individ, art:d.art, kundenr:o.kundenr, dato:o.dato}; }));
  return Object.values(m).sort((a,b)=>b.dato.localeCompare(a.dato)).slice(0,8);
}
const importKnapp = stor => `<label class="btn${stor?' primary stor':''}" style="cursor:pointer${stor?';width:100%':''}">Importer kunder fra fil<input type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="importerKunder(this.files[0]);this.value=''"></label>`;

  if(!S.kunder.length) return h+`<div class="empty">Ingen kunder ennå.${ed?'<br>Importer kundelisten fra Duett for å komme i gang.':''}</div>${ed?importKnapp(true):''}<div style="height:40px"></div>`;
  const kl = q ? rangert(S.kunder, q, k=>[k.navn,k.nr,k.sted,k.kontakt,k.produsentnr,k.tlf].filter(Boolean).join(' ')) : S.kunder.slice().sort((x,y)=>x.navn.localeCompare(y.navn,'nb'));
  const dt = q.length>=3 ? dyrTreff(q) : [], ot = q.length>=3 ? S.oppdrag.filter(o=>o.nr && String(o.nr).includes(q)).slice(0,6) : [];
  const ant={}; S.oppdrag.forEach(o=>{ ant[o.kundenr]=(ant[o.kundenr]||0)+1; });
  if(dt.length) h+=`<h3>Dyr</h3><div class="card list0">${dt.map(d=>`<button class="rad" onclick="dyrHistorikk(${js(d.individ)})"><span class="grow"><strong class="blk mono">${esc(d.individ)}</strong><span class="sub">${esc(d.art)} · ${esc(kunde(d.kundenr).navn)} · sist ${esc(fmtKort(d.dato))}</span></span>${IK.pil}</button>`).join('')}</div>`;
  if(ot.length) h+=`<h3>Oppdrag</h3><div class="card list0">${ot.map(o=>radOppdrag(o,true)).join('')}</div>`;
  if(q && (dt.length||ot.length) && kl.length) h+=`<h3>Kunder</h3>`;
  if(kl.length) h+=`<div class="card list0">${kl.slice(0,q?50:5000).map(k=>`<button class="rad" onclick="visKunde(${k.nr})"><span class="grow"><strong class="blk">${esc(k.navn)}</strong><span class="sub">${k.nr}${k.sted?' · '+esc(k.sted):''}${k.kontakt?' · '+esc(k.kontakt):''}</span></span>${ant[k.nr]?`<span class="ts">${ant[k.nr]} oppdrag</span>`:''}${IK.pil}</button>`).join('')}</div>`;
  else if(!dt.length && !ot.length) h+=`<div class="empty">Ingenting passer søket.</div>`;
  h+=`<div class="row wrapf" style="gap:8px;margin-top:12px"><button class="btn" onclick="avansertSok()">Avansert søk</button>${ed?importKnapp(false):''}</div>
    <div class="ts" style="margin:10px 2px 0">${S.kunder.length} kunder.</div>`;
  return h+'<div style="height:40px"></div>';

function avansertSok(){

function journalUtdrag(nr){

function fakturaData(){
  const {fra,til}=UI.periode;
  const os=S.oppdrag.filter(o=>fakturerbar(o) && (!fra||o.dato>=fra) && (!til||o.dato<=til)).sort((a,b)=>(a.dato+a.tid).localeCompare(b.dato+b.tid));
  const per={}; os.forEach(o=>{ (per[o.kundenr]=per[o.kundenr]||[]).push(o); });
  return {os, per};
}
function fakturaLinjer(o){
  const l=o.linjer.map(x=>({varenr:x.varenr,navn:x.navn,antall:+x.antall||0,pris:+x.pris||0}));
  const ms=Math.round(medSum(o)*100)/100; if(ms>0) l.push({varenr:medVare().nr,navn:'Medisiner',antall:1,pris:ms,belop:true});
  return l;
}
const oppdragTekst = o => `${oNr(o)} – ${fmtNo(o.dato)}${o.status==='avlyst'?' – Avlyst':''}`;
const fakturaSum = o => fakturaLinjer(o).reduce((a,l)=>a+l.antall*l.pris,0);
const periodeOppdrag = () => { const {fra,til}=UI.periode; return S.oppdrag.filter(o=>(!fra||o.dato>=fra) && (!til||o.dato<=til)); };

// ================= Lønnsberegning =================
// Hva Mia kan ta ut i lønn fra enkeltpersonforetaket i en periode, og hva som skal settes av til mva, skatt og sparing.
// Standard skattesats 36 %: gjennomsnittsskatt for 1,25 mill. kr i næringsinntekt og 2,6 mill. kr i gjeld med 5,31 % rente
// (SSB, utestående boliglån september 2026), etter skattereglene for 2026: trygdeavgift på næringsinntekt 10,8 %,
// trinnskatt 1,7/4,0/13,7/16,8/17,8 % fra 226 100/318 300/725 050/980 100/1 467 200 kr, og 22 % av alminnelig inntekt
// etter rentefradrag og personfradrag (114 540 kr). Det gir 36,2 %. Regjeringens forslag for 2027 gir om lag 35,5 %.
const LONN_STD = {skatt:36, spar:10};
const LONN_FARGER = {privat:'#2f5d50', spar:'#2c5a85', skatt:'#a4541d', mva:'#6b736f', kost:'#d9d3c6'};
const krHel = n => Math.round(Number(n)||0).toLocaleString('nb-NO');
const fmtProsent = n => String(n).replace('.',',')+' %';
const tallFra = v => { const n=parseFloat(String(v??'').replace(/\s/g,'').replace(',','.')); return isNaN(n) ? null : n; };
function lonnLest(){ try{ return JSON.parse(localStorage.getItem('vet5-lonn-'+ME.user.id)||'{}')||{}; }catch(e){ return {}; } }
function lonnSkriv(x){ try{ localStorage.setItem('vet5-lonn-'+ME.user.id, JSON.stringify(x)); }catch(e){} }
const lonnNokkel = () => (UI.periode.fra||'')+'_'+(UI.periode.til||'');
function lonnOppsett(){
  const l=lonnLest(), k=(l.kost||{})[lonnNokkel()]||{};
  return {skatt: l.skatt ?? LONN_STD.skatt, spar: l.spar ?? LONN_STD.spar, kost: +k.k || 0, kmva: k.i==null ? null : +k.i};
}
function lonnBeregn(){
  const ps=periodeOppdrag(), fakt=ps.filter(o=>o.fakturert), klar=ps.filter(fakturerbar), apne=ps.filter(apen);
  const Ff=fakt.reduce((s,o)=>s+fakturaSum(o),0), Fk=klar.reduce((s,o)=>s+fakturaSum(o),0), F=Ff+Fk;
  const c=lonnOppsett(), U=F*MVA, K=c.kost, I=c.kmva==null ? K*MVA : c.kmva;
  const M=U-I, Mset=Math.max(0,M), O=F-K, Sk=Math.max(0,O)*c.skatt/100;
  const R=F+U-(K+I)-Mset-Sk, Rp=Math.max(0,R), Sp=Rp*c.spar/100, P=Rp-Sp;
  return {fakt,klar,apne,Ff,Fk,F,U,K,I,M,Mset,O,Sk,R,Sp,P,c,inn:F+U};
}
function lonnResultat(){
  const b=lonnBeregn();
  if(!(b.F>0)) return `<div class="empty">Ingen fakturerte eller fullførte oppdrag i perioden.</div>`;
  const deler=[['privat','Privat konto (lønn)',b.P],['spar','Sparekonto',b.Sp],['skatt','Skattekonto',b.Sk],['mva','Mva-konto',b.Mset],['kost','Blir igjen til kostnader',b.K+b.I]].filter(d=>d[2]>=0.5);
  let h=`<div class="card list0"><div class="lonnhode"><p class="lbl">Overfør fra bedriftskontoen</p>
    <div class="fordeling" aria-hidden="true">${deler.map(([k,,v])=>`<span style="flex:${v};background:${LONN_FARGER[k]}"></span>`).join('')}</div></div>
    ${deler.map(([k,t,v])=>`<div class="rad lonnrad${k==='privat'?' hoved':''}"><span class="prikk" style="background:${LONN_FARGER[k]}"></span><span class="grow">${t}${k==='kost'?'<span class="sub">Til regningene i perioden</span>':''}</span><strong>${krHel(v)} kr</strong></div>`).join('')}
    <div class="rad lonnrad"><span class="prikk"></span><span class="grow small muted">Sum som kommer inn når kundene har betalt</span><span class="small muted">${krHel(b.inn)} kr</span></div></div>`;
  if(b.R<0) h+=`<div class="banner">Kostnadene og avsetningene er ${krHel(-b.R)} kr høyere enn det som kommer inn. Det er ikke noe å ta ut i lønn for perioden.</div>`;
  if(b.M<0) h+=`<div class="banner" style="background:var(--blue-2);color:var(--blue)">Mva på kostnadene er høyere enn mva på salget. Dere får ${krHel(-b.M)} kr tilbake i mva.</div>`;
  h+=`<h3>Slik er det regnet</h3><div class="card"><div class="kv lonnkv">
    <div>Fakturert og klart, eks. mva</div><div>${krHel(b.F)} kr</div>
    <div>Mva på salget (25 %)</div><div>${krHel(b.U)} kr</div>
    ${b.K>0?`<div>Kostnader, eks. mva</div><div>${krHel(b.K)} kr</div><div>Mva på kostnadene</div><div>${krHel(b.I)} kr</div>`:''}
    <div>Til mva-kontoen${b.K>0?' (salg minus kostnader)':''}</div><div>${krHel(b.Mset)} kr</div>
    <div>Overskudd før skatt</div><div>${krHel(b.O)} kr</div>

function dhpRader(){

    (o.dyr||[]).forEach(d=>(d.medisiner||[]).forEach(m=>{ oppd.add(o.id);
      rader.push({tid:m.tid, dato:iso(new Date(m.tid||oppdragTid(o))), kl:fmtKl(m.tid), kundenr:k.nr, kunde:k.navn, prod:k.produsentnr||'', art:d.art,
        individ: d.gruppe ? (d.antall ? d.antall+' dyr (flokk)' : 'Flokk') : (d.individ||''), utenId:manglerId(d), gruppeUtenAntall:!!d.gruppe && !(+d.antall>0),
        legemiddel:m.navn, mengde:m.antall, vakt:paVakt(o)?'Ja':'Nei', nr:o.nr||'', rapportert:!!o.dhpTs, oid:o.id}); }));
    (o.flokk||[]).forEach(m=>{ oppd.add(o.id);
      rader.push({tid:m.tid, dato:iso(new Date(m.tid||oppdragTid(o))), kl:fmtKl(m.tid), kundenr:k.nr, kunde:k.navn, prod:k.produsentnr||'', art:m.art||'', individ:m.antallDyr?m.antallDyr+' dyr (flokk)':'Flokk', legemiddel:m.navn, mengde:m.antall, vakt:paVakt(o)?'Ja':'Nei', nr:o.nr||'', rapportert:!!o.dhpTs, oid:o.id}); });

let JN = null;            // opplåst journalnøkkel (CryptoKey)

const nokkelId = () => 'jn-'+ME.user.id+'-'+ME.medlem.praksis_id;
const wrapFraRad = (r,p) => ({salt:r[p+'_salt'], iter:r[p+'_iter'], iv:r[p+'_iv'], ct:r[p+'_ct']});
const radFraWrap = (w,p) => ({[p+'_salt']:w.salt, [p+'_iter']:w.iter, [p+'_iv']:w.iv, [p+'_ct']:w.ct});

async function journalnokkel(){
  // Returnerer true når nøkkelen er klar, ellers vises riktig skjerm
  const lagret = await NOKKELLAGER.hent(nokkelId()); JN=null;
  let rad=null, nett=true;
  try{ const r=await sb.from('nokler').select('*').eq('praksis_id',ME.medlem.praksis_id).maybeSingle(); if(r.error) throw r.error; rad=r.data; }
  catch(e){ nett=false; }
  if(nett){ NOKLER=rad; try{ localStorage.setItem('vet5-nokler-'+ME.medlem.praksis_id, JSON.stringify(rad)); }catch(e){} }
  else { try{ NOKLER=JSON.parse(localStorage.getItem('vet5-nokler-'+ME.medlem.praksis_id)||'null'); }catch(e){} }
  // Bruk lagret nøkkel bare hvis den hører til gjeldende journalnøkkel (ny nøkkel etter oppstart eller gjenoppretting gir ny «opprettet»)
  if(lagret && lagret.k && NOKLER && lagret.id===NOKLER.opprettet){ JN=lagret.k; return true; }
  if(lagret) await NOKKELLAGER.slett(nokkelId());
  if(!NOKLER){ if(!nett) { loginBody('<p>Ingen kontakt med serveren. Koble til nettet for å sette opp journalpassordet.</p><button class="btn" onclick="fortsett()">Prøv igjen</button>'); return false; } visOpprettJournalpassord(); return false; }
  visLasOpp(); return false;
}

async function importerKunder(fil){
  if(!fil) return; if(!window.XLSX){ toast('Excel-biblioteket er ikke lastet. Sjekk nettet.'); return; }
  let rader; try{ const wb=XLSX.read(await fil.arrayBuffer()); rader=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''}); }catch(e){ toast('Filen kunne ikke leses'); return; }
  const hi=rader.findIndex(r=>r.some(c=>/^kundenummer\*?$/i.test(String(c).trim()))); if(hi<0){ toast('Fant ikke kolonnen «Kundenummer» i filen'); return; }
  const H=rader[hi].map(c=>String(c).trim().replace(/\*$/,'').toLowerCase());
  const col = (...navn) => { for(const n of navn){ const i=H.indexOf(n.toLowerCase()); if(i>=0) return i; } return -1; };
  const c={nr:col('Kundenummer'), navn:col('Kundenavn','Navn'), a1:col('Adresse 1','Adresse'), a2:col('Adresse 2'), pn:col('Postnummer'), ps:col('Poststed','Sted'), t1:col('Telefon 1','Telefon'), mob:col('Mobil'), kontakt:col('Kontaktperson','Kontakt')};
  const g=(r,i)=> i<0 ? '' : String(r[i]??'').trim();
  const liste=[];
  for(const r of rader.slice(hi+1)){
    const nr=parseInt(g(r,c.nr),10), navn=g(r,c.navn); if(!nr || !navn) continue;
    let pn=g(r,c.pn); if(/^\d{1,4}$/.test(pn)) pn=pn.padStart(4,'0');
    liste.push({nr, navn, adresse:[g(r,c.a1),g(r,c.a2)].filter(Boolean).join(', '), postnr:pn, sted:g(r,c.ps), tlf:g(r,c.t1)||g(r,c.mob), kontakt:g(r,c.kontakt)});
  }
  if(!liste.length){ toast('Fant ingen kunder i filen'); return; }
  const nye=liste.filter(k=>!S.kunder.some(x=>x.nr===k.nr)).length;
  UI._imp=liste;
  modal(`<h2>Importere kunder?</h2><p>Fant <strong>${liste.length}</strong> kunder i filen: ${nye} nye og ${liste.length-nye} som oppdateres.</p>
    <p class="small muted">Kunder som finnes fra før, får oppdatert navn, adresse og telefon. Produsentnummer og oppdrag beholdes.${c.ps<0?' Filen har ikke poststed, så det feltet blir stående tomt.':''}</p>
    <div class="row" style="justify-content:flex-end;gap:8px;margin-top:12px"><button class="btn" onclick="closeModal()">Avbryt</button><button class="btn primary" onclick="bekreftImport()">Importer</button></div>`);
}
function bekreftImport(){
  for(const k of UI._imp){ const x=S.kunder.find(y=>y.nr===k.nr);
    if(x) Object.assign(x,{navn:k.navn,adresse:k.adresse,postnr:k.postnr,sted:k.sted||x.sted||'',tlf:k.tlf,kontakt:k.kontakt||x.kontakt||''});
    else S.kunder.push(Object.assign({produsentnr:''},k)); }
  S.kunder.sort((a,b)=>a.nr-b.nr); const n=UI._imp.length; UI._imp=null; save(); closeModal(); render(); toast(n+' kunder importert');
}

async function fortsett(){

  if(ME.trengerPassord) return visNyttPassord();
  if(!harFaktor) return visMfaOppsett();
  let m=null;
  try{
    const {data,error}=await sb.from('medlemmer').select('*').eq('user_id',ME.user.id).maybeSingle(); if(error) throw error; m=data;
    if(m){ const {data:p}=await sb.from('praksiser').select('navn,live').eq('id',m.praksis_id).maybeSingle(); m.praksisNavn=p?p.navn:''; m.live=!!(p&&p.live); }

    if(m && m.live){ try{ const f=JSON.parse(localStorage.getItem('vet5-medlem-'+ME.user.id)||'null'); if(!f || !f.live) localStorage.removeItem('vet5-cache-'+ME.user.id); }catch(e){} }
    if(m) try{ localStorage.setItem('vet5-medlem-'+ME.user.id, JSON.stringify(m)); }catch(e){}

  if(!ME.medlem || UI.role!==rolle){ UI.view = rolle==='mia' ? 'idag' : 'eksport'; UI.current=null; UI.retur=null; }
  ME.medlem=m; ME.praksis=m.praksisNavn||''; UI.role = rolle;

}

function cacheSave(){ if(!ME.user) return; try{ localStorage.setItem('vet5-cache-'+ME.user.id, JSON.stringify({S, base:SYNC.base})); }catch(e){} }
function cacheLoad(){
  try{ const c=JSON.parse(localStorage.getItem('vet5-cache-'+ME.user.id)||'null'); if(c && c.S){ S=Object.assign(TOM(), c.S); SYNC.base=c.base||{}; S.oppdrag.forEach(migrerFlokk); } }catch(e){}
  SYNC.dirty = Object.keys(endredeNokler()).length>0;
}

// ================= Synkronisering =================
const P = () => ME.medlem.praksis_id;
// Supabase gir høyst 1000 rader per spørring. Hent i sider så ingenting faller bort når datamengden vokser.
const SORTERING = {kunder:'nr', varer:'nr', journal:'oppdrag_id', nokler:'praksis_id', medlemmer:'user_id'};
async function hentAlle(t, side=1000){
  const ut=[];
  for(let fra=0;;fra+=side){
    const r=await sb.from(t).select('*').eq('praksis_id',P()).order(SORTERING[t]||'id',{ascending:true}).range(fra,fra+side-1);
    if(r.error) throw r.error; ut.push(...r.data); if(r.data.length<side) return ut;
  }
}
// k=kunder, o=oppdrag(+journal), m=maler, v=varer, l=legemidler, w=vakter
const SAML = [['k','kunder',x=>x.nr],['o','oppdrag',x=>x.id],['m','maler',x=>x.id],['v','varer',x=>x.nr],['l','medisiner',x=>x.id],['w','vakter',x=>x.id]];
const nokler = () => { const m={}; for(const [p,a,key] of SAML) (S[a]||[]).forEach(x=>m[p+':'+key(x)]=x); return m; };
function endredeNokler(){ const m=nokler(), out={}; for(const k in m){ if(JSON.stringify(m[k])!==SYNC.base[k]) out[k]=m[k]; } return out; }
const tilKunde = k => ({praksis_id:P(), nr:k.nr, navn:k.navn, kontakt:k.kontakt||null, adresse:k.adresse||null, postnr:k.postnr||null, sted:k.sted||null, tlf:k.tlf||null, produsentnr:k.produsentnr||null});
const tilOppdrag = o => ({id:o.id, praksis_id:P(), kundenr:o.kundenr, dato:o.dato, tid:o.tid||null, status:o.status, fakturer:!!o.fakturer, fakturert:!!o.fakturert,
  fakturert_ts:o.fakturertTs||null, ferdig_ts:o.ferdigTs||null, henvendelse_ts:o.henvendelseTs||null, utsatt_fra:o.utsattFra||null, linjer:o.linjer||[],
  med_sum:Math.round(alleMedLinjer(o).reduce((s,m)=>s+(+m.antall||0)*(+m.pris||0),0)*100)/100, vakt:(o.vakt===true||o.vakt===false)?o.vakt:null, dhp_ts:o.dhpTs||null, opprinnelig:o.opprinnelig||null});
const tilJournal = async o => ({oppdrag_id:o.id, praksis_id:P(), henvendelse:null, dyr:[], medisiner:[], journal_ts:o.journalTs||null,
  kryptert: await KRYPTO.krypter(JN, {henvendelse:o.henvendelse||'', dyr:o.dyr||[], flokk:o.flokk||[]})});
async function journalKlartekst(j){ if(!j) return null; if(j.kryptert){ const d=await KRYPTO.dekrypter(JN, j.kryptert); return Object.assign({journal_ts:j.journal_ts}, d); } return {journal_ts:j.journal_ts, henvendelse:j.henvendelse, dyr:j.dyr, medisiner:j.medisiner}; }
const tilMal = m => ({id:m.id, praksis_id:P(), deleted:!!m.deleted, data:{navn:m.navn, tjenester:m.tjenester, diagnose:m.diagnose, behandling:m.behandling, notat:m.notat, medisiner:m.medisiner, resultat:m.resultat}});
const tilVare = v => ({praksis_id:P(), nr:v.nr, navn:v.navn, pris:v.pris, enhet:v.enhet||null, konto:v.konto||3020, type:v.type||'Normal', aktiv:v.aktiv!==false});
const tilLegemiddel = m => ({id:m.id, praksis_id:P(), navn:m.navn, pris:+m.pris||0, enhet:m.enhet||null, aktiv:m.aktiv!==false});
const tilVakt = w => ({id:w.id, praksis_id:P(), fra:w.fra, til:w.til, serie:w.serie||null, deleted:!!w.deleted});
const fraKunde = r => ({nr:r.nr, navn:r.navn, kontakt:r.kontakt||'', adresse:r.adresse||'', postnr:r.postnr||'', sted:r.sted||'', tlf:r.tlf||'', produsentnr:r.produsentnr||''});
function fraOppdrag(r,j){
  let dyr = j ? (j.dyr||[]) : [];
  dyr = dyr.map(d=>Object.assign({medisiner:[]},d));
  const gamle = j && Array.isArray(j.medisiner) ? j.medisiner : [];   // eldre format: medisiner på oppdraget
  if(gamle.length && !dyr.some(d=>d.medisiner.length)){
    const ms=gamle.map(m=>({id:uid(),navn:m.navn,antall:m.antall,pris:m.pris,tid:m.tid||j.journal_ts||r.henvendelse_ts||nowTs()}));
    if(dyr.length) dyr[0].medisiner=ms; else dyr=[{id:uid(),art:'Storfe',individ:'',diagnose:'',behandling:'',notat:'',medisiner:ms}];
  }
  return migrerFlokk({id:r.id, nr:r.nr||null, kundenr:r.kundenr, dato:r.dato, tid:r.tid||'', status:r.status, fakturer:r.fakturer, fakturert:r.fakturert,
    fakturertTs:r.fakturert_ts, ferdigTs:r.ferdig_ts, henvendelseTs:r.henvendelse_ts, utsattFra:r.utsatt_fra||undefined, linjer:r.linjer||[], medSum:+r.med_sum||0,
    vakt:(r.vakt===true||r.vakt===false)?r.vakt:null, dhpTs:r.dhp_ts||null, opprinnelig:r.opprinnelig||null,
    henvendelse: j?(j.henvendelse||''):'', dyr, flokk: j?(j.flokk||[]):[], journalTs: j?j.journal_ts:null});
}
const fraMal = r => Object.assign({id:r.id, deleted:r.deleted}, r.data);
const fraVare = r => ({nr:r.nr, navn:r.navn, pris:r.pris==null?null:+r.pris, enhet:r.enhet||'', konto:r.konto, type:r.type||'Normal', aktiv:r.aktiv!==false});
const fraLegemiddel = r => ({id:r.id, navn:r.navn, pris:+r.pris||0, enhet:r.enhet||'', aktiv:r.aktiv!==false});
const fraVakt = r => ({id:r.id, fra:new Date(r.fra).toISOString(), til:new Date(r.til).toISOString(), serie:r.serie||null, deleted:!!r.deleted});

function scheduleSync(){ SYNC.dirty=true; clearTimeout(SYNC.timer); SYNC.timer=setTimeout(()=>sync(),1200); renderSync(); }
async function sync(){
  if(!ME.medlem) return;
  if(SYNC.running){ SYNC.again=true; return; }
  SYNC.running=true; SYNC.state='busy'; renderSync();
  const vet = ME.medlem.rolle==='veterinaer';
  const chk = r => { if(r.error) throw r.error; return r; };
  try{
    // 1. Send lokale endringer
    const ch=endredeNokler(), sendt={}, b={k:[],o:[],j:[],m:[],v:[],l:[],w:[],f:[]};
    for(const k in ch){ const x=ch[k], p=k[0];
      if(vet){ if(p==='k') b.k.push(tilKunde(x)); else if(p==='o'){ b.o.push(tilOppdrag(x)); b.j.push(await tilJournal(x)); } else if(p==='m') b.m.push(tilMal(x));
        else if(p==='v') b.v.push(tilVare(x)); else if(p==='l') b.l.push(tilLegemiddel(x)); else if(p==='w') b.w.push(tilVakt(x)); }
      else if(p==='o') b.f.push(x);
      sendt[k]=JSON.stringify(x);
    }
    if(b.k.length) chk(await sb.from('kunder').upsert(b.k));
    if(b.v.length) chk(await sb.from('varer').upsert(b.v));
    if(b.l.length) chk(await sb.from('legemidler').upsert(b.l));
    if(b.o.length) chk(await sb.from('oppdrag').upsert(b.o));
    if(b.j.length) chk(await sb.from('journal').upsert(b.j));
    if(b.m.length) chk(await sb.from('maler').upsert(b.m));
    if(b.w.length) chk(await sb.from('vakter').upsert(b.w));
    for(const o of b.f) chk(await sb.from('oppdrag').update({fakturert:!!o.fakturert, fakturert_ts:o.fakturertTs||null}).eq('id',o.id));
    for(const k in sendt) SYNC.base[k]=sendt[k];
    // 2. Hent alt
    const hent = t => hentAlle(t);
    const [rk,ro,rv,rw] = [await hent('kunder'), await hent('oppdrag'), await hent('varer'), await hent('vakter')];
    const [rj,rm,rl] = vet ? [await hent('journal'), await hent('maler'), await hent('legemidler')] : [[],[],[]];
    // 3. Første gang: legg inn demodata og standardlister for veterinæren
    if(vet){
      let ny=false;
      if(!ME.medlem.live && !rk.length && !ro.length && !S.kunder.length){ const d=seedKunderOppdrag(); S.kunder=d.kunder; S.oppdrag=d.oppdrag; S.vakter=S.vakter.length?S.vakter:seedVakter(); ny=true; }
      if(!rv.length && !S.varer.length){ S.varer=seedVarer(); ny=true; }
      if(!rl.length && !S.medisiner.length){ S.medisiner=seedMedisiner(); ny=true; }
      if(!rm.length && !S.maler.length){ S.maler=seedMaler(); ny=true; }
      if(ny){ SYNC.running=false; cacheSave(); return sync(); }
    }
    const rjk=await Promise.all(rj.map(async j=>{ try{ return [j.oppdrag_id, await journalKlartekst(j)]; }catch(e){ console.error('Kunne ikke dekryptere', j.oppdrag_id, e); return [j.oppdrag_id, {journal_ts:j.journal_ts, henvendelse:'⚠ Journalen kunne ikke dekrypteres', dyr:[], flokk:[]}]; } }));
    const jmap=new Map(rjk);
    try{ const rk2=await sb.from('kopier').select('tatt').order('tatt',{ascending:false}).limit(1); if(!rk2.error && rk2.data && rk2.data[0]) SISTE_KOPI=rk2.data[0].tatt; }catch(e){}
    const remote={};
    rk.forEach(r=>remote['k:'+r.nr]=fraKunde(r));
    ro.forEach(r=>remote['o:'+r.id]=fraOppdrag(r, vet?jmap.get(r.id):null));
    rm.forEach(r=>remote['m:'+r.id]=fraMal(r));
    rv.forEach(r=>remote['v:'+r.nr]=fraVare(r));
    rl.forEach(r=>remote['l:'+r.id]=fraLegemiddel(r));
    rw.forEach(r=>remote['w:'+r.id]=fraVakt(r));
    // 4. Flett: lokale endringer som ikke er sendt, beholdes
    const lokal=nokler(), ut={};
    for(const k in lokal){ const endret = JSON.stringify(lokal[k])!==SYNC.base[k]; ut[k] = (endret || !remote[k]) ? lokal[k] : remote[k]; }
    for(const k in remote){ if(!(k in ut)) ut[k]=remote[k]; SYNC.base[k]=JSON.stringify(remote[k]); }
    const forJSON=JSON.stringify(S), ny=TOM(), map={k:'kunder',o:'oppdrag',m:'maler',v:'varer',l:'medisiner',w:'vakter'};
    for(const k in ut) ny[map[k[0]]].push(ut[k]);
    ny.kunder.sort((a,b)=>a.nr-b.nr); ny.varer.sort((a,b)=>a.nr-b.nr);
    S=ny; cacheSave(); SYNC.dirty=Object.keys(endredeNokler()).length>0; SYNC.state='ok'; SYNC.feil=''; SYNC.last=new Date();
    if(JSON.stringify(S)!==forJSON && !erIRedigering()) render(); else renderSync();
  }catch(e){ console.error(e); SYNC.state='err'; SYNC.feil=oversett(e.message||e); renderSync(); }
  finally{ SYNC.running=false; if(SYNC.again){ SYNC.again=false; setTimeout(()=>sync(),300); } }
}
const erIRedigering = () => { const a=document.activeElement; return (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) || !!document.querySelector('#modal .modal'); };
function renderSync(){
  const el=document.getElementById('syncbar'); if(!el) return; if(!ME.user||!ME.medlem){ el.innerHTML=''; return; }
  let dot='', txt='';
  if(SYNC.state==='busy'){ dot='busy'; txt='Lagrer …'; }
  else if(SYNC.state==='err'){ dot='err'; txt = navigator.onLine===false ? 'Uten nett – endringer lagres på enheten' : 'Kunne ikke lagre: '+esc(SYNC.feil); }
  else if(SYNC.dirty){ dot='busy'; txt='Venter med å lagre …'; }
  else if(SYNC.last){ dot='ok'; txt='Lagret kl. '+SYNC.last.toLocaleTimeString('nb-NO',{hour:'2-digit',minute:'2-digit'}); }
  else txt='Kobler til …';
  el.innerHTML=`<div class="syncbar"><span class="dot ${dot}"></span><span class="grow">${txt}</span>${SYNC.state==='err'?`<button class="linkbtn" onclick="sync()">Prøv igjen</button> · `:''}
    <span class="small" title="${esc(ME.user.email)}">${esc(ME.medlem.navn||ME.user.email)}</span> · <button class="linkbtn" onclick="loggUt()">Logg ut</button></div>`;
}
setInterval(()=>{ if(ME.medlem && document.visibilityState==='visible' && !SYNC.running && !erIRedigering()) sync(); }, 30000);
document.addEventListener('visibilitychange',()=>{ if(ME.medlem && document.visibilityState==='visible') sync(); });
window.addEventListener('online',()=>{ if(ME.medlem) sync(); });
window.addEventListener('beforeunload',e=>{ if(SYNC.dirty){ e.preventDefault(); e.returnValue=''; } });
sb.auth.onAuthStateChange(ev=>{ if(ev==='PASSWORD_RECOVERY'){ ME.trengerPassord=true; setTimeout(fortsett,0); } if(ev==='SIGNED_OUT' && ME.medlem){ ME.medlem=null; visLogin(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
fortsett();

</script>
